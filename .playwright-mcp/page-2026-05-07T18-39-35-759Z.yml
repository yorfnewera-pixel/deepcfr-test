                    - paragraph [ref=e710]: "Промпт #3. Принимаю аргументы про sampling bias и то что MDN \"верит\" всем сэмплам. PG через advantage-weighted обновление и entropy — действительно лучше для exploration в on-policy контексте. Частичный консенсус."
                    - paragraph [ref=e711]
                    - paragraph [ref=e712]: "Но оспариваю утверждение \"MDN с весами на основе регретов — это подобие PG\". Это математически неверно. Weighted MDN: Σ w_i · ∇log p(y_i|x_i) где w=regret — это supervised learning с importance weighting, не PG. PG: ∇log π(a|s) · A(s,a) — градиент по лог-вероятности политики. Разница фундаментальная: PG обновляет политику (увеличивает вероятность действий с высоким advantage), weighted MDN обновляет аппроксиматор распределения (лучше предсказывает где лежат высокие regrets). Цель разная, градиент разный."
                    - paragraph [ref=e713]
                    - paragraph [ref=e714]: "Но sampling bias — реальная проблема MDN. Это приводит меня к гибридному выводу: PG оправдан для sizing_head именно из-за on-policy nature CFR (нужен exploration, нужна advantage-weighted обновление, нужен entropy). Моя исходная позиция \"PG — overengineering\" была неверна для on-policy CFR с непрерывным пространством действий."
                    - paragraph [ref=e715]
                    - paragraph [ref=e716]: "Итог: PG нужен, но не потому что \"нет target_bet_size\" (он есть), а потому что (1) мультимодальность + (2) sampling bias + (3) advantage-weighted обновление важнее чем просто предсказание распределения. Согласен с этим резюме?"
