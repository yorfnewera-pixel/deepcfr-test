                    - heading "Ответ Gemini" [level=2] [ref=e487]
                    - generic [ref=e491]:
                      - paragraph [ref=e492]: Ваши рассуждения логичны, и вы верно подметили, что смешивание PG и CFR — это концептуальный «гибрид», который усложняет систему. Однако в контексте Deep CFR для игр с непрерывным или очень широким пространством действий (Continuous Action Space) использование Policy Gradient (PG) для сайзингов имеет под собой теоретическую и практическую базу.
                      - paragraph [ref=e493]: Давайте разберем, где ваши аргументы сталкиваются с особенностями обучения в покере.
                      - 'heading "1. Проблема MSE: «Среднее значение» вместо «Оптимального»" [level=3] [ref=e494]'
                      - paragraph [ref=e495]: Главный минус MSE-регрессии в покере — это работа с мультимодальными распределениями.
                      - list [ref=e496]:
                        - listitem [ref=e497]:
                          - paragraph [ref=e498]: "Пример: В одной и той же ситуации (например, на терне против слабого диапазона) CFR traversal может показать, что стратегия смешанная: в 50% случаев выгодно поставить 33% пота (small bet), а в 50% — 150% пота (overbet)."
                        - listitem [ref=e499]:
                          - paragraph [ref=e500]: "MSE: Попытается минимизировать ошибку и выдаст среднее арифметическое — ставку в ~91% пота. Это значение может быть катастрофически плохим (не попадает ни в один из эффективных сайзингов)."
                        - listitem [ref=e501]:
                          - paragraph [ref=e502]: "PG (с распределением): Обучает голову выдавать распределение. Если вы используете Tanh-squashed Gaussian, сеть может «раздуть» стандартное отклонение или, в случае с Mixture of Gaussians, выучить обе моды."
                      - heading "2. Динамика CFR vs RL" [level=3] [ref=e503]
                      - paragraph [ref=e504]: Вы правы, что CFR детерминирован в табличном виде. Но в Deep CFR мы аппроксимируем Advantage (регреты).
                      - list [ref=e505]:
                        - listitem [ref=e506]:
                          - paragraph [ref=e507]: Если вы используете MSE, вам нужен «target bet size». Но откуда он берется в traversal? Обычно это фиксированный набор сайзингов (дискретизация). Если же вы хотите, чтобы агент сам искал лучший сайзинг в непрерывном пространстве, у вас нет «целевого» значения до тех пор, пока вы его не попробуете.
                        - listitem [ref=e508]:
                          - paragraph [ref=e509]: PG здесь выступает как механизм исследования (exploration). Через сэмплирование из Gaussian сеть пробует разные сайзинги и получает для них регрет. PG позволяет обновлять веса так, чтобы увеличивать вероятность сайзингов с бóльшим регретом.
                      - heading "3. Где PG действительно лучше MSE" [level=3] [ref=e510]
                      - paragraph [ref=e511]:
                        - text: В вашей архитектуре
                        - code [ref=e512]: action_head
                        - text: выдает регреты для типов действий. Но регрет для "Raise" напрямую зависит от того, какой именно размер рейза был выбран.
                      - list [ref=e513]:
                        - listitem [ref=e514]:
                          - paragraph [ref=e515]:
                            - text: Если использовать MSE, вам придется в traversal делать дополнительный поиск (например, градиентный спуск по функции ценности) только ради того, чтобы найти
                            - code [ref=e516]: target_bet_size
                            - text: для обучения регрессии.
                        - listitem [ref=e517]:
                          - paragraph [ref=e518]: "PG делает это «бесплатно» в процессе игры: сэмплируем сайзинг -> получаем результат -> обновляем политику."
                      - heading "4. Ответ на ваши пункты" [level=3] [ref=e519]
                      - list [ref=e520]:
                        - listitem [ref=e521]:
                          - paragraph [ref=e522]:
                            - text: "Shared Base Network: Да, градиенты от"
                            - code [ref=e523]: action_head
                            - text: помогают, но они обучают представление (features), а не конкретное отображение в метрику сайзинга.
                        - listitem [ref=e524]:
                          - paragraph [ref=e525]:
