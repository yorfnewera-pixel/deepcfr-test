                  - heading [level=2] [ref=e455]:
                    - generic [ref=e456]: Ваш запрос
                    - paragraph [ref=e457]: "Промпт #1. Вопрос про архитектуру sizing в Deep CFR для покера."
                    - paragraph [ref=e458]
                    - paragraph [ref=e459]: "В моей реализации PokerNetwork имеет три головы: action_head (дискретные действия: fold/call/raise), sizing_head (непрерывный bet_size через Tanh-squashed Gaussian) и value_head (baseline для PG). Sizing_head обучается через Policy Gradient с advantage = regret_raise - baseline, где regret_raise берётся из CFR traversal."
                    - paragraph [ref=e460]
                    - paragraph [ref=e461]: "Моя позиция: PG для sizing_head — это overengineering. Bet_size можно обучать простой MSE-регрессией на целевой bet_size, полученный из CFR traversal. Причины:"
                    - paragraph [ref=e462]: 1. Sizing_head уже получает градиенты через advantage_loss (action_head учится на regrets, и sizing_head делит с ним base network).
                    - paragraph [ref=e463]: 2. PG добавляет высокую дисперсию (sampling из Gaussian) + второй оптимизатор (pg_optimizer) + третий (value_optimizer) — три оптимизатора на одну сеть.
                    - paragraph [ref=e464]: 3. В CFR нет понятия "policy gradient" — regrets обновляются детерминированно. PG — это RL-концепция, привнесённая извне, которая конфликтует с CFR-фреймворком.
                    - paragraph [ref=e465]: "4. Достаточно MSE: target_bet_size из traversal → обучить sizing_head предсказывать его напрямую."
                    - paragraph [ref=e466]
                    - paragraph [ref=e467]: Где я ошибаюсь? Почему PG может быть лучше MSE для sizing в контексте Deep CFR?
