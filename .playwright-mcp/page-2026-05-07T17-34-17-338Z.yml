                    - heading "Ответ Gemini" [level=2] [ref=e484]
                    - generic [ref=e488]:
                      - paragraph [ref=e489]: Ваши рассуждения логичны, и вы верно подметили, что смешивание PG и CFR — это концептуальный «гибрид», который усложняет систему. Однако в контексте Deep CFR для игр с непрерывным или очень широким пространством действий (Continuous Action Space) использование Policy Gradient (PG) для сайзингов имеет под собой теоретическую и практическую базу.
                      - paragraph [ref=e490]: Давайте разберем, где ваши аргументы сталкиваются с особенностями обучения в покере.
                      - 'heading "1. Проблема MSE: «Среднее значение» вместо «Оптимального»" [level=3] [ref=e491]'
                      - paragraph [ref=e492]: Главный минус MSE-регрессии в покере — это работа с мультимодальными распределениями.
                      - list [ref=e493]:
                        - listitem [ref=e494]:
                          - paragraph [ref=e495]: "Пример: В одной и той же ситуации (например, на терне против слабого диапазона) CFR traversal может показать, что стратегия смешанная: в 50% случаев выгодно поставить 33% пота (small bet), а в 50% — 150% пота (overbet)."
                        - listitem [ref=e496]:
                          - paragraph [ref=e497]: "MSE: Попытается минимизировать ошибку и выдаст среднее арифметическое — ставку в ~91% пота. Это значение может быть катастрофически плохим (не попадает ни в один из эффективных сайзингов)."
                        - listitem [ref=e498]:
                          - paragraph [ref=e499]: "PG (с распределением): Обучает голову выдавать распределение. Если вы используете Tanh-squashed Gaussian, сеть может «раздуть» стандартное отклонение или, в случае с Mixture of Gaussians, выучить обе моды."
                      - heading "2. Динамика CFR vs RL" [level=3] [ref=e500]
                      - paragraph [ref=e501]: Вы правы, что CFR детерминирован в табличном виде. Но в Deep CFR мы аппроксимируем Advantage (регреты).
                      - list [ref=e502]:
                        - listitem [ref=e503]:
                          - paragraph [ref=e504]: Если вы используете MSE, вам нужен «target bet size». Но откуда он берется в traversal? Обычно это фиксированный набор сайзингов (дискретизация). Если же вы хотите, чтобы агент сам искал лучший сайзинг в непрерывном пространстве, у вас нет «целевого» значения до тех пор, пока вы его не попробуете.
                        - listitem [ref=e505]:
                          - paragraph [ref=e506]: PG здесь выступает как механизм исследования (exploration). Через сэмплирование из Gaussian сеть пробует разные сайзинги и получает для них регрет. PG позволяет обновлять веса так, чтобы увеличивать вероятность сайзингов с бóльшим регретом.
                      - heading "3. Где PG действительно лучше MSE" [level=3] [ref=e507]
                      - paragraph [ref=e508]:
                        - text: В вашей архитектуре
                        - code [ref=e509]: action_head
                        - text: выдает регреты для типов действий. Но регрет для "Raise" напрямую зависит от того, какой именно размер рейза был выбран.
                      - list [ref=e510]:
                        - listitem [ref=e511]:
                          - paragraph [ref=e512]:
                            - text: Если использовать MSE, вам придется в traversal делать дополнительный поиск (например, градиентный спуск по функции ценности) только ради того, чтобы найти
                            - code [ref=e513]: target_bet_size
                            - text: для обучения регрессии.
                        - listitem [ref=e514]:
                          - paragraph [ref=e515]: "PG делает это «бесплатно» в процессе игры: сэмплируем сайзинг -> получаем результат -> обновляем политику."
                      - heading "4. Ответ на ваши пункты" [level=3] [ref=e516]
                      - list [ref=e517]:
                        - listitem [ref=e518]:
                          - paragraph [ref=e519]:
                            - text: "Shared Base Network: Да, градиенты от"
                            - code [ref=e520]: action_head
                            - text: помогают, но они обучают представление (features), а не конкретное отображение в метрику сайзинга.
                        - listitem [ref=e521]:
                          - paragraph [ref=e522]:
