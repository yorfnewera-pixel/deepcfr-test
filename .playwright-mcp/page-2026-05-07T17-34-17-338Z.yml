                      - paragraph [ref=e610]: "Это отличный контраргумент. Вы верно выделили суть проблемы: мультимодальность, а не отсутствие меток. Использование Mixture Density Networks (MDN) для аппроксимации распределения сайзингов действительно выглядит как более чистая инженерная альтернатива Policy Gradient (PG), так как она остается в рамках supervised learning (регрессии), но при этом справляется с несколькими модами."
                      - paragraph [ref=e611]: "Однако, если мы сравним PG и MDN в контексте именно Deep CFR, у PG (особенно с baseline) остаются три фундаментальных преимущества, которые могут сделать его более предпочтительным в поиске равновесия:"
