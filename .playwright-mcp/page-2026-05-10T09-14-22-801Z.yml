                      - paragraph [ref=e453]: В логике «контрфактическое утверждение» — это рассуждение о том, что могло бы произойти, если бы условия были другими.
                      - paragraph [ref=e454]: "Когда твой агент проходит раздачу один раз вперед (Факт):"
