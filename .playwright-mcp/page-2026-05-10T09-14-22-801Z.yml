                      - paragraph [ref=e464]: Даже если он прошел раздачу один раз вперед, чтобы вычислить Regret (сожаление), ему нужно вычесть из одного значения другое. И вот то значение, которое он не выбирал, но использовал для вычитания — и есть контрфактическое значение.
                      - heading "2. Почему «Контрфактический регрет», а не просто «Ошибка»?" [level=3] [ref=e465]
                      - paragraph [ref=e466]: В обычном обучении (например, в нейронках для картинок) у нас есть правильный ответ. В покере правильного ответа нет, есть только сравнение реальностей.
                      - paragraph [ref=e467]: Термин подчеркивает, что мы вычисляем ценность действия в узле, независимо от того, попали мы в него в этой раздаче или нет.
