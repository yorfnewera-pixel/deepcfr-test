                  - heading [level=2] [ref=e2078]:
                    - generic [ref=e2079]: Ваш запрос
                    - paragraph [ref=e2080]: "#4 Согласен с анализом экстраполяции (вниз — частично, вверх — утопия без вариативности). Согласен с eff_spr per opponent. Но есть проблема с твоим предложением Domain Randomization."
                    - paragraph [ref=e2081]
                    - paragraph [ref=e2083]: Мы обучаем НЕ RL, а Counterfactual Regret Minimization (CFR). CFR сходится к равновесию Нэша для конкретной игры. Если мы рандомизируем стартовые стеки (80-120bb), каждый traversal будет играть в ДРУГУЮ игру. Regrets усреднятся по ансамблю игр — сходимость к равновесию для каждого конкретного стека будет хуже. Это не "чистота 100bb" — это математическое ограничение CFR.
                    - paragraph [ref=e2084]
                    - paragraph [ref=e2085]: В RL (policy gradient, PPO) — Domain Randomization работает отлично, сеть адаптируется. В CFR — regrets для SPR=2 при 100bb и regrets для SPR=2 при 80bb — это разные regrets, потому что вся стратегия до этого узла была другой. Усреднение их ухудшит оба.
                    - paragraph [ref=e2086]
                    - paragraph [ref=e2087]: "МОЙ АЛЬТЕРНАТИВНЫЙ ПЛАН: Обучить на фиксированном 100bb, но спроектировать encode_state так чтобы экстраполяция вниз (50bb) работала максимально хорошо. Экстраполяция вверх (200bb) — признаём как ограничение, отдельный чекпоинт если понадобится."
                    - paragraph [ref=e2088]
