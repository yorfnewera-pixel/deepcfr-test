                        - text: .
                      - paragraph [ref=e530]: Но есть критическая точка — Сензитивность стратегии. В покере стратегия меняется не линейно, а «ступенчато». Например, на 100bb ты пушишь, а на 101bb уже начинаешь играть через колл. Нейросети сложно уловить эти микро-границы, поэтому она будет выдавать «размытое» решение.
