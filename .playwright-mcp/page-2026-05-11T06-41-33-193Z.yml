                            - text: "Нюанс: В классическом Deep CFR нормализация помогает. Но в DCFR+ константы дисконтирования ("
                            - generic [ref=e3278]:
                              - generic [ref=e3279]: α =
                              - generic [ref=e3280]: "1.5"
                            - text: ) подобраны под определенный масштаб регретов.
                        - listitem [ref=e3281]:
                          - paragraph [ref=e3282]: "Риск: Если ты нормализуешь таргеты, ты меняешь их физический смысл для формулы дисконта."
                        - listitem [ref=e3283]:
                          - paragraph [ref=e3284]:
                            - text: "Совет: На Этапе 1 отключи Running normalization. Оставь «сырые» (raw) значения. Чтобы сеть не «взорвалась» от больших банков, используй Gradient Clipping ("
                            - code [ref=e3285]: torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)
                            - text: ).
                      - heading "2. Deep Regret Matching+ (Траверсал)" [level=3] [ref=e3286]
                      - paragraph [ref=e3287]: В оригинале DCFR+ при выборе действий внутри траверсала (когда агент «думает», как пойти) используется логика RM+.
                      - list [ref=e3288]:
                        - listitem [ref=e3289]:
                          - paragraph [ref=e3290]:
                            - text: "Как это выглядит: Вместо того чтобы подавать в Softmax сырые выходы"
                            - code [ref=e3291]: advantage_net
                            - text: ", агент должен брать"
                            - code [ref=e3292]: max(predict, 0)
                            - text: .
                        - listitem [ref=e3293]:
                          - paragraph [ref=e3294]: "Почему это важно: В CFR+ отрицательные регреты не участвуют в расчете текущей стратегии. Если твой траверсал на Этапе 1 будет использовать «сырые» логиты (где могут быть отрицательные значения), он будет исследовать дерево не так, как это делает канонический DCFR+."
                      - heading "3. \"Чистота\" MSE Loss для нелегальных действий" [level=3] [ref=e3295]
                      - paragraph [ref=e3296]:
                        - text: "Ты правильно описал логику:"
                        - code [ref=e3297]: outputs = model(x) * mask
                        - text: . Но есть одна ловушка в PyTorch.
                      - list [ref=e3298]:
                        - listitem [ref=e3299]:
                          - paragraph [ref=e3300]:
                            - text: "Ловушка: Если ты делаешь"
                            - code [ref=e3301]: loss = MSE(model(x) * mask, target)
                            - text: ", то градиент для весов нелегальных действий будет строго равен 0."
                        - listitem [ref=e3302]:
                          - paragraph [ref=e3303]: "Проблема: Это хорошо, но если веса были инициализированы шумом (Kaiming), они там и останутся."
                        - listitem [ref=e3304]:
                          - paragraph [ref=e3305]: "Решение: Твой ZeroInit (Пункт #1) полностью решает эту проблему. Поскольку веса стартуют в 0, а градиент для нелегальных действий всегда 0, они останутся в 0 вечно. Это идеальная синергия."
