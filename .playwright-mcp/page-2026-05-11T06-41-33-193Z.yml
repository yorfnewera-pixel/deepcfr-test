                    - generic [ref=e3045]:
                      - paragraph [ref=e3129]: "Твой аргумент про «черную дыру» — это технический мат. Ты абсолютно прав: в архитектуре с несколькими выходами (multi-head), где каждый выход отвечает за регрет конкретного действия, per-action обучение при наличии нелегальных действий — это яд."
                      - paragraph [ref=e3130]: Я признаю ошибку в совете оставить PER. В контексте Deep CFR (и особенно DCFR+) Reservoir Buffer с полным вектором — это не просто «другой тип памяти», это способ обеспечить математическую полноту градиента.
                      - paragraph [ref=e3131]: "Вот почему твой переход на Reservoir + Full-vector критичен:"
                      - heading "1. Проблема «заброшенных» весов (Fold Weights Decay)" [level=3] [ref=e3132]
                      - paragraph [ref=e3133]: При per-action записи, если действие Fold нелегально (Check доступен), оно никогда не попадает в буфер.
                      - list [ref=e3134]:
                        - listitem [ref=e3135]:
                          - paragraph [ref=e3136]: "В твоем текущем PER: Веса нейрона, отвечающего за Fold, просто «дрейфуют». Если они были инициализированы через Kaiming, там может быть огромное положительное число. Поскольку в обучении Fold никогда не встречается как таргет, градиент никогда не придет и не скажет этому нейрону: «Уменьши значение до нуля»."
                        - listitem [ref=e3137]:
                          - paragraph [ref=e3138]:
                            - text: "В Reservoir (Full Vector): Маска в лосс-функции"
                            - code [ref=e3139]: loss = MSE(output * mask, target * mask)
                            - text: принудительно тянет логгит нелегального действия к нулю (или
                            - generic [ref=e3143]: −∞
                            - text: при правильном маскировании) каждый раз, когда обновляется этот инфостейт.
                      - heading "2. Смещение PER (Sampling Bias) в CFR" [level=3] [ref=e3144]
                      - paragraph [ref=e3145]: PER был придуман для Deep Q-Learning, чтобы чаще учить редкие, но важные переходы. Но CFR — это не Q-learning.
                      - list [ref=e3146]:
                        - listitem [ref=e3147]:
                          - paragraph [ref=e3148]: CFR требует минимизации регрета по всему распределению действий в узле.
                        - listitem [ref=e3149]:
                          - paragraph [ref=e3150]: Если мы приоритизируем только «громкие» регреты (большие ошибки), мы теряем точность в «тихих» ветках. В DCFR+, где веса итераций меняются динамически, такая селективность PER ломает сходимость средней стратегии. Reservoir Buffer обеспечивает uniform sampling, что гарантирует несмещенную оценку математического ожидания регрета.
                      - separator [ref=e3151]
                      - heading "3. Синергия с ZeroInit и Masking" [level=3] [ref=e3152]
                      - paragraph [ref=e3153]: "Теперь, когда мы объединяем все твои находки, картинка схлопывается:"
                      - list [ref=e3154]:
                        - listitem [ref=e3155]:
                          - paragraph [ref=e3156]: ZeroInit ставит Fold в ноль на старте.
                        - listitem [ref=e3157]:
                          - paragraph [ref=e3158]: "Reservoir + Full Vector гарантирует, что Fold останется в нуле (или уйдет в минус), потому что при каждом обновлении состояния сеть будет получать подтверждение: «Регрет нелегального действия — ноль»."
                        - listitem [ref=e3159]:
                          - paragraph [ref=e3160]: Masking в Траверсале (Level 3) не дает мусору попасть в буфер, а Masking в Обучении (Level 2) гарантирует, что сеть не «сходит с ума», пытаясь предсказать то, чего нет.
                      - heading "Мой вердикт по исправлению №7:" [level=3] [ref=e3161]
                      - paragraph [ref=e3162]:
                        - text: Согласен полностью. Портирование
