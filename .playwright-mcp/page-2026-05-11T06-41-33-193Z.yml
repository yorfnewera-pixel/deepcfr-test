                    - paragraph [ref=e1162]: "**Уровень 1 (логический)**: В encode_state добавляем legal_actions_mask [0/1, 0/1, 0/1] как 3 дополнительных фичи. Маска формируется не из legal_actions движка, а из ИГРОВОЙ ЛОГИКИ: если Check доступен → Fold запрещён (строго доминируемая стратегия). Это позволяет сети \"видеть\" что Fold нелегален."
