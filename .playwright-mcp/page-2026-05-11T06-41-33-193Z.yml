                    - paragraph [ref=e2986]
                    - paragraph [ref=e2987]: "Доказательство из оригинала: ReservoirBuffer хранит (infostate, cf_regrets[NUM_ACTIONS], legal_mask[NUM_ACTIONS], iteration). Это ПОЛНЫЙ вектор регретов на infostate. Обучение — MSE на всём векторе одновременно."
                    - paragraph [ref=e2988]
                    - paragraph [ref=e2989]: Наш PrioritizedMemory хранит (state, action_type, bet_size, scaled_regret, priority) — PER-ACTION запись. Обучение через gather(1, action_idx) — только одно действие за раз.
                    - paragraph [ref=e2990]
                    - paragraph [ref=e2991]: "Проблема: Когда advantage_net обучается на per-action записях через gather, нелегальные действия НЕ получают градиентов вообще (их нет в буфере). Но в оригинале нелегальные действия получают gradient = 0 через mask * output — это корректно, сеть \"учится\" что advantage нелегального = 0."
