                    - generic [ref=e829]: Ваш запрос
                    - paragraph [ref=e830]: "#1 Я нашёл 7 критических отличий нашей реализации Deep CFR+ от оригинального DeepPDCFR (код с GitHub rpSebastian/DeepPDCFR + статью deeppdcfr.tex). Наша сеть после 4200 итераций фолдит AA в 33% случаев — probability Fold=0.34 во ВСЕХ состояниях без исключения (min=0.344, max=0.351), нулевая дискриминация."
                    - paragraph [ref=e831]
                    - paragraph [ref=e832]: "Вот отличия:"
                    - paragraph [ref=e833]
                    - paragraph [ref=e834]: "1. **Fold+Check одновременно**: Наш движок pokers даёт Fold и Check одновременно. Оригинальный OpenSpiel — НИКОГДА. Наше обучение НЕ маскирует Fold когда Check бесплатен."
                    - paragraph [ref=e835]
                    - paragraph [ref=e836]: "2. **ZeroInit vs Kaiming**: Оригинал инициализирует ПОСЛЕДНИЙ слой advantage_net нулями (ZeroInitLinear). Мы — стандартным PyTorch (Kaiming). Bootstrap с мусорных начальных значений."
                    - paragraph [ref=e837]
                    - paragraph [ref=e838]: "3. **Деноминатор дисконта DCFR+**: Оригинал: `(t-1)^α / ((t-1)^α + 1.5)`. Мы: `+ 1` вместо `+ 1.5`. Слабый дисконт → старые ошибки дольше живут."
                    - paragraph [ref=e839]
                    - paragraph [ref=e840]: "4. **Strategy loss**: Оригинал: MSE + `(t/T)^(γ/2)`. Мы: Cross-entropy + `floor((iter+1)/2)`."
                    - paragraph [ref=e841]
                    - paragraph [ref=e842]: "5. **Буфер**: Оригинал: Reservoir (uniform sampling). Мы: Prioritized replay с `|log1p(r)| + 0.01`. Priority подавляет нулевые регреты Fold."
                    - paragraph [ref=e843]
                    - paragraph [ref=e844]: "6. **Legal action masking**: Оригинал: `model(x) * mask` — logits зануляются до softmax. Мы: нет маскирования, softmax видит все 3 действия."
                    - paragraph [ref=e845]
                    - paragraph [ref=e846]: "7. **Регрет scaling**: Оригинал: raw counterfactual regrets. Мы: `sign(r)*log1p(|r|)` — сжатие может прятать сигналы."
