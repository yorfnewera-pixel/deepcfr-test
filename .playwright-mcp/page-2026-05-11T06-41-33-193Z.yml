                          - paragraph [ref=e929]: "Пункт #5 (Буфер): Prioritized Replay часто «перекашивает» обучение в CFR. Если ты подавляешь нулевые регреты Fold, сеть может просто «забыть», что фолдить — это плохо, и перестать обновлять эти веса. Reservoir Sampling в оригинале гарантирует, что мы помним «среднее по истории», что критично для сходимости к Нэшу."
