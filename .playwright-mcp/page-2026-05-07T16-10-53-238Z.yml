                      - paragraph [ref=e1401]: Из-за катастрофического забывания или интерференции, обновляя регреты для одной руки, сеть может «испортить» предсказания для другой. В обычном Deep CFR это лечится тем, что на следующей итерации мы снова увидим эту руку и выучим её мгновенный регрет заново. В вашей схеме «испорченное» значение застрянет в бутстрапе и будет передаваться по наследству.
