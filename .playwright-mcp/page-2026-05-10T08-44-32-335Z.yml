                    - heading "Ответ Gemini" [level=2] [ref=e280]
                    - generic [ref=e284]:
                      - paragraph [ref=e285]: Слово «контрфактическое» (counterfactual) звучит как термин из квантовой физики, но на самом деле это то, как мы с тобой думаем каждый день.
                      - paragraph [ref=e286]: В покере это критически важно из-за неполной информации. Давай разберем это на примере одной конкретной ситуации за столом.
                      - separator [ref=e287]
                      - heading "1. Что такое «Факт» vs «Контрфакт»?" [level=3] [ref=e288]
                      - paragraph [ref=e289]:
                        - text: "Представь ситуацию: ты на баттоне (BTN) с"
                        - generic [ref=e293]: A♠K♠
                        - text: . У тебя 100 bb. Ты делаешь рейз, оппонент на ББ коллит. На флопе
                        - generic [ref=e297]: J♡7♢2♠
                        - text: оппонент чекает.
                      - list [ref=e298]:
                        - listitem [ref=e299]:
                          - paragraph [ref=e300]: "Факт: Ты решил поставить контбет (Bet). Оппонент мгновенно пошел олл-ин. Ты выбросил. Твой результат в этой реальности: -10 bb."
                        - listitem [ref=e301]:
                          - paragraph [ref=e302]: "Контрфакт: Это вопрос: «А что БЫЛО БЫ, если бы в этой же самой точке я нажал Чек?»."
                      - heading "2. Как это работает в голове алгоритма?" [level=3] [ref=e303]
                      - paragraph [ref=e304]: "Обычный ИИ (Reinforcement Learning) просто бы запомнил: «Я поставил — я проиграл. Ставить плохо». Это ошибка, потому что в покере можно сыграть правильно и проиграть."
                      - paragraph [ref=e305]:
                        - text: "CFR делает по-другому: В момент тренировки"
                        - code [ref=e306]: traversals
                        - text: "останавливает время в точке принятия решения и говорит: «Окей, мы пошли по пути Bet и получили по лицу. Но я же Бог-исследователь, я сейчас мгновенно перемотаю время назад и посмотрю, что случилось бы, если бы мы выбрали Check»."
                      - list [ref=e307]:
                        - listitem [ref=e308]:
                          - paragraph [ref=e309]: Он «проигрывает» ветку Check до конца.
                        - listitem [ref=e310]:
                          - paragraph [ref=e311]: Видит, что при чеке мы бы дошли до вскрытия бесплатно и выиграли банк у блефа оппонента, получив +15 bb.
                        - listitem [ref=e312]:
                          - paragraph [ref=e313]: "Вычисление сожаления:"
                          - generic [ref=e318]:
                            - generic [ref=e319]:
                              - text: "15"
                              - generic [ref=e320]: (могли получить)
                              - text: −
                            - generic [ref=e321]:
                              - text: (−10
                              - generic [ref=e322]: (получили по факту)
                              - text: ) =
                            - generic [ref=e323]: "25"
                          - paragraph [ref=e324]: Число 25 — это твое «контрфактическое сожаление». Ты «сожалеешь» на 25 больших блайндов о том, что не чекнул.
                      - heading "3. Почему это «Контрфактическое»?" [level=3] [ref=e325]
                      - paragraph [ref=e326]: Потому что это значение вычисляется при условии (факте), что мы уже находимся в этой точке дерева.
                      - paragraph [ref=e327]:
                        - text: Алгоритм не просто спрашивает «выгодно ли ставить
                        - generic [ref=e331]: AK
                        - text: "вообще?». Он спрашивает: «Насколько выгодно было ставить"
                        - generic [ref=e335]: AK
                        - text: именно в этой ситуации, учитывая, что мы уже разыграли префлоп так, как разыграли?».
                      - separator [ref=e336]
                      - heading "4. Зачем это нужно Deep CFR?" [level=3] [ref=e337]
                      - paragraph [ref=e338]: В реальной игре мы никогда не узнаем, что было бы в другой ветке. Мы видим только одну реальность.
                      - paragraph [ref=e339]: Но во время обучения мы создаем миллионы таких «параллельных вселенных».
                      - list [ref=e340]:
                        - listitem [ref=e341]:
                          - paragraph [ref=e342]: В одной вселенной мы поставили.
                        - listitem [ref=e343]:
                          - paragraph [ref=e344]: В другой (контрфактической) — чекнули.
                        - listitem [ref=e345]:
                          - paragraph [ref=e346]: В третьей — выбросили.
                      - paragraph [ref=e347]: Сравнивая результаты этих вселенных, мы получаем чистый сигнал. Мы убираем фактор «повезло/не повезло» в конкретной раздаче.
                      - blockquote [ref=e348]:
                        - paragraph [ref=e349]: "Суть контрфактичности: Это обучение на невыбранных возможностях. Мы учимся не только на том, что сделали, но и на том, от чего отказались."
                      - heading "Итог простыми словами" [level=3] [ref=e350]
                      - paragraph [ref=e351]: "Контрфактическое значение — это ответ на вечный вопрос игрока после раздачи: «А если бы я сыграл иначе, я бы выиграл больше?»."
                      - paragraph [ref=e352]:
                        - text: Твой алгоритм не просто задает этот вопрос, он математически точно на него отвечает миллионы раз в секунду, заглядывая в карты оппонента в тех ветках, где ты не был. И именно эти ответы он записывает в
                        - code [ref=e353]: advantage_net
                        - text: ", чтобы в следующий раз «сожалеть» меньше."
                      - paragraph [ref=e354]: Теперь термин «контрфактическое» перестал быть страшным? Это просто научное название для «работы над ошибками в параллельных мирах».
