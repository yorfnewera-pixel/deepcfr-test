                    - generic [ref=e2646]: Ваш запрос
                    - paragraph [ref=e2647]: "#3 Следующий шаг после M3.1 и SPR. Нужно обсудить комплексно — не по частям, а целиком."
                    - paragraph [ref=e2648]
                    - paragraph [ref=e2649]: Мы планируем следующее обучение Deep CFR с нуля и хотим правильно спроектировать encode_state. Сейчас 157 фичей, все денежные нормализованы на buy_in=200. Обучение только на 100bb (buy_in=200, bb=2). Другие глубины НЕ рассматриваются для обучения.
                    - paragraph [ref=e2650]
                    - paragraph [ref=e2651]: "ПРОБЛЕМА ЭКСТРАПОЛЯЦИИ: Можно ли обучить на 100bb и чтобы чекпоинт работал на 50bb и 200bb? Веса обучаются при конкретном распределении фичей. При 50bb все денежные фичи в 2 раза больше — веса не сойдутся."
                    - paragraph [ref=e2652]
                    - paragraph [ref=e2653]: "ПРЕДЛОЖЕННЫЕ ИЗМЕНЕНИЯ (4 пункта, все взаимосвязаны):"
                    - paragraph [ref=e2654]
                    - paragraph [ref=e2655]: "1. Нормализация на BB вместо buy_in: pot_enc = pot / (100 * bb), stake_enc = stake / (100 * bb). Это делает фичи лимит-агностик — при NL50 (bb=0.5) и NL200 (bb=2) pot_enc одинаковый для одной и той же ситуации в BB."
                    - paragraph [ref=e2656]
                    - paragraph [ref=e2657]: "2. stack_depth = buy_in / (100 * bb): при 100bb→1.0, 50bb→0.5, 200bb→2.0. Сеть знает глубину стека. Но при обучении ТОЛЬКО на 100bb stack_depth ВСЕГДА = 1.0. Сеть никогда не видит других значений. Вопрос: может ли она экстраполировать?"
                    - paragraph [ref=e2658]
                    - paragraph [ref=e2659]: "3. per-opponent effective SPR: eff_spr_vs_p = min(my_stake, opp_stake) / (min(my_stake, opp_stake) + pot). Когда у тебя 200bb а у оппонента 50bb — эффективный SPR=5, не 20. Сеть должна понимать сколько РЕАЛЬНО играет в этом банке."
                    - paragraph [ref=e2660]
                    - paragraph [ref=e2661]: "4. Уточнение: при обучении на 100bb стеки УМЕНЬШАЮТСЯ по ходу раздачи. К риверу игрок может иметь 20bb (depth=0.2). Сеть ВИДИТ разные глубины в рамках одной раздачи. Достаточно ли этого для экстраполяции на стартовый стек 50bb?"
                    - paragraph [ref=e2662]
                    - paragraph [ref=e2663]: "МОЙ ВОПРОС: Как правильно спроектировать encode_state чтобы:"
                    - paragraph [ref=e2664]: а) Обучить ОДИН раз на 100bb
                    - paragraph [ref=e2665]: б) Чекпоинт работал на 50bb и 200bb
                    - paragraph [ref=e2666]: в) Сеть понимала эффективный стек против каждого оппонента
                    - paragraph [ref=e2667]
                    - paragraph [ref=e2668]: Возможно ли это вообще? Или экстраполяция на другой стартовый стек — утопия и нужны отдельные чекпоинты?
