                    - generic [ref=e413]:
                      - paragraph [ref=e414]: А вот сейчас ты меня поймал на неточности в формулировках, и это круто! Ты очень внимательно следишь за логикой. Давай внесу ясность, потому что здесь кроется тонкое различие между классическим CFR и Deep CFR (сэмплирующим CFR).
                      - paragraph [ref=e415]:
                        - text: "Ты прав: в твоем коде в одной конкретной итерации"
                        - code [ref=e416]: traversals
                        - text: раздача действительно не раздваивается физически.
                      - heading "Как же тогда возникает «контрфактичность»?" [level=3] [ref=e417]
                      - paragraph [ref=e418]: В классическом CFR (который для маленьких игр типа «Камень-ножницы-бумага») мы действительно пускаем ветки в обе стороны одновременно. Но в Deep CFR для покера так сделать нельзя — дерево взорвется.
                      - paragraph [ref=e419]: "Вместо «физического» проигрывания ветки прямо сейчас, алгоритм использует два способа, чтобы узнать «а что было бы»:"
                      - heading "1. Предсказание нейросети (Bootstrapping)" [level=4] [ref=e420]
                      - paragraph [ref=e421]:
                        - text: Это то, о чем мы говорили чуть раньше. Когда
                        - code [ref=e422]: traversals
                        - text: стоит перед выбором «Чек или Бет», он не идет в обе ветки.
                      - list [ref=e423]:
                        - listitem [ref=e424]:
                          - paragraph [ref=e425]: Он идет, допустим, в Бет и проживает его до конца.
                        - listitem [ref=e426]:
                          - paragraph [ref=e427]:
                            - text: А для ветки Чек он не переигрывает раздачу. Он просто спрашивает у
                            - code [ref=e428]: advantage_net
                            - text: ": «Слушай, а ты в прошлых раздачах (в похожих ситуациях) уже видела, сколько приносит тут Чек?»."
                        - listitem [ref=e429]:
                          - paragraph [ref=e430]: Нейросеть выдает ему ожидаемое значение (value) для Чека.
                      - paragraph [ref=e431]: "То есть: Мы берем «контрфактическое» значение не из реальности, а из памяти нейросети, накопленной в других раздачах."
                      - heading "2. Внешнее сэмплирование (Outcome Sampling)" [level=4] [ref=e432]
                      - paragraph [ref=e433]: В некоторых версиях алгоритма (которые часто используются в Deep CFR) мы считаем регрет только для той ветки, в которую реально зашли, но нормируем его на вероятность того, что мы туда попали.
                      - paragraph [ref=e434]: "Но чаще всего в Deep CFR работает именно первая схема:"
                      - list [ref=e435]:
                        - listitem [ref=e436]:
                          - paragraph [ref=e437]: Мы идем по одной ветке (выбранной случайно или по стратегии).
                        - listitem [ref=e438]:
                          - paragraph [ref=e439]: Для всех ОСТАЛЬНЫХ веток мы берем значения из нашей текущей нейросети.
                        - listitem [ref=e440]:
                          - paragraph [ref=e441]: Разница между «реальным результатом в этой ветке» и «предсказанием нейросети для других веток» и дает нам регрет.
                      - separator [ref=e442]
                      - heading "Почему это всё еще называется «Контрфактическим»?" [level=3] [ref=e443]
                      - paragraph [ref=e444]: Даже если мы не «переиграли» ветку физически прямо сейчас, мы всё равно вычисляем Regret (сожаление).
                      - blockquote [ref=e445]:
                        - paragraph [ref=e446]: "Мы сравниваем: Факт (что мы получили в этой раздаче) VS Контрфакт (что наша нейросеть «думает» о других вариантах)."
                      - paragraph [ref=e447]: "Это как в жизни: Ты не можешь одновременно пойти в кино и остаться дома. Но когда ты выходишь из кино и оно тебе не понравилось, ты чувствуешь «сожаление» не потому, что ты одновременно был дома, а потому что у тебя в голове есть представление о том, как хорошо было бы дома."
                      - paragraph [ref=e448]:
                        - text: Твоя
                        - code [ref=e449]: advantage_net
                        - text: — это и есть это «представление» о других вариантах.
                      - heading "Резюме:" [level=3] [ref=e450]
                      - list [ref=e451]:
                        - listitem [ref=e452]:
                          - paragraph [ref=e453]: "В классическом CFR: Раздача буквально разветвляется."
                        - listitem [ref=e454]:
