                            - text: .
                      - paragraph [ref=e1624]: Для игрока SPR 0.5 — это сигнал «мы в олл-ине». Но для нейросети число 2.0 (вместо привычных 0.1–0.5 на префлопе) — это сигнал аномалии. Вместо того чтобы спокойно оценить силу руки, сеть начинает «паниковать» из-за того, что входные данные вышли за пределы нормального диапазона.
