                      - paragraph [ref=e1627]: Да, твой старый метод — это "кривой SPR".
                      - list [ref=e1628]:
                        - listitem [ref=e1629]:
                          - paragraph [ref=e1630]: "Вместо того чтобы видеть: «Банк стал больше, а стек меньше» (два понятных тренда), сеть видит одно «взрывающееся» число."
                        - listitem [ref=e1631]:
                          - paragraph [ref=e1632]: "Sizing Head страдает больше всего: он хочет предложить ставку в 1.5 пота, но глядя на «вздутые» фичи, мозг бота может решить, что банк уже бесконечный, и просто «сломаться» в логике."
