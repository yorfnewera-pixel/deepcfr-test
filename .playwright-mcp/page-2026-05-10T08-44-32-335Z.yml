                      - paragraph [ref=e1604]: Сеть сама способна сопоставить эти два числа и «понять» SPR внутри своих скрытых слоев. Но когда ты сам делишь одно на другое на входе, ты насильно заставляешь сеть смотреть на мир через кривую линзу обратного SPR.
