                      - heading "Мой совет (Золотая середина):" [level=3] [ref=e1492]
                      - paragraph [ref=e1493]: "Если ты не хочешь ограничиваться 100bb, но боишься экспоненциального усложнения: Сделай Domain Randomization, где у всех игроков стек ОДИНАКОВЫЙ, но рандомный (от 100 до 300)."
