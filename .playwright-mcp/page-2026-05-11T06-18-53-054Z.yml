                      - list [ref=e495]:
                        - listitem [ref=e496]:
                          - paragraph [ref=e497]: Если у тебя 200bb (ты уже удвоился), а у оппонента 100bb — вы играете в покер на 100bb.
                        - listitem [ref=e498]:
                          - paragraph [ref=e499]: Если ты планируешь уходить сразу после того, как твой стек значительно превысит 100bb, ты физически никогда не окажешься в ситуации, где эффективный стек равен 200bb.
                      - paragraph [ref=e500]: Следовательно, модель на 200bb будет просто «простаивать».
                      - heading "2. Почему 100bb — это «база»" [level=3] [ref=e501]
                      - paragraph [ref=e502]: "Большинство кэш-столов имеют ограничение на вход (Max Buy-in) именно в 100bb. Это значит, что:"
                      - list [ref=e503]:
                        - listitem [ref=e504]:
                          - paragraph [ref=e505]: Каждая новая раздача для тебя начинается со 100bb.
                        - listitem [ref=e506]:
                          - paragraph [ref=e507]: Большинство твоих оппонентов будут иметь около 100bb.
                        - listitem [ref=e508]:
                          - paragraph [ref=e509]: Твой путь от 100bb до 200bb — это серия микро-шагов, где математика 100bb-стека всё еще работает на 95% точности.
                      - heading "3. Психология vs ГТО" [level=3] [ref=e510]
                      - paragraph [ref=e511]: Стратегия «уйти после выигрыша» часто критикуется профессионалами, потому что «за столом может оставаться слабый игрок (рыба), у которого ты мог бы забрать еще больше».
                      - paragraph [ref=e512]: "НО для твоего ИИ это плюс:"
                      - list [ref=e513]:
                        - listitem [ref=e514]:
                          - paragraph [ref=e515]: "Снижение риска: Глубокие стеки (200bb+) — это зона высокой дисперсии. Одна ошибка там стоит двух бай-инов. Твоему Deep CFR проще идеально выучить 100bb и «печатать» деньги там, чем пытаться объять необъятное."
                        - listitem [ref=e516]:
                          - paragraph [ref=e517]: "Чистота данных: Если ты играешь только до 200bb, твоя модель, обученная на 100bb, покроет 99% твоих игровых ситуаций. Те редкие моменты, когда у вас обоих будет по 130bb, легко нивелируются тем самым «каппингом» (обрезанием до 100bb), о котором мы говорили."
                      - separator [ref=e518]
                      - 'heading "Итог: на чем фокусируемся?" [level=3] [ref=e519]'
                      - paragraph [ref=e520]: Если ты придерживаешься стратегии «Hit and Run», то учить нужно только 100bb.
                      - list [ref=e521]:
                        - listitem [ref=e522]:
                          - paragraph [ref=e523]: Это быстрее (сходимость нейронки на одном стеке в разы выше).
                        - listitem [ref=e524]:
                          - paragraph [ref=e525]: Это точнее (модель не «размазывает» свои знания между короткими и глубокими стеками).
                        - listitem [ref=e526]:
