                      - paragraph [ref=e1167]: "Твоя идея фактически заставляет агента учиться выигрывать марафон. Но математика GTO говорит: «Играй каждую руку идеально, исходя из текущих ресурсов»."
                      - list [ref=e1168]:
                        - listitem [ref=e1169]:
                          - paragraph [ref=e1170]: Если у агента стало 250bb, его стратегия должна радикально измениться (мы обсуждали SPR и ценность рук).
                        - listitem [ref=e1171]:
