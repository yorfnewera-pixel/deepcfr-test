                      - paragraph [ref=e1343]: "Мой совет: Сейчас реализуй standalone-инференс для 100bb. Это даст тебе готовую инфраструктуру. А когда ты увидишь первые результаты и поймешь, что мощностей хватает — просто запустишь новое обучение с рандомизацией. Это потребует изменения всего одной строчки в генераторе состояний."
