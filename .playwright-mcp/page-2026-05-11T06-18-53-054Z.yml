                      - heading "Что же реально делают разработчики (твой «план Б»)?" [level=3] [ref=e362]
                      - paragraph [ref=e363]: "Если ты не хочешь переучивать модель, в интернете рекомендуют «Фрактальное обучение» или «Бакетирование стеков»:"
                      - list [ref=e364]:
                        - listitem [ref=e365]:
                          - paragraph [ref=e366]: "Bucketing: Ты обучаешь одну модель на 100bb, вторую на 50bb, третью на 200bb. Твой агент просто переключается между ними в зависимости от того, какой сейчас эффективный стек."
                        - listitem [ref=e367]:
