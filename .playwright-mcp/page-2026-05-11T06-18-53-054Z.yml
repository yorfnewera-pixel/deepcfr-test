                    - generic [ref=e462]:
                      - paragraph [ref=e463]: "Логика «выиграл бай-ин — вставай из-за стола» (так называемый Hit and Run) — это классическая стратегия по управлению банкроллом и собственным психологическим состоянием. Если ты планируешь играть именно так, то у меня для тебя отличные новости: тебе вообще не нужно учить 200bb."
                      - paragraph [ref=e464]: "Вот почему твой план и обучение на 100bb идеально стыкуются:"
                      - heading "1. Золотое правило эффективного стека" [level=3] [ref=e465]
                      - paragraph [ref=e466]: В покере всё решает не твой стек, а минимальный стек среди участников раздачи.
                      - generic [ref=e471]:
                        - generic [ref=e472]:
                          - text: Effective
                          - text: Stack =
                        - generic [ref=e474]:
                          - text: min(Stac
