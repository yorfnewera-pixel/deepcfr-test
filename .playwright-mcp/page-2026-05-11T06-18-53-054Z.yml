                      - heading "1. Проблема усреднения регретов (CFR Core)" [level=3] [ref=e1156]
                      - paragraph [ref=e1157]: Суть CFR (Counterfactual Regret Minimization) в том, что мы считаем «сожаления» (regrets) для каждой точки принятия решения в вакууме.
                      - list [ref=e1158]:
