                      - paragraph [ref=e1154]: Идея интересная, и она напоминает концепцию «эпизодического обучения» в обычном Reinforcement Learning (RL), но в контексте Deep CFR (Game Theory Optimal) она таит в себе ловушку, которая может полностью сломать твою математику.
