                      - paragraph [ref=e1568]: Ссылка, которую ты скинул, относится к NVIDIA Isaac Gym (симулятору физики для роботов), но концепция Domain Randomization (DR) там описана абсолютно верно и она на 100% применима к твоему покерному ИИ.
                      - paragraph [ref=e1569]: "В робототехнике это работает так: чтобы робот не упал на реальном скользком полу, его учат в симуляции, где постоянно рандомно меняют трение, массу робота и силу тяжести. Робот не знает, какие именно параметры сейчас, но он учится быть адаптивным."
                      - heading "Как это соотносится с твоим вопросом про \"соотношение стеков\":" [level=3] [ref=e1570]
                      - paragraph [ref=e1571]: В ссылке на Isaac Gym DR используется для того, чтобы нейронка не "зубрила" конкретные условия, а выучила общую физику процесса. В покере твоя "физика" — это соотношение стеков к банку.
                      - paragraph [ref=e1572]: "Если ты применишь DR к стекам (например, от 100bb до 300bb), произойдет следующее:"
                      - list [ref=e1573]:
                        - listitem [ref=e1574]:
                          - paragraph [ref=e1575]: "Обобщение (Generalization): Сеть перестанет воспринимать 100bb как единственно верный закон. Она начнет строить внутреннюю \"кривую зависимости\" агрессии от глубины стека."
                        - listitem [ref=e1576]:
                          - paragraph [ref=e1577]: "Устойчивость (Robustness): Как и робот в Isaac Gym, который готов к разному трению, твой бот станет готов к \"разному давлению\" денег."
                      - heading "Но есть ключевое отличие (Покер vs Роботы):" [level=3] [ref=e1578]
                      - paragraph [ref=e1579]: В Isaac Gym параметры (трение, масса) часто скрыты от робота (он их чувствует через сенсоры). В твоем случае значение стека — это явная фича.
                      - list [ref=e1580]:
                        - listitem [ref=e1581]:
                          - paragraph [ref=e1582]:
                            - generic [ref=e1583]:
                              - text: Если ты НЕ подаешь
