                      - list [ref=e1336]:
                        - listitem [ref=e1337]:
                          - paragraph [ref=e1338]: "Если хочешь запустить проект в ближайшее время: Забудь про Domain Randomization. Обучи эталонную модель на 100bb. Это фундамент. Если она будет бить поле на 100bb, ты уже будешь впереди 95% игроков."
                        - listitem [ref=e1339]:
