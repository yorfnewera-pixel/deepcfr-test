                      - paragraph [ref=e1270]: Экспоненциальный рост произошел бы, если бы ты добавил в дерево новые ветки (например, разрешил бы делать ставки любого размера, а не по бакетам). В случае с Domain Randomization (DR) мы просто меняем «вес» или «окраску» уже существующих веток.
                      - 'heading "2. Главная проблема: Конфликтующие регреты" [level=3] [ref=e1271]'
                      - paragraph [ref=e1272]: "Основная сложность — это обобщение. Когда ты учишь сеть на 100bb, она быстро понимает: «Сет на флопе — это почти всегда агрессия». Когда ты добавляешь 300bb, ситуация меняется:"
                      - list [ref=e1273]:
