                          - paragraph [ref=e1275]: "На 100bb: Ошибка «переиграл руку» стоит тебе 100bb."
                        - listitem [ref=e1276]:
                          - paragraph [ref=e1277]: "На 300bb: Та же самая ошибка стоит тебе в 3 раза дороже."
                      - paragraph [ref=e1278]:
