                      - paragraph [ref=e1330]:
                        - text: Да, оно сработает, но только если ты дашь сети достаточно данных. Нейронки на базе ReLU (как у тебя) хорошо выучивают линейные зависимости. Она поймет, что
                        - code [ref=e1331]: Fold Frequency
                        - text: должен быть функцией от
                        - code [ref=e1332]: stack_depth
                        - text: .
                      - paragraph [ref=e1333]: Но есть критическая точка — Сензитивность стратегии. В покере стратегия меняется не линейно, а «ступенчато». Например, на 100bb ты пушишь, а на 101bb уже начинаешь играть через колл. Нейросети сложно уловить эти микро-границы, поэтому она будет выдавать «размытое» решение.
                      - separator [ref=e1334]
