                    - generic [ref=e297]:
                      - paragraph [ref=e298]: "Твоё чутье тебя не подводит — в интернете это действительно обсуждали тысячи раз, от покерных форумов (TwoPlusTwo) до научных работ создателей DeepStack и Libratus. Ты прав: люди пробовали «хакнуть» эту систему, и решения есть, но они имеют свою цену."
                      - paragraph [ref=e299]: Давай разберем те самые «решения из интернета», которые ты ищешь, и почему они не являются магической формулой.
                      - separator [ref=e300]
                      - heading "1. Подход «Масштабирование» (Scaling / Mapping)" [level=3] [ref=e301]
                      - paragraph [ref=e302]: Это то, что чаще всего предлагают на форумах. Если у вас обоих по 200bb, мы делаем вид, что играем 100bb, но меняем «линейку» измерений.
                      - list [ref=e303]:
                        - listitem [ref=e304]:
                          - paragraph [ref=e305]:
                            - text: "Как это работает: Ты делишь стек ("
                            - generic [ref=e308]:
                              - generic [ref=e309]: 200bb →
                              - generic [ref=e310]: 100bb
                            - text: ) и размер банка на 2. Скармливаешь это нейронке. Получаешь ответ (например, «Bet 50% pot»). Затем умножаешь этот бет обратно на 2.
                        - listitem [ref=e311]:
                          - paragraph [ref=e312]: "В чем проблема: Относительный размер блайндов. В 100bb-стеке анте и блайнды «тяжелые» — они создают давление и заставляют бороться за банк. В 200bb те же самые блайнды по отношению к стеку становятся в два раза «легче»."
                          - blockquote [ref=e313]:
                            - paragraph [ref=e314]: Если ты просто масштабируешь игру, сеть будет играть слишком агрессивно, не понимая, что в глубоких стеках математика фолд-эквити и имплайд-оддсов (потенциальных шансов) работает иначе.
                      - heading "2. Подход «Решение на лету» (Nested Subgame Solving)" [level=3] [ref=e315]
                      - paragraph [ref=e316]: Это то, как проблему решили в Libratus и Pluribus. Они поняли, что экстраполировать веса невозможно.
                      - list [ref=e317]:
                        - listitem [ref=e318]:
                          - paragraph [ref=e319]: "Решение: Они используют нейронку только как «оценщика» (Value Function)."
                        - listitem [ref=e320]:
                          - paragraph [ref=e321]: "Процесс: Когда стек игрока меняется (стал 140bb), бот не спрашивает нейронку «что мне делать?». Он запускает мини-солвер прямо во время хода. Этот солвер просчитывает дерево на 1–2 шага вперед, а веса нейронки использует только для того, чтобы понять, сколько будет стоить ситуация в конце этих шагов."
                        - listitem [ref=e322]:
                          - paragraph [ref=e323]: "Для тебя: Это требует огромных вычислительных мощностей. В режиме RTA твой агент просто не успеет это посчитать, если у тебя не кластер из GPU."
                      - heading "3. Почему формула EV не помогает «достроить» стратегию?" [level=3] [ref=e324]
