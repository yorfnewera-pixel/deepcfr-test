                              - text: "на вход (скрытый параметр):"
                            - text: Сеть будет вынуждена искать "усредненную" стратегию, которая работает и при 100, и при 300bb. Это сделает её "дубовой" и неоптимальной (она будет фолдить там, где при 100bb надо пушить).
                        - listitem [ref=e1585]:
                          - paragraph [ref=e1586]:
                            - generic [ref=e1587]:
                              - text: Если ты ПОДАЕШЬ
                              - code [ref=e1588]: stack_depth
                              - text: "(как мы и решили):"
                            - text: Это превращается в Conditioned Domain Randomization. Сеть учит не одну "среднюю" стратегию, а целое семейство стратегий, переключаясь между ними в зависимости от входного числа.
                      - heading "Резюме по твоей ссылке:" [level=3] [ref=e1589]
                      - paragraph [ref=e1590]: Да, это именно та концепция. NVIDIA использует её, чтобы роботы выживали в хаосе реального мира. Ты можешь использовать её, чтобы твой бот выживал в хаосе разных лимитов и стеков.
                      - paragraph [ref=e1591]: "Технический совет: Если решишь внедрять, делай как в Isaac Gym — не бери две точки (100 и 200), а бери непрерывный диапазон (Uniform Distribution)."
