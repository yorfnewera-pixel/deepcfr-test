                        - listitem [ref=e1161]:
                          - paragraph [ref=e1162]: Если ты свяжешь раздачи в цепочку (пока не наберется 300bb), то результат второй раздачи будет зависеть от исхода первой (потому что изменился стартовый стек).
                        - listitem [ref=e1163]:
                          - paragraph [ref=e1164]:
                            - text: В итоге CFR будет пытаться усреднить стратегии для разных стеков (100, 110, 150bb) в один набор весов. Как мы уже выяснили, если сеть не знает, какой сейчас стек (
