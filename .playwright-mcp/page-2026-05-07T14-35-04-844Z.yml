                        - paragraph [ref=e1032]: Требуется оценить, сколько итераций потребуется на практике.
                    - paragraph [ref=e1033]: Это специализированный вопрос, требующий честного анализа. У меня нет доступа к публикациям об этих конкретных модификациях — похоже, это собственная разработка — но я могу провести анализ на основе известных принципов.
                    - paragraph [ref=e1034]: "Ключевые моменты: P3 с softmax — умная идея для решения проблемы RM при отрицательных regrets, но convergence theory здесь не гарантирована, в отличие от классического regret matching. При τ→0 это приближается к argmax, что еще хуже для гарантий сходимости. P8 с discounting может нарушить convergence guarantees CFR, так как классический DCFR требует специфических условий. P9 добавляет state-dependent baseline, что помогает с variance reduction."
                    - paragraph [ref=e1035]: Комбинация всех этих изменений отходит от стандартной CFR и не имеет теоретических гарантий сходимости. Модификации действительно адаптированы к проблемам 6-player NLHE, но убирают доказанные гарантии. Эмпирическая сходимость зависит от деталей реализации. Есть реальные потенциальные проблемы, которые они выделяют.
                    - paragraph [ref=e1036]: "Не клипировать финальный target в softmax имеет смысл — softmax работает с любыми вещественными числами, и log1p scaling уже держит advantages в диапазоне ±5, поэтому клипирование добавило бы смещение. Но есть риск численной нестабильности если advantages становятся экстремальными от outlier траекторий — стоит мониторить percentiles. Конфликт между τ-decay и discount decay — это действительно проблема: на ранних итерациях (10-500) они сохраняют шумные regrets, пока стратегия остается почти uniform, что замедляет адаптацию."
                    - paragraph [ref=e1037]: Решение может быть в более агрессивном снижении τ на ранних этапах или в использовании warm-start периода, где первые 100 итераций работают только с uniform policy перед включением CFR. Для variance reduction per-action baseline может помочь если действия имеют разные дисперсии, но это добавляет параметры и риск overfitting. Shared weights между позициями создают риск catastrophic interference, хотя position embedding (one-hot) может помочь смягчить эту проблему.
                    - paragraph [ref=e1056]: Основные угрозы сходимости включают численную нестабильность от экстремальных advantages, недостаток данных для некоторых информационных множеств, и неправильный timing τ-decay. За 6000 итераций можно достичь приемлемой стратегии, но нужно мониторить exploitability, disagreement между итерациями и per-position-exploitability.
                    - paragraph [ref=e1065]: Теперь требуется детальный анализ их архитектуры на русском языке.*
