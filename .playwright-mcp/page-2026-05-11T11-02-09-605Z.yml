                        - generic [ref=e864]: "class RoundRobinBuffer:"
                        - generic [ref=e865]: "def __init__(self, cycle_size=6):"
                        - generic [ref=e866]: "self.buffers = {p: [] for p in range(6)} # per-player"
                        - generic [ref=e867]: self.cycle_size = cycle_size
                        - generic [ref=e868]: self.iteration = 0
                        - generic [ref=e869]: "def add(self, player, data):"
                        - generic [ref=e870]: self.buffers[player].extend(data)
                        - generic [ref=e871]: "def should_train(self):"
                        - generic [ref=e872]: "# Обучаем каждые 6 итераций (один полный цикл)"
                        - generic [ref=e873]: return self.iteration % self.cycle_size == 5
                        - generic [ref=e874]: "def get_batch_and_clear(self):"
                        - generic [ref=e875]: "# Берём данные ВСЕХ игроков, потом очищаем"
                        - generic [ref=e876]: all_data = []
                        - generic [ref=e877]: "for p in range(6):"
                        - generic [ref=e878]: all_data.extend(self.buffers[p])
                        - generic [ref=e879]: "self.buffers = {p: [] for p in range(6)}"
                        - generic [ref=e880]: return all_data
