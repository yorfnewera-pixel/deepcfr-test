                      - paragraph [ref=e926]: "Это отличный контраргумент. Вы верно выделили суть проблемы: мультимодальность, а не отсутствие меток. Использование Mixture Density Networks (MDN) для аппроксимации распределения сайзингов действительно выглядит как более чистая инженерная альтернатива Policy Gradient (PG), так как она остается в рамках supervised learning (регрессии), но при этом справляется с несколькими модами."
                      - paragraph [ref=e927]: "Однако, если мы сравним PG и MDN в контексте именно Deep CFR, у PG (особенно с baseline) остаются три фундаментальных преимущества, которые могут сделать его более предпочтительным в поиске равновесия:"
                      - heading "1. PG оптимизирует «Ожидаемый Регрет», а MDN — «Правдоподобие сэмплов»" [level=3] [ref=e928]
                      - paragraph [ref=e929]: Это самое глубокое различие.
                      - list [ref=e930]:
                        - listitem [ref=e931]:
                          - paragraph [ref=e932]: MDN пытается максимизировать Log-Likelihood того сайзинга, который был выбран в траверсале. MDN «верит», что любой сайзинг в буфере — это «хороший» пример, который нужно уметь предсказывать.
                        - listitem [ref=e933]:
                          - paragraph [ref=e934]:
