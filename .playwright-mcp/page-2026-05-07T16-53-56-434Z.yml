                    - generic [ref=e607]:
                      - paragraph [ref=e715]: Ваши рассуждения логичны, и вы верно подметили, что смешивание PG и CFR — это концептуальный «гибрид», который усложняет систему. Однако в контексте Deep CFR для игр с непрерывным или очень широким пространством действий (Continuous Action Space) использование Policy Gradient (PG) для сайзингов имеет под собой теоретическую и практическую базу.
                      - paragraph [ref=e716]: Давайте разберем, где ваши аргументы сталкиваются с особенностями обучения в покере.
                      - 'heading "1. Проблема MSE: «Среднее значение» вместо «Оптимального»" [level=3] [ref=e717]'
                      - paragraph [ref=e718]: Главный минус MSE-регрессии в покере — это работа с мультимодальными распределениями.
                      - list [ref=e719]:
                        - listitem [ref=e720]:
                          - paragraph [ref=e721]: "Пример: В одной и той же ситуации (например, на терне против слабого диапазона) CFR traversal может показать, что стратегия смешанная: в 50% случаев выгодно поставить 33% пота (small bet), а в 50% — 150% пота (overbet)."
                        - listitem [ref=e722]:
                          - paragraph [ref=e723]: "MSE: Попытается минимизировать ошибку и выдаст среднее арифметическое — ставку в ~91% пота. Это значение может быть катастрофически плохим (не попадает ни в один из эффективных сайзингов)."
                        - listitem [ref=e724]:
                          - paragraph [ref=e725]: "PG (с распределением): Обучает голову выдавать распределение. Если вы используете Tanh-squashed Gaussian, сеть может «раздуть» стандартное отклонение или, в случае с Mixture of Gaussians, выучить обе моды."
                      - heading "2. Динамика CFR vs RL" [level=3] [ref=e726]
                      - paragraph [ref=e727]: Вы правы, что CFR детерминирован в табличном виде. Но в Deep CFR мы аппроксимируем Advantage (регреты).
                      - list [ref=e728]:
                        - listitem [ref=e729]:
                          - paragraph [ref=e730]: Если вы используете MSE, вам нужен «target bet size». Но откуда он берется в traversal? Обычно это фиксированный набор сайзингов (дискретизация). Если же вы хотите, чтобы агент сам искал лучший сайзинг в непрерывном пространстве, у вас нет «целевого» значения до тех пор, пока вы его не попробуете.
                        - listitem [ref=e731]:
                          - paragraph [ref=e732]: PG здесь выступает как механизм исследования (exploration). Через сэмплирование из Gaussian сеть пробует разные сайзинги и получает для них регрет. PG позволяет обновлять веса так, чтобы увеличивать вероятность сайзингов с бóльшим регретом.
                      - heading "3. Где PG действительно лучше MSE" [level=3] [ref=e733]
                      - paragraph [ref=e734]:
                        - text: В вашей архитектуре
                        - code [ref=e735]: action_head
                        - text: выдает регреты для типов действий. Но регрет для "Raise" напрямую зависит от того, какой именно размер рейза был выбран.
                      - list [ref=e736]:
                        - listitem [ref=e737]:
                          - paragraph [ref=e738]:
                            - text: Если использовать MSE, вам придется в traversal делать дополнительный поиск (например, градиентный спуск по функции ценности) только ради того, чтобы найти
                            - code [ref=e739]: target_bet_size
                            - text: для обучения регрессии.
                        - listitem [ref=e740]:
                          - paragraph [ref=e741]: "PG делает это «бесплатно» в процессе игры: сэмплируем сайзинг -> получаем результат -> обновляем политику."
                      - heading "4. Ответ на ваши пункты" [level=3] [ref=e742]
                      - list [ref=e743]:
                        - listitem [ref=e744]:
                          - paragraph [ref=e745]:
                            - text: "Shared Base Network: Да, градиенты от"
                            - code [ref=e746]: action_head
                            - text: помогают, но они обучают представление (features), а не конкретное отображение в метрику сайзинга.
                        - listitem [ref=e747]:
