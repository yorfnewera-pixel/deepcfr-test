                        - listitem [ref=e944]:
                          - paragraph [ref=e945]: PG (за счет энтропийной регуляризации и специфики градиента) лучше работает с Exploration. Поскольку PG — это метод поиска, он более устойчив к тому, что распределение данных в буфере смещено. Он «тянет» параметры в сторону улучшения, в то время как MDN просто «фотографирует» то, что уже есть в буфере.
