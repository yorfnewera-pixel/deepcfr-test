                      - paragraph [ref=e936]: В MDN вам пришлось бы вручную фильтровать буфер или вводить веса для функции потерь на основе регретов, что фактически превращает MDN в... подобие Policy Gradient.
                      - heading "2. Проблема «Выжившего» (Sampling Bias)" [level=3] [ref=e937]
