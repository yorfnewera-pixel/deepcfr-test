                            - generic:
                              - heading [level=2]: "You said: Мне нужен экспертный анализ сходимости архитектуры Deep CFR для 6-player No-Limit Texas Hold'em."
                              - generic:
                                - generic:
                                  - generic:
                                    - generic:
                                      - generic:
                                        - paragraph: "Мне нужен экспертный анализ сходимости архитектуры Deep CFR для 6-player No-Limit Texas Hold'em. Это НЕ стандартный 2-player случай — критические отличия: 6 позиций, большинство действий -EV, огромная variance из-за 200bb стеков."
                                        - paragraph: "## Наша финальная архитектура (9 изменений)"
                                        - paragraph: "### A. Softmax-policy (заменяет Regret Matching) Вместо π(a) = max(0,R(a))/Σmax(0,R(a)): - π(a) = softmax(advantages(a)/τ), τ decays от 5.0 до 0.5 за 3000 итераций - Всегда валидное распределение, даже при all-negative advantages - Использует отрицательные advantages: fold=-0.35 vs raise=-1.47 различимы - Temperature decay заменяет ε-greedy"
                                        - paragraph: "### B. DCFR+ Discounting + Bootstrapping Вместо vanilla CFR (все итерации равновесны): - frozen prev_advantage_net (hard copy раз в 6 итераций — полный цикл ротации) - Bootstrapping target: max(R_prev * discount, 0) + r_current - discount = (t-1)²/((t-1)²+1), α=2.0 - Очистка advantage_memories[traversing_player] только за текущего игрока"
                                        - paragraph: "### C. Value Head (заменяет running_mean baseline) - value_head = nn.Linear(hidden, 1) в advantage_net - advantage = regret_raise - V(state).detach() - MSE loss для value_head"
                                        - paragraph: "### D. Числовая стабильность - Убран clip[-2,2] (log1p уже ограничивает: log1p(10^18)≈41.5) - HuberLoss delta=5.0 (согласован с log1p ±5 масштабом) - log1p для PG reward: ±200 → ±5.3 - log_prob clamp [-5,5], log_std_min=-2"
                                        - paragraph: "### E. Инфраструктура - 1 advantage_net с общими весами для всех 6 позиций (position one-hot encoded) - 6 advantage_memories, обучаем на объединённом батче - Ротация: traversing_player = iteration % 6 - LR warmup 100 итераций"
                                        - paragraph: "## Вопросы о сходимости"
                                        - list:
                                          - listitem:
                                            - paragraph: "**Softmax + CFR теория**: Regret Matching гарантирует сходимость к Нэшу в 2-player zero-sum. Softmax этой гарантии не даёт. Но в 6-player N-player general-sum CFR и так не гарантирует Нэша (только coarse correlated equilibrium). Значит ли это что потеря гарантии — не критична для 6-player? Или есть риск divergence?"
                                          - listitem:
                                            - paragraph: "**Softmax + DCFR+ interaction**: DCFR+ клиппит negative cumulative regrets (max(R,0)). Но наш bootstrapping target делает max(R_prev * discount, 0) + r_current, где r_current МОЖЕТ быть отрицательным. Итоговый R_new = max(R_prev*discount, 0) + r может быть отрицательным. Потом softmax получает отрицательные advantages. Это корректная реализация DCFR+ или мы должны клиппить финальный target тоже?"
                                          - listitem:
                                            - paragraph: "**Temperature decay timing**: τ: 5.0→0.5 за 3000 итераций из 6000. Первая половина — активное исследование, вторая — exploitation. Но DCFR+ discount делает старые regrets менее важными — это конфликтует с высокой τ на ранних итерациях (когда discount мал и старые ошибки ещё важны)?"
                                          - listitem:
                                            - paragraph: "**6-player variance**: Value Head обучается на log1p(regret_raise). Но regret_raise — разность одного действия vs взвешенного среднего по 3 действиям. В 6-player variance огромна из-за зависящих от оппонентов терминальных значений. Достаточно ли одного value_head для variance reduction, или нужен DREAM-style per-action baseline?"
                                          - listitem:
                                            - paragraph: "**Shared weights + rotation**: 1 advantage_net для всех 6 позиций. Сеть видит position через one-hot, но bootstrapping target для P0 (button) и P5 (BB) кардинально разные. Может ли одна сеть эффективно аппроксимировать advantages для всех позиций одновременно, или нужно 6 отдельных?"
                                          - listitem:
                                            - paragraph: "**Practical convergence**: При каких условиях вся эта архитектура МОЖЕТ не сойтись? Какие метрики в TensorBoard нужно мониторить как ранние признаки проблем?"
