                    - paragraph [ref=e729]: "- Риск переобучения на малых данных для late-street heads"
                    - paragraph [ref=e730]: "- Сложность отладки — каждая голова будет учиться по-своему, и диагностировать проблему станет сложнее"
                    - paragraph [ref=e731]: "- Параметрический overhead — даже при shared body, 3-4 дополнительных головы это +сотни тысяч параметров"
                    - paragraph [ref=e732]
                    - paragraph [ref=e733]: В) В классических реализациях Deep CFR (Brown et al., 2019) и даже в статье Xu et al. (2025 VR-DeepPDCFR+) — нет Stage-Specific Heads. Вместо этого сеть учится различать стадии через ENCODING входных фичей (у нас encode_state уже включает stage-информацию). Shared body + одна action_head — это стандарт.
