                    - paragraph [ref=e722]
                    - paragraph [ref=e723]: "2) Stage-Specific Heads — вот тут я скептичен. Ты предлагаешь разные головы для префлопа и постфлопа для борьбы с Catastrophic Interference. Но давай разберём:"
                    - paragraph [ref=e724]
                    - paragraph [ref=e725]: А) Catastrophic Interference — это реальная диагностированная проблема в нашем текущем обучении, или это теоретический риск «если после 6000 итераций увидите»? Мы ещё не запускали полный цикл после всех фиксов. Возможно, с исправленными C1, P8-2, P8-3 и корректным дисконтированием интерференция просто не возникнет.
                    - paragraph [ref=e726]
                    - paragraph [ref=e727]: "Б) Stage-Specific Heads — это не «лёгкая доработка». Это фундаментальное изменение архитектуры: нужно определять стадию (preflop/flop/turn/river), маршрутизировать через разные головы, обучать их раздельно или с разными loss-весами. Это добавляет:"
