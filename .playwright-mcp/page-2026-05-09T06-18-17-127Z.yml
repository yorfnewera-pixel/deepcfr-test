                    - generic [ref=e1350]: Ваш запрос
                    - paragraph [ref=e1351]: "#4 Спасибо за конкретные формулы. Но у меня серьёзные проблемы с твоим предложением. Разберём по пунктам:"
                    - paragraph [ref=e1352]
                    - paragraph [ref=e1353]: "1) Ты привёл ТРИ РАЗНЫХ формулы интеграции Value Head, и они несовместимы между собой:"
                    - paragraph [ref=e1354]
                    - paragraph [ref=e1355]: "Формула 1 (Dueling): L_adv = MSE(AdvHead(s,a) + V(s).detach(), Target_Regret + Target_Value)"
                    - paragraph [ref=e1356]: "Формула 2 (Bias): L_total = Σ(AdvHead(s,a) - Cumulative_Regret(a))² + λ·(V(s) - State_EV)²"
                    - paragraph [ref=e1357]: "Формула 3 (VR): r_VR = (v_sampled(a) - V(s)) - Σσ(a')(v_sampled(a') - V(s))"
                    - paragraph [ref=e1358]
                    - paragraph [ref=e1359]: Это три совершенно разных архитектурных подхода. Dueling (Ф1) — это идентичность из Rainbow DQN, где Q = V + A. Bias regularization (Ф2) — это aux loss. Variance Reduction (Ф3) — это control variate метод. Какой именно ты предлагаешь? Нельзя внедрить все три одновременно — они конфликтуют.
                    - paragraph [ref=e1360]
                    - paragraph [ref=e1361]: "2) Формула 3 (VR) математически некорректна для Deep CFR. Ты пишешь:"
                    - paragraph [ref=e1362]: r_VR = (v_sampled(a) - V(s)) - Σσ(a')(v_sampled(a') - V(s))
                    - paragraph [ref=e1363]
                    - paragraph [ref=e1364]: Это формула из REINFORCE с baseline, где v_sampled — это Monte Carlo return из траектории. Но Deep CFR НЕ собирает returns из траекторий! Deep CFR работает с counterfactual regrets, которые вычисляются аналитически через обход дерева. У нас нет v_sampled(a) — у нас есть immediate regret R(a|s), который уже является точным значением (не выборкой). Вычитать V(s) из точного значения — это просто добавление шума, а не variance reduction.
                    - paragraph [ref=e1365]
                    - paragraph [ref=e1366]: Variance reduction через baseline работает в RL, где reward — это выборка из распределения с высокой дисперсией. В CFR regret — это детерминированная величина, вычисленная через обход. Дисперсия в CFR приходит не от сэмплирования reward-а, а от аппроксимации сети. Value Head не может уменьшить дисперсию аппроксимации — для этого нужен更好的 advantage_net, а не дополнительный предиктор.
                    - paragraph [ref=e1367]
                    - paragraph [ref=e1368]: "3) Предложение «добавить state_value в Numpy Ring Buffer» — это изменение структуры данных. Наш PrioritizedMemory хранит (state, action_type, bet_size, regret, index, weight). Добавление state_value потребует:"
                    - paragraph [ref=e1369]: "- Изменение структуры кольцевого буфера (6 полей → 7)"
                    - paragraph [ref=e1370]: "- Вычисление state_value во время cfr_traverse (дополнительный forward pass)"
