                  - paragraph [ref=e460]: "Промпт #1. Моя позиция: в моей реализации Deep CFR я добавил bootstrap от предыдущей advantage-сети, и утверждаю что это НЕ нарушает сходимость, а является нейросетевым аналогом Discounted CFR (DCFR)."
                  - paragraph [ref=e461]
                  - paragraph [ref=e462]: "Контекст из кода: в train_advantage_network у меня есть prev_advantage_net — замороженная копия сети с прошлой итерации. Формула: bootstrap_target = torch.clamp(prev_pred * discount, min=0) + regret_tensors, где discount = (t-1)^alpha / ((t-1)^alpha + 1) при alpha=2.0. При t→∞ discount→1."
                  - paragraph [ref=e463]
                  - paragraph [ref=e464]: "Моя аргументация: это НЕ классический Bellman update (V = r + γV' с bootstrapping от будущего). Здесь regret_tensors — мгновенные регреты текущей итерации, а prev_pred*discount — взвешенные кумулятивные регреты прошлой итерации. Это эквивалент DCFR (Brown et al. 2019, теорема 3), где discount на старых регретах доказанно сохраняет сходимость к равновесию Нэша. Разница: DCFR хранит взвешенные регреты явно в буфере, а я аппроксимирую их через prev_advantage_net."
