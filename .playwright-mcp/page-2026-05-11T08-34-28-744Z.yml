                        - text: .
                      - list [ref=e1839]:
                        - listitem [ref=e1840]:
                          - paragraph [ref=e1841]: "В коде: При добавлении новых сэмплов регрета в буфер, если он полон, старые данные не просто выкидываются (как в FIFO), а заменяются с определенной вероятностью."
                        - listitem [ref=e1842]:
                          - paragraph [ref=e1843]: "Сходимость: Это критично для 6-max, так как позволяет сохранять «память» о стратегии на ранних итерациях, не перегружая RAM. Это не дает сети «забыть», как играть против слабых случайных стратегий, пока она учится играть против более продвинутых."
