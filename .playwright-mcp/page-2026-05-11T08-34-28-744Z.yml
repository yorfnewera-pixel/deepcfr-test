                    - generic [ref=e1471]:
                      - paragraph [ref=e1472]: "Твой аргумент про «черную дыру» — это технический мат. Ты абсолютно прав: в архитектуре с несколькими выходами (multi-head), где каждый выход отвечает за регрет конкретного действия, per-action обучение при наличии нелегальных действий — это яд."
                      - paragraph [ref=e1473]: Я признаю ошибку в совете оставить PER. В контексте Deep CFR (и особенно DCFR+) Reservoir Buffer с полным вектором — это не просто «другой тип памяти», это способ обеспечить математическую полноту градиента.
                      - paragraph [ref=e1474]: "Вот почему твой переход на Reservoir + Full-vector критичен:"
                      - heading "1. Проблема «заброшенных» весов (Fold Weights Decay)" [level=3] [ref=e1475]
                      - paragraph [ref=e1476]: При per-action записи, если действие Fold нелегально (Check доступен), оно никогда не попадает в буфер.
                      - list [ref=e1477]:
                        - listitem [ref=e1478]:
                          - paragraph [ref=e1479]: "В твоем текущем PER: Веса нейрона, отвечающего за Fold, просто «дрейфуют». Если они были инициализированы через Kaiming, там может быть огромное положительное число. Поскольку в обучении Fold никогда не встречается как таргет, градиент никогда не придет и не скажет этому нейрону: «Уменьши значение до нуля»."
                        - listitem [ref=e1480]:
                          - paragraph [ref=e1481]:
                            - text: "В Reservoir (Full Vector): Маска в лосс-функции"
                            - code [ref=e1482]: loss = MSE(output * mask, target * mask)
                            - text: принудительно тянет логгит нелегального действия к нулю (или
                            - generic [ref=e1486]: −∞
                            - text: при правильном маскировании) каждый раз, когда обновляется этот инфостейт.
                      - heading "2. Смещение PER (Sampling Bias) в CFR" [level=3] [ref=e1487]
                      - paragraph [ref=e1488]: PER был придуман для Deep Q-Learning, чтобы чаще учить редкие, но важные переходы. Но CFR — это не Q-learning.
                      - list [ref=e1489]:
                        - listitem [ref=e1490]:
                          - paragraph [ref=e1491]: CFR требует минимизации регрета по всему распределению действий в узле.
                        - listitem [ref=e1492]:
                          - paragraph [ref=e1493]: Если мы приоритизируем только «громкие» регреты (большие ошибки), мы теряем точность в «тихих» ветках. В DCFR+, где веса итераций меняются динамически, такая селективность PER ломает сходимость средней стратегии. Reservoir Buffer обеспечивает uniform sampling, что гарантирует несмещенную оценку математического ожидания регрета.
