                        - listitem [ref=e1851]:
                          - paragraph [ref=e1852]: "Зачем: Это стандартный трюк из материалов Брауна (CFR+ / DCFR), чтобы «отмыть» сеть от шума первых 100–500 итераций, когда игроки ведут себя как полные фиши."
                      - heading "4. Многопоточность и внешнее сэмплирование (External Sampling)" [level=3] [ref=e1853]
                      - paragraph [ref=e1854]: "В 6-max полный обход дерева (Full Traversal) невозможен. Бервегер использует External Sampling MCCFR:"
                      - list [ref=e1855]:
                        - listitem [ref=e1856]:
