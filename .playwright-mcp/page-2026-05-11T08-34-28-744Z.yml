                      - heading "2. Динамическое управление буфером (Reservoir Sampling)" [level=3] [ref=e1835]
                      - paragraph [ref=e1836]:
                        - text: В отличие от многих учебных реализаций, в его
                        - code [ref=e1837]: deep_cfr.py
                        - text: используется Reservoir Sampling для
