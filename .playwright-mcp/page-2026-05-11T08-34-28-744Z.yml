                    - paragraph [ref=e2239]: "У нас проблема с архитектурой advantage буферов в 6-player Deep CFR+. Контекст: у нас ОДНА advantage_net (не 6 отдельных), и player_id — это фича в encode_state (one-hot вектор). Сеть предсказывает regrets для ЛЮБОГО игрока."
                    - paragraph [ref=e2240]
                    - paragraph [ref=e2241]: "Раньше мы сделали 6 отдельных AdvantageBuffer (по одному на каждого игрока), и при обучении train_advantage_network_multi КОНКАТЕНИРОВАЛ все 6 буферов в один массив. Проблема: на итерации N traversing_player = N%6, prepare_iteration очищает ТОЛЬКО буфер этого игрока. Остальные 5 буферов содержат СТАРЫЕ данные из прошлых итераций (2-6 итераций назад), на которых сеть УЖЕ обучалась. Итого: каждый training call = 1/6 свежих данных + 5/6 переобучение на старых данных. Это замедляет итерацию в 6 раз."
                    - paragraph [ref=e2242]
