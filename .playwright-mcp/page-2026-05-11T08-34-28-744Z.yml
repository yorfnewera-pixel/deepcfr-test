                        - listitem [ref=e1859]:
                          - paragraph [ref=e1860]: "Сходимость: Это единственный способ «прощупать» дерево игры в 6-max. Вместо того чтобы считать всё, он делает миллионы быстрых симуляций («пробежек» по дереву), что позволяет нейронке видеть больше уникальных раздач."
                      - heading "5. Инициализация и архитектура сети" [level=3] [ref=e1861]
                      - paragraph [ref=e1862]: "Если посмотришь на саму нейронку в его коде:"
                      - list [ref=e1863]:
