                        - listitem [ref=e1866]:
                          - paragraph [ref=e1867]: "Трюк: Он использует Embedding для карт. Вместо того чтобы просто подавать числа (2, 3, 4...), он переводит каждую карту в вектор. Это помогает сети быстрее «понять» силу руки и взаимодействие мастей (Suit Isomorphism), что критично для 6-max, где важность «блокеров» (карт у оппонентов) возрастает в разы."
