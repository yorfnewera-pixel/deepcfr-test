                    - paragraph [ref=e3141]
                    - paragraph [ref=e3142]: "Оспариваю твой аргумент про Catastrophic Forgetting. Вот почему:"
                    - paragraph [ref=e3143]
                    - paragraph [ref=e3145]: "1. DCFR+ advantage_net предсказывает НЕ \"стратегию игрока X\", а \"кумулятивный regret для действия a в информационном множестве I для позиции current_player\". Формула target = max(prev_pred, 0) * discount + new_regret — это НЕ обучение с нуля на каждой итерации. Это ИНКРЕМЕНТАЛЬНОЕ обновление: target_net хранит ВСЕ прошлые regrets для ВСЕХ игроков в своих весах. Когда мы обучаем на данных Player 0, мы обновляем ТОЛЬКО regrets Player 0. Веса для Player 1-5 НЕ трогаются — они \"заморожены\" в target_net, и новый target для Player 1-5 будет = max(prev_pred_for_p1, 0) * discount + 0 (нет нового regret для них)."
                    - paragraph [ref=e3146]
                    - paragraph [ref=e3147]: 2. player_id — это one-hot фича из 6 элементов. Когда в батче нет Player 3, градиенты по весам, связанным с 3-й позицией one-hot, = 0. Сеть физически не может "забыть" Player 3 при обучении на Player 0, потому что градиент не протекает через нулевые элементы one-hot. Linear(input_size, hidden) с input[player_id_3]=0 даёт нулевой вклад в gradient для весов, связанных с позицией 3.
                    - paragraph [ref=e3148]
                    - paragraph [ref=e3149]: "3. Статья DCFR+ (2-player) обучает advantage_net на данных ОДНОГО traversing player за итерацию и НЕ хранит буферы от прошлых итераций. В 2-player это работает: iter 1 → player 0 data → train → iter 2 → player 1 data → train → iter 3 → player 0 data → train... Никакого \"experience replay\" в advantage буфере. Статья показывает сходимость."
                    - paragraph [ref=e3150]
                    - paragraph [ref=e3151]: "4. Опыт оригинального Berweger: PrioritizedMemory с circular overwrite (300K capacity, не очищается). Но он использует lr=1e-6 — ультраконсервативный, потому что без target_net stale targets создают нестабильность. Мы используем lr=1e-4 С target_net — поэтому перезапись старых данных безопасна."
                    - paragraph [ref=e3152]
                    - paragraph [ref=e3153]: "Моя позиция: один advantage_buffer, clear каждую итерацию, обучаем ТОЛЬКО на свежих данных текущего traversing_player. Это канонично по статье и безопасно благодаря target_net + ZeroInit + player_id one-hot."
