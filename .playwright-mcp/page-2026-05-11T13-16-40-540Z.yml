                    - generic [ref=e499]:
                      - paragraph [ref=e500]: Ссылка, которую ты скинул, относится к NVIDIA Isaac Gym (симулятору физики для роботов), но концепция Domain Randomization (DR) там описана абсолютно верно и она на 100% применима к твоему покерному ИИ.
                      - paragraph [ref=e501]: "В робототехнике это работает так: чтобы робот не упал на реальном скользком полу, его учат в симуляции, где постоянно рандомно меняют трение, массу робота и силу тяжести. Робот не знает, какие именно параметры сейчас, но он учится быть адаптивным."
                      - heading "Как это соотносится с твоим вопросом про \"соотношение стеков\":" [level=3] [ref=e502]
                      - paragraph [ref=e503]: В ссылке на Isaac Gym DR используется для того, чтобы нейронка не "зубрила" конкретные условия, а выучила общую физику процесса. В покере твоя "физика" — это соотношение стеков к банку.
                      - paragraph [ref=e504]: "Если ты применишь DR к стекам (например, от 100bb до 300bb), произойдет следующее:"
                      - list [ref=e505]:
                        - listitem [ref=e506]:
                          - paragraph [ref=e507]: "Обобщение (Generalization): Сеть перестанет воспринимать 100bb как единственно верный закон. Она начнет строить внутреннюю \"кривую зависимости\" агрессии от глубины стека."
                        - listitem [ref=e508]:
                          - paragraph [ref=e509]: "Устойчивость (Robustness): Как и робот в Isaac Gym, который готов к разному трению, твой бот станет готов к \"разному давлению\" денег."
                      - heading "Но есть ключевое отличие (Покер vs Роботы):" [level=3] [ref=e510]
                      - paragraph [ref=e511]: В Isaac Gym параметры (трение, масса) часто скрыты от робота (он их чувствует через сенсоры). В твоем случае значение стека — это явная фича.
                      - list [ref=e512]:
                        - listitem [ref=e513]:
                          - paragraph [ref=e514]:
                            - generic [ref=e515]:
                              - text: Если ты НЕ подаешь
                              - code [ref=e516]: stack_depth
                              - text: "на вход (скрытый параметр):"
                            - text: Сеть будет вынуждена искать "усредненную" стратегию, которая работает и при 100, и при 300bb. Это сделает её "дубовой" и неоптимальной (она будет фолдить там, где при 100bb надо пушить).
                        - listitem [ref=e517]:
                          - paragraph [ref=e518]:
                            - generic [ref=e519]:
                              - text: Если ты ПОДАЕШЬ
                              - code [ref=e520]: stack_depth
                              - text: "(как мы и решили):"
                            - text: Это превращается в Conditioned Domain Randomization. Сеть учит не одну "среднюю" стратегию, а целое семейство стратегий, переключаясь между ними в зависимости от входного числа.
                      - heading "Резюме по твоей ссылке:" [level=3] [ref=e521]
                      - paragraph [ref=e522]: Да, это именно та концепция. NVIDIA использует её, чтобы роботы выживали в хаосе реального мира. Ты можешь использовать её, чтобы твой бот выживал в хаосе разных лимитов и стеков.
                      - paragraph [ref=e523]: "Технический совет: Если решишь внедрять, делай как в Isaac Gym — не бери две точки (100 и 200), а бери непрерывный диапазон (Uniform Distribution)."
