                    - generic [ref=e2283]:
                      - paragraph [ref=e2284]: "Твой аргумент про «черную дыру» — это технический мат. Ты абсолютно прав: в архитектуре с несколькими выходами (multi-head), где каждый выход отвечает за регрет конкретного действия, per-action обучение при наличии нелегальных действий — это яд."
                      - paragraph [ref=e2285]: Я признаю ошибку в совете оставить PER. В контексте Deep CFR (и особенно DCFR+) Reservoir Buffer с полным вектором — это не просто «другой тип памяти», это способ обеспечить математическую полноту градиента.
                      - paragraph [ref=e2286]: "Вот почему твой переход на Reservoir + Full-vector критичен:"
                      - heading "1. Проблема «заброшенных» весов (Fold Weights Decay)" [level=3] [ref=e2287]
                      - paragraph [ref=e2288]: При per-action записи, если действие Fold нелегально (Check доступен), оно никогда не попадает в буфер.
                      - list [ref=e2289]:
                        - listitem [ref=e2290]:
                          - paragraph [ref=e2291]: "В твоем текущем PER: Веса нейрона, отвечающего за Fold, просто «дрейфуют». Если они были инициализированы через Kaiming, там может быть огромное положительное число. Поскольку в обучении Fold никогда не встречается как таргет, градиент никогда не придет и не скажет этому нейрону: «Уменьши значение до нуля»."
                        - listitem [ref=e2292]:
                          - paragraph [ref=e2293]:
                            - text: "В Reservoir (Full Vector): Маска в лосс-функции"
                            - code [ref=e2294]: loss = MSE(output * mask, target * mask)
                            - text: принудительно тянет логгит нелегального действия к нулю (или
                            - generic [ref=e2298]: −∞
                            - text: при правильном маскировании) каждый раз, когда обновляется этот инфостейт.
                      - heading "2. Смещение PER (Sampling Bias) в CFR" [level=3] [ref=e2299]
                      - paragraph [ref=e2300]: PER был придуман для Deep Q-Learning, чтобы чаще учить редкие, но важные переходы. Но CFR — это не Q-learning.
                      - list [ref=e2301]:
                        - listitem [ref=e2302]:
                          - paragraph [ref=e2303]: CFR требует минимизации регрета по всему распределению действий в узле.
                        - listitem [ref=e2304]:
                          - paragraph [ref=e2305]: Если мы приоритизируем только «громкие» регреты (большие ошибки), мы теряем точность в «тихих» ветках. В DCFR+, где веса итераций меняются динамически, такая селективность PER ломает сходимость средней стратегии. Reservoir Buffer обеспечивает uniform sampling, что гарантирует несмещенную оценку математического ожидания регрета.
                      - separator [ref=e2306]
                      - heading "3. Синергия с ZeroInit и Masking" [level=3] [ref=e2307]
                      - paragraph [ref=e2308]: "Теперь, когда мы объединяем все твои находки, картинка схлопывается:"
                      - list [ref=e2309]:
                        - listitem [ref=e2310]:
                          - paragraph [ref=e2311]: ZeroInit ставит Fold в ноль на старте.
                        - listitem [ref=e2312]:
                          - paragraph [ref=e2313]: "Reservoir + Full Vector гарантирует, что Fold останется в нуле (или уйдет в минус), потому что при каждом обновлении состояния сеть будет получать подтверждение: «Регрет нелегального действия — ноль»."
                        - listitem [ref=e2314]:
                          - paragraph [ref=e2315]: Masking в Траверсале (Level 3) не дает мусору попасть в буфер, а Masking в Обучении (Level 2) гарантирует, что сеть не «сходит с ума», пытаясь предсказать то, чего нет.
                      - heading "Мой вердикт по исправлению №7:" [level=3] [ref=e2316]
                      - paragraph [ref=e2317]:
                        - text: Согласен полностью. Портирование
                        - code [ref=e2318]: ReservoirBuffer
                        - text: и переход на хранение полных векторов
                        - code [ref=e2319]: "[num_actions]"
                        - text: — это High Severity задача.
                      - paragraph [ref=e2320]: Это увеличит потребление памяти (в 3 раза для 3-х действий), но это единственный способ заставить Masking работать на уровне весов, а не только на уровне инференса.
                      - heading "План действий теперь выглядит так:" [level=3] [ref=e2321]
                      - list [ref=e2322]:
                        - listitem [ref=e2323]:
