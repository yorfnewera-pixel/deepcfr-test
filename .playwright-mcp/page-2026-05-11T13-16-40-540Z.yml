                      - 'heading "3. Роль Дисконта: он не «чистит» данные, он их «приглушает»" [level=3] [ref=e3744]'
                      - paragraph [ref=e3745]:
                        - text: Дисконт в DCFR+ (
                        - generic [ref=e3754]:
                          - generic [ref=e3756]: t+0.5
                          - generic [ref=e3759]: t−1
                        - text: ) нужен для того, чтобы сумма регретов не росла бесконечно и чтобы ошибки прошлого имели меньше веса.
                      - list [ref=e3763]:
                        - listitem [ref=e3764]:
                          - paragraph [ref=e3765]: Но в буфере у тебя не «сумма», а отдельные сэмплы.
                        - listitem [ref=e3766]:
                          - paragraph [ref=e3767]:
                            - text: Когда ты берешь сэмпл из итерации №10 и применяешь к нему текущий огромный
                            - code [ref=e3768]: discount
                            - text: "(например, для итерации №500), ты фактически говоришь сети: «Предскажи число, которое почти полностью состоит из того, что думает"
                            - code [ref=e3769]: target_net
                            - text: ", плюс крошечная добавка старого регрета»."
                        - listitem [ref=e3770]:
                          - paragraph [ref=e3771]: В этот момент обучение превращается в Self-Referential Learning (сеть учится у самой себя почти без влияния свежих данных из траверсала). Это прямой путь к стагнации или коллапсу весов.
                      - heading "4. Единственная причина для 300K — \"Full Traversal\"" [level=3] [ref=e3772]
                      - paragraph [ref=e3773]: Если бы ты делал Full Traversal (обход всего дерева), тебе вообще не нужен был бы буфер — ты бы обновлял сеть сразу. Буфер — это костыль для Sampling CFR, чтобы уменьшить дисперсию.
                      - list [ref=e3774]:
                        - listitem [ref=e3775]:
                          - paragraph [ref=e3776]: 300K записей при 1000 новых записей за итерацию — это «память» на 300 шагов. В Deep Learning для игр с неполной информацией (как покер) оптимальное окно обычно составляет 10–40 «обновлений» каждого параметра.
                        - listitem [ref=e3777]:
                          - paragraph [ref=e3778]: 300 — это слишком длинный хвост. Сеть будет «вязнуть» в прошлом.
                      - heading "Резюме по Промпту №4:" [level=3] [ref=e3779]
                      - paragraph [ref=e3780]:
                        - text: Ты прав, что
                        - code [ref=e3781]: discount
                        - text: +
                        - code [ref=e3782]: target_net
                        - text: делают старые данные менее токсичными. Но они не делают их полезными.
                      - paragraph [ref=e3783]:
                        - text: "Мой совет: Не ограничивайся 12 итерациями, раз ты боишься Catastrophic Forgetting. Возьми 30–60 итераций ("
