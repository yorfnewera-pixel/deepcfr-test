                        - code [ref=e2635]: dberweger2017
                        - text: (Давиде Бервегер) для 6-max покера решение проблемы сходимости в таком гигантском пространстве состояний (Texas Hold'em 6-max на порядки сложнее HUNL) строится на нескольких ключевых программных и алгоритмических «костылях», которые отличают его от канонического Deep CFR Ноама Брауна.
                      - paragraph [ref=e2636]:
                        - text: Вот как он пытался заставить это работать (анализ кода
                        - code [ref=e2637]: deep_cfr.py
                        - text: "и связанных модулей):"
                      - heading "1. Агрессивное сокращение пространства (Betting Abstractions)" [level=3] [ref=e2638]
                      - paragraph [ref=e2639]: "В коде ты не увидишь работы с произвольными ставками. Вместо этого он использует жесткую абстракцию действий:"
                      - list [ref=e2640]:
                        - listitem [ref=e2641]:
                          - paragraph [ref=e2642]:
                            - text: "Логика выбора действий: В"
                            - code [ref=e2643]: get_legal_actions()
                            - text: "(обычно вызываемом из окружения) доступные действия ограничены фиксированным набором: Fold, Check/Call и 1–2 варианта Raise (например, 0.5x pot или 1x pot)."
                        - listitem [ref=e2644]:
                          - paragraph [ref=e2645]:
                            - text: "Зачем это в коде: Если позволить 6 игрокам ставить любой размер, дерево разрастется настолько, что"
                            - code [ref=e2646]: advantage_net
                            - text: никогда не получит достаточно сэмплов для одного и того же «типа» ситуации. Сокращая выбор до 3–4 кнопок, он делает функцию регрета более «гладкой» для обучения нейронки.
                      - heading "2. Динамическое управление буфером (Reservoir Sampling)" [level=3] [ref=e2647]
                      - paragraph [ref=e2648]:
                        - text: В отличие от многих учебных реализаций, в его
                        - code [ref=e2649]: deep_cfr.py
                        - text: используется Reservoir Sampling для
                        - code [ref=e2650]: advantage_buffer
                        - text: .
                      - list [ref=e2651]:
                        - listitem [ref=e2652]:
                          - paragraph [ref=e2653]: "В коде: При добавлении новых сэмплов регрета в буфер, если он полон, старые данные не просто выкидываются (как в FIFO), а заменяются с определенной вероятностью."
                        - listitem [ref=e2654]:
                          - paragraph [ref=e2655]: "Сходимость: Это критично для 6-max, так как позволяет сохранять «память» о стратегии на ранних итерациях, не перегружая RAM. Это не дает сети «забыть», как играть против слабых случайных стратегий, пока она учится играть против более продвинутых."
                      - heading "3. Линейное дисконтирование (Linear CFR / Discounting)" [level=3] [ref=e2656]
                      - paragraph [ref=e2657]:
                        - text: Хотя в названии репозитория не всегда фигурирует "Discounted", в логике обновления весов (коэффициенты
                        - code [ref=e2658]: t / (t + 1)
                        - text: ) прослеживается попытка ускорить сходимость.
                      - list [ref=e2659]:
                        - listitem [ref=e2660]:
                          - paragraph [ref=e2661]:
                            - text: "В коде: При тренировке"
                            - code [ref=e2662]: advantage_net
                            - text: он часто использует веса итераций. Более поздние итерации (где стратегия игрока уже более осмысленна) имеют больший вес в лосс-функции.
                        - listitem [ref=e2663]:
                          - paragraph [ref=e2664]: "Зачем: Это стандартный трюк из материалов Брауна (CFR+ / DCFR), чтобы «отмыть» сеть от шума первых 100–500 итераций, когда игроки ведут себя как полные фиши."
                      - heading "4. Многопоточность и внешнее сэмплирование (External Sampling)" [level=3] [ref=e2665]
                      - paragraph [ref=e2666]: "В 6-max полный обход дерева (Full Traversal) невозможен. Бервегер использует External Sampling MCCFR:"
                      - list [ref=e2667]:
                        - listitem [ref=e2668]:
                          - paragraph [ref=e2669]:
                            - text: "В коде: В методе"
                            - code [ref=e2670]: traverse_tree
                            - text: обновляется регрет только для одного игрока (traversing player), а за остальных делаются случайные выборы согласно их текущей стратегии.
                        - listitem [ref=e2671]:
                          - paragraph [ref=e2672]: "Сходимость: Это единственный способ «прощупать» дерево игры в 6-max. Вместо того чтобы считать всё, он делает миллионы быстрых симуляций («пробежек» по дереву), что позволяет нейронке видеть больше уникальных раздач."
                      - heading "5. Инициализация и архитектура сети" [level=3] [ref=e2673]
                      - paragraph [ref=e2674]: "Если посмотришь на саму нейронку в его коде:"
                      - list [ref=e2675]:
                        - listitem [ref=e2676]:
                          - paragraph [ref=e2677]: Она относительно неглубокая (обычно 2–3 скрытых слоя по 64–128 нейронов).
                        - listitem [ref=e2678]:
                          - paragraph [ref=e2679]: "Трюк: Он использует Embedding для карт. Вместо того чтобы просто подавать числа (2, 3, 4...), он переводит каждую карту в вектор. Это помогает сети быстрее «понять» силу руки и взаимодействие мастей (Suit Isomorphism), что критично для 6-max, где важность «блокеров» (карт у оппонентов) возрастает в разы."
                      - heading "Почему это может «не завестись» у тебя (проблема 33% фолда):" [level=3] [ref=e2680]
                      - paragraph [ref=e2681]: "Если ты просто скопируешь его код, ты можешь столкнуться с тем же, что обсуждали раньше:"
                      - list [ref=e2682]:
                        - listitem [ref=e2683]:
                          - paragraph [ref=e2684]: "Отсутствие маскирования: В его коде маска легальных действий применяется в конце. Если ты не добавишь её в саму функцию потерь (как мы обсуждали в Этапе 1), сеть будет тратить ресурсы на обучение «нелегальным» фолдам."
                        - listitem [ref=e2685]:
