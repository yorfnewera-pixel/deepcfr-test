                    - paragraph [ref=e570]: "#1 Я нашёл 7 критических отличий нашей реализации Deep CFR+ от оригинального DeepPDCFR (код с GitHub rpSebastian/DeepPDCFR + статью deeppdcfr.tex). Наша сеть после 4200 итераций фолдит AA в 33% случаев — probability Fold=0.34 во ВСЕХ состояниях без исключения (min=0.344, max=0.351), нулевая дискриминация."
                    - paragraph [ref=e571]
                    - paragraph [ref=e572]: "Вот отличия:"
                    - paragraph [ref=e573]
                    - paragraph [ref=e574]: "1. **Fold+Check одновременно**: Наш движок pokers даёт Fold и Check одновременно. Оригинальный OpenSpiel — НИКОГДА. Наше обучение НЕ маскирует Fold когда Check бесплатен."
                    - paragraph [ref=e575]
                    - paragraph [ref=e576]: "2. **ZeroInit vs Kaiming**: Оригинал инициализирует ПОСЛЕДНИЙ слой advantage_net нулями (ZeroInitLinear). Мы — стандартным PyTorch (Kaiming). Bootstrap с мусорных начальных значений."
                    - paragraph [ref=e577]
                    - paragraph [ref=e578]: "3. **Деноминатор дисконта DCFR+**: Оригинал: `(t-1)^α / ((t-1)^α + 1.5)`. Мы: `+ 1` вместо `+ 1.5`. Слабый дисконт → старые ошибки дольше живут."
                    - paragraph [ref=e579]
                    - paragraph [ref=e580]: "4. **Strategy loss**: Оригинал: MSE + `(t/T)^(γ/2)`. Мы: Cross-entropy + `floor((iter+1)/2)`."
                    - paragraph [ref=e581]
                    - paragraph [ref=e582]: "5. **Буфер**: Оригинал: Reservoir (uniform sampling). Мы: Prioritized replay с `|log1p(r)| + 0.01`. Priority подавляет нулевые регреты Fold."
                    - paragraph [ref=e583]
                    - paragraph [ref=e584]: "6. **Legal action masking**: Оригинал: `model(x) * mask` — logits зануляются до softmax. Мы: нет маскирования, softmax видит все 3 действия."
                    - paragraph [ref=e585]
                    - paragraph [ref=e586]: "7. **Регрет scaling**: Оригинал: raw counterfactual regrets. Мы: `sign(r)*log1p(|r|)` — сжатие может прятать сигналы."
                    - paragraph [ref=e587]
                    - paragraph [ref=e588]: "Мой анализ: причина ≈33% Fold не в одном баге, а в комбинации. Advantage net вообще не научился различать действия — все 3 logits почти равны → softmax ≈ 1/3."
