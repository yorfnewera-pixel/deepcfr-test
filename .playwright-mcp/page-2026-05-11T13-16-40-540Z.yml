                    - paragraph [ref=e2378]: "**Full-vector storage**: Фиксированный размер [NUM_ACTIONS=3]. Наша абстракция — 3 bucket действий: Fold(0), Check/Call(1), Raise(2). Это покрывает все состояния покера. Маска [1,1,1] или [0,1,1] или [1,1,0] и т.д."
                    - paragraph [ref=e2379]
                    - paragraph [ref=e2380]: "**MSE Loss**: Да, full-vector таргет позволяет чистый MSE. Но есть нюанс — оригинал хранит cf_regrets[NUM_ACTIONS] и legal_actions_mask[NUM_ACTIONS] отдельно. В лоссе:"
                    - paragraph [ref=e2381]: "```python"
                    - paragraph [ref=e2382]: "outputs = model(x) * mask # advantage_net predict с mask"
                    - paragraph [ref=e2383]: "loss = MSE(outputs, regrets) # regrets уже умножены на mask при хранении?"
                    - paragraph [ref=e2384]: "```"
                    - paragraph [ref=e2385]: "Нет — в оригинале regrets хранятся БЕЗ маски (cf_regrets содержит значения только для legal, остальные = 0 по построению). mask хранится отдельно и применяется к predict: `model(x) * mask`. MSE считает лосс по всем действиям, но для нелегальных: pred=0 (через mask*output), target=0 → loss=0. Корректно."
                    - paragraph [ref=e2386]
                    - paragraph [ref=e2387]: "Итого финальный план портирования (Этап 1 — минимальный жизнеспособный):"
                    - paragraph [ref=e2388]
                    - paragraph [ref=e2389]: "1. **ZeroInit**: `action_head.weight.fill_(0); action_head.bias.fill_(0)` — после создания PokerNetwork"
                    - paragraph [ref=e2390]: "2. **ReservoirBuffer**: хранит (state[157], regrets[3], mask[3], iteration). `add()` — reservoir sampling. `sample()` — uniform."
                    - paragraph [ref=e2391]: "3. **Advantage training**: `pred = advantage_net(x)[:, :3] * mask_tensor; target = regrets_tensor; loss = MSE(pred, target)`"
                    - paragraph [ref=e2392]: "4. **DCFR+ bootstrap**: `target = max(prev_pred, 0) * (t-1)^α / ((t-1)^α + 1.5) + cf_regrets` — ТОЧНО как VRDCFRPlusRegretTrainer"
                    - paragraph [ref=e2393]: "5. **Target sync**: `target_model.load_state_dict(model.state_dict())` ПОСЛЕ training, КАЖДУЮ итерацию"
                    - paragraph [ref=e2394]: "6. **Strategy masking**: `logits = where(mask==1, logits, -1e20); policy = softmax(logits)`"
                    - paragraph [ref=e2395]: "7. **Strategy loss**: `MSE(policy * weight, target_policy * weight)` где `weight = (t/T*2)^(γ/2)`"
