                      - blockquote [ref=e352]:
                        - paragraph [ref=e353]: "Проблема: Для нейросети ситуация «У меня 100, у соседа 300» и «У меня 300, у соседа 100» — это две абсолютно разные планеты. Обобщить это крайне сложно. Сети придется выучить не просто «как играть глубоко», а «как играть глубоко против коротыша, имея за спиной еще одного глубокого игрока»."
                      - heading "2. Масштабируемость и Обобщение" [level=3] [ref=e354]
