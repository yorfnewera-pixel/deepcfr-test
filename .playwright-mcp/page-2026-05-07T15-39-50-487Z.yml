                    - paragraph [ref=e780]: "Я не согласен с аналогией \"классический Bellman-update\". Давайте разберём точнее. В моём коде: bootstrap_target = clamp(prev_pred * discount, min=0) + current_regrets. Здесь current_regrets — это мгновенные регреты текущей итерации, НЕ reward. Это НЕ Bellman (V = r + γV'), где bootstrapping от будущих value. Это скорее аппроксимация взвешенного кумулятивного регрета: weighted_R^t = discount * R^{t-1} + r^t. А это в точности Discounted CFR (DCFR, Brown et al. 2019, теорема 3), где сходимость доказана при discount → 1. Разница фундаментальная: Bellman bootstraps от будущего (может расходиться), а здесь bootstraps от прошлого (уже наблюдённые регреты). Следовательно, если discount сходится к 1 достаточно быстро, вес текущих данных доминирует, и сходимость сохраняется. Также вы предлагаете Polyak Averaging — но в CFR prev_advantage_net хранит ровно предыдущую итерацию. Нет онлайнового конфликта target/online как в DQN, потому что данные берутся из traversals, не из предсказаний сети. Soft updates бессмысленны — CFR итеративен по природе. Где я ошибаюсь в этой аргументации?"
