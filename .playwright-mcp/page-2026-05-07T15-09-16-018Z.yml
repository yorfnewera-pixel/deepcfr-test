                    - paragraph [ref=e568]: "**МОЙ ВОПРОС**: Вариант C меняет discount с DCFR+ формулы на tanh — это ломает теоретическое обоснование DCFR+ (α=2.0 даёт оптимальный discount rate). Вариант A (ускорить τ) — проще и сохраняет DCFR+. Но нужен ли вообще фикс? Может шумные regrets на итерациях 1-100 не критичны — сеть всё равно учится, и DCFR+ discount правильно взвешивает?"
                    - paragraph [ref=e569]
                    - paragraph [ref=e570]: "### Спор 2: Клиппить ли финальный bootstrapping target?"
                    - paragraph [ref=e571]
                    - paragraph [ref=e572]: "**Оба AI согласны**: НЕ клиппить — правильно. Softmax обрабатывает отрицательные advantages корректно."
                    - paragraph [ref=e573]
                    - paragraph [ref=e574]: "**МОЙ ВОПРОС**: Но стандартный DCFR+ клиппит max(R,0) ПОСЛЕ суммирования. Мы делаем max(R_prev*discount, 0) ДО добавления r_current. Это не просто \"не клиппим финальный target\" — это ДРУГОЙ порядок операций. Правильно ли что при softmax-policy этот порядок операций корректен? Или нужно max(R_prev*discount + r_current, 0) — клиппить после суммы?"
                    - paragraph [ref=e575]
                    - paragraph [ref=e576]: "### Спор 3: Catastrophic interference в shared weights"
                    - paragraph [ref=e577]
                    - paragraph [ref=e578]: "**Haiku**: cos(grad_UTG, grad_BTN) ≈ -0.3 (антагонистично!) → сеть почти не обучает первые слои. Вероятность 60%."
                    - paragraph [ref=e579]
                    - paragraph [ref=e580]: "**Claude**: Один value_head недостаточен для 6-player variance."
                    - paragraph [ref=e581]
                    - paragraph [ref=e582]: "**МОЙ ВОПРОС**: Haiku предполагает что батч — random mix из 6 позиций. Но наш батч — ОБЪЕДИНЁННЫЙ из advantage_memories всех 6 игроков. Ключевой момент: при rotation traversing_player = iteration%6, данные за P0 собираются на итерации 0,6,12..., а за P5 на итерациях 5,11,17... Это значит данные НЕ смешиваются одновременно — каждый игрок доминирует в своём буфере. Это меняет ли оценку catastrophic interference?"
                    - paragraph [ref=e583]
                    - paragraph [ref=e584]: "### Спор 4: Один V(s) vs per-action V(s,a)?"
                    - paragraph [ref=e585]
                    - paragraph [ref=e586]: "**Оба AI**: Один V(s) достаточен. Haiku: per-action overfit на rare info sets."
                    - paragraph [ref=e587]
                    - paragraph [ref=e588]: "**МОЙ ВОПРОС**: Но у нас advantage = regret_raise - V(state).detach(). Это НЕ стандартный actor-critic advantage. Это CFR advantage (counterfactual regret) минус baseline. Fold advantage ≈ -0.35 (мало variance), raise advantage ≈ -1.47 (огромная variance от opponent-dependent outcomes). Разве один V(s) не будет \"переподгоняться\" под high-variance raise, игнорируя fold? Это не классический A2C где advantage = Q-V одинаковой природы для всех действий."
