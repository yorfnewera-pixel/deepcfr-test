                    - paragraph [ref=e536]
                    - paragraph [ref=e537]: "## Наша архитектура (9 изменений, уже реализованы)"
                    - paragraph [ref=e538]
                    - paragraph [ref=e539]: "**P1. Убран clip[-2,2]** — log1p уже ограничивает regret. Clip убивал сигнал."
                    - paragraph [ref=e540]
                    - paragraph [ref=e541]: "**P2. HuberLoss delta=5.0** — вместо delta=1.0. Масштаб advantages после log1p ≈ ±5."
                    - paragraph [ref=e542]
                    - paragraph [ref=e543]: "**P3. Softmax-policy вместо Regret Matching** — КЛЮЧЕВОЕ. π(a) = softmax(advantages(a)/τ). τ: 5.0→0.5 за 3000 итераций (из 6000). Решает RM fold-collapse: при all-negative regrets RM даёт uniform, softmax различает fold=-0.35 vs raise=-1.47."
                    - paragraph [ref=e544]
                    - paragraph [ref=e545]: "**P4. sign(x)*log1p(|x|) scaling для PG reward** — ±200bb → ±5.3."
                    - paragraph [ref=e546]
                    - paragraph [ref=e547]: "**P5-6. log_prob clamp [-5,5], log_std_min=-2** — градиентный контроль."
                    - paragraph [ref=e548]
                    - paragraph [ref=e549]: "**P7. LR warmup 100 итераций**."
                    - paragraph [ref=e550]
                    - paragraph [ref=e551]: "**P8. DCFR+ Discounting + Bootstrapping** — frozen prev_advantage_net (hard copy каждые 6 итераций). Target: max(R_prev*discount, 0) + r_current. discount=(t-1)²/((t-1)²+1), α=2.0. r_current МОЖЕТ быть отрицательным — итоговый target МОЖЕТ быть отрицательным."
                    - paragraph [ref=e552]
                    - paragraph [ref=e553]: "**P9. Value Head** — value_head = nn.Linear(hidden, 1) в advantage_net. advantage = regret_raise - V(state).detach()."
                    - paragraph [ref=e554]
                    - paragraph [ref=e555]: "Контекст: 1 advantage_net с position one-hot для 6 позиций, 6 advantage_memories, rotation iteration%6, 200bb стеки, ~95% UTG -EV."
                    - paragraph [ref=e556]
                    - paragraph [ref=e557]: "## Аргументы двух AI и мои вопросы к тебе"
