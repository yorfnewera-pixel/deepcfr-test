                    - paragraph [ref=e812]: "Промпт #1. Ты уже знаком с VR-DeepPDCFR+ из загруженной статьи. Теперь вопрос к тебе как к эксперту: в моей реализации Deep CFR (до того как я нашёл вашу статью) я независимо пришёл к похожей идее — добавил prev_advantage_net и bootstrap_target в train_advantage_network. Формула: bootstrap_target = torch.clamp(prev_pred * discount, min=0) + regret_tensors, где discount = (t-1)^2 / ((t-1)^2 + 1). По сути это target network с убывающим discount-фактором, аппроксимирующая DCFR."
                    - paragraph [ref=e813]
                    - paragraph [ref=e814]: "Моя позиция: это НЕ нарушает сходимость CFR, потому что это нейросетевой аналог Discounted CFR (Brown et al. 2019, теорема 3), где discount на старых regrets доказанно сохраняет сходимость. Разница только в том что DCFR хранит взвешенные regrets явно в буфере, а я аппроксимирую их через prev_advantage_net."
                    - paragraph [ref=e815]
