              - generic [ref=e955]:
                - paragraph [ref=e956]: "Ты анализировал vanilla Deep CFR. Но у нас НЕ vanilla — мы внесли 9 фундаментальных изменений специально для 6-player NLHE. Оцени сходимость ИМЕННО этой архитектуры: ## Наши 9 изменений (уже реализованы) **P1. Убран clip[-2,2]** — log1p уже ограничивает regret: log1p(10^18)≈41.5. Clip[-2,2] убивал сигнал — fold regret 0.35 и raise regret 1.47 оба клиппились в 1.0-2.0. **P2. HuberLoss delta=5.0** — вместо smooth_l1_loss (delta=1.0). Наш масштаб advantages после log1p ≈ ±5, delta=1.0 давала L1-градиент для |x|>1, delta=5.0 сохраняет квадратичный градиент в рабочем диапазоне. **P3. Softmax-policy вместо Regret Matching** — КЛЮЧЕВОЕ ИЗМЕНЕНИЕ. Вместо π(a) = max(0,R(a))/Σmax(0,R(a)) используем π(a) = softmax(advantages(a)/τ). τ decays от 5.0 до 0.5 за 3000 итераций (из 6000). Это решает RM fold-collapse: при all-negative regrets RM даёт uniform, softmax различает fold=-0.35 vs raise=-1.47. При τ→0 softmax→argmax≈RM. **P4. sign(x)*log1p(|x|) scaling для PG reward** — regret_raise ±200bb → ±5.3. Без scaling преимущество raise над fold = 0.85/1.47 = noise; с log1p = 0.65/5.3 = значимое. **P5-6. log_prob clamp [-5,5], log_std_min=-2** — градиентный контроль для PG sizing сети. Без clamp log_prob мог быть -50, давая градиент ×50. **P7. LR warmup 100 итераций + --clean-buffers** — сеть не учит первые 100 шагов с LR=0, потом линейный warmup. clean-buffers для очистки старых данных при резюме. **P8. DCFR+ Discounting + Bootstrapping** — frozen prev_advantage_net (hard copy каждые 6 итераций = полный цикл ротации). Bootstrapping target: max(R_prev * discount, 0) + r_current. discount = (t-1)²/((t-1)²+1), α=2.0. Ключевой фикс: clearing advantage_memories[traversing_player] ТОЛЬКО за текущего игрока (было: все 6 буферов каждую итерацию → 5 всегда пустых). **P9. Value Head** — value_head = nn.Linear(hidden, 1) прямо в advantage_net. advantage = regret_raise - V(state).detach(). MSE loss для value_head. Заменяет running_mean baseline (1 скаляр на всё). V(s) — условный baseline зависящий от состояния. ## Критический контекст 6-player - 1 advantage_net с position one-hot для всех 6 позиций - Ротация: traversing_player = iteration % 6 - 6 advantage_memories, обучаем на объединённом батче - 200bb стеки → огромная variance терминальных значений - ~95% UTG действий -EV ## Вопросы 1. P3 (softmax) + P8 (DCFR+): Наш bootstrapping target = max(R_prev*discount, 0) + r_current. r_current может быть отрицательным. Итоговый target МОЖЕТ быть отрицательным. Стандартный DCFR+ клиппит финальную сумму. Мы НЕ клиппим — softmax обрабатывает отрицательные advantages корректно (fold=-0.35 vs raise=-1.47 различимы). Правильно ли НЕ клиппить финальный target в softmax-CFR? 2. P3 τ-decay vs P8 discount: discount→1 к итерации ~10 (α=2.0), но τ ещё 4.8. На итерациях 10-500 discount≈1 (старые regrets полностью сохраняются), а стратегия почти равномерная (τ=5.0). Получается DCFR+ \"запоминает\" шумные regrets от почти случайной игры. Это реальный конфликт? Нужно ли менять τ-decay timing (5.0→0.5 за 500 вместо 3000)? 3. P9 Value Head: Один V(s) для variance reduction. Но advantage fold имеет variance≈0, а advantage raise имеет variance≈±200bb. Достаточно ли одного V(s), или нужен per-action baseline (3 выхода: V(s,fold), V(s,call), V(s,raise))? 4. Shared weights (1 net, 6 positions): Может ли одна сеть с one-hot position эффективно аппроксимировать advantages для UTG (95% -EV, fold-dominant) и Button (много +EV, raise-dominant) одновременно? Или catastrophic interference неизбежен? 5. Сходимость: При каких условиях ЭТА конкретная архитектура (softmax+DCFR++ValueHead+log1p+shared_weights) МОЖЕТ не сойтись? Какие метрики мониторить? 6. Практический прогноз: Ожидаете ли вы что 6000 итераций с DCFR+ достаточно для приемлемой стратегии, или нужно 50000+ как в vanilla Deep CFR?"
