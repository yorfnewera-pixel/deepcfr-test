                      - heading "Когда «лучше» становится врагом «хорошего»?" [level=2] [ref=e1321]
                      - paragraph [ref=e1322]: В Deep CFR самое опасное — это Overfitting (переобучение) под текущий состав буфера. Если ты слишком сильно ускоришь обучение, модель может начать идеально играть против «вчерашней» версии самой себя, но потеряет общую логику игры против других стилей.
