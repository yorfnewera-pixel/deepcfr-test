                      - separator [ref=e631]
                      - heading "2. Почему твой \"Дискантер\" (DCFR) — это \"Автомат Калашникова\"" [level=3] [ref=e632]
                      - paragraph [ref=e633]: Если мы говорим о Discounted CFR (DCFR), то это не просто «один из алгоритмов». В статье 2019 года от Брауна и Сандхольма было доказано, что DCFR сходится быстрее, чем любые предыдущие версии CFR (включая CFR+), особенно в играх с глубоким деревом.
                      - paragraph [ref=e634]: "Почему твой подход сейчас — это оптимум:"
                      - list [ref=e635]:
                        - listitem [ref=e636]:
                          - paragraph [ref=e637]: "Скорость сходимости: Дискантирование позволяет алгоритму игнорировать ошибки первых итераций («детские болезни»). Это именно то, что позволяет тебе видеть снижение лосса уже на 3000 итерациях."
                        - listitem [ref=e638]:
                          - paragraph [ref=e639]: "Адаптивность к Deep Learning: Твой дискантер идеально «дружит» с нейросетями. Он выдает им более стабильные таргеты, чем старые методы."
                        - listitem [ref=e640]:
