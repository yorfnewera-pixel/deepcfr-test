                          - paragraph [ref=e1317]: "Идея: На старте делать дисконтирование более агрессивным (быстрее забывать хаос), а к концу — более мягким, чтобы модель учитывала накопленный опыт более детально."
                        - listitem [ref=e1318]:
                          - paragraph [ref=e1319]: "Но осторожно: Это как раз та зона, где «метод тыка» может всё испортить. Если всё и так идет плавно, я бы оставил константы из статьи."
