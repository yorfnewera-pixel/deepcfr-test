                      - heading "1. Почему твои цифры лосса — это нормально?" [level=3] [ref=e499]
                      - paragraph [ref=e500]: В «старом» Deep CFR лосс стратегии часто взлетал до сотен (120–140), потому что регреты накапливались линейно и безжалостно. Это как снежный ком, который катится с горы.
