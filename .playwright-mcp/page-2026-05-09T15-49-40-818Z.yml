                      - separator [ref=e409]
                      - heading "3. Где может быть подвох? (Две реальные опасности)" [level=3] [ref=e410]
                      - paragraph [ref=e411]: "Вместо отсутствия сходимости, ты можешь столкнуться с двумя другими вещами:"
                      - list [ref=e412]:
                        - listitem [ref=e413]:
                          - paragraph [ref=e414]: "Недостаточная емкость сети: Если нейросеть слишком маленькая, она просто не сможет «запомнить» всю сложность покера. Она сойдется, но к «средненькой» стратегии. (Но если ты используешь стандартные архитектуры для Deep CFR, этого не должно случиться)."
                        - listitem [ref=e415]:
                          - paragraph [ref=e416]: "Дрейф стратегии: Если ты учишь слишком долго без правильной регуляризации, сеть может начать «забывать» то, что выучила в начале. Поэтому в Deep CFR используют Experience Replay Buffer (буфер памяти), чтобы сеть постоянно повторяла пройденный материал."
                      - separator [ref=e417]
                      - heading "4. Почему твой Blueprint будет работать?" [level=3] [ref=e418]
                      - paragraph [ref=e419]: Даже без поиска, чистый Deep CFR показал выдающиеся результаты. В научных работах (например, оригинальной статье по Deep CFR от Brown et al.) есть графики, где чистый алгоритм без всяких «надстроек» отлично сходится в Leduc и малых вариантах NLH.
                      - paragraph [ref=e420]: "Твой «защитный слой»: Поскольку ты используешь изоморфизм мастей и правильную подачу данных (позиции, эффективные стеки), ты колоссально упрощаешь задачу для нейросети. Ты как бы «спрямляешь» ей дорогу к сходимости."
