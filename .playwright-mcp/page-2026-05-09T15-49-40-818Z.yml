                          - paragraph [ref=e647]: "PPO-методы (первая статья): Могут дать «кривую» стратегию, которую профи раскусят за 500 рук."
                        - listitem [ref=e648]:
                          - paragraph [ref=e649]: "Твой DCFR: Даст «каменную» стратегию. Она может быть чуть менее гибкой без поиска, но в ней не будет фундаментальных дыр."
