                      - paragraph [ref=e390]: Тут важно различать математическую сходимость и практическую силу игры. Твой алгоритм Deep CFR обязан сойтись по определению, если ты всё настроил верно.
                      - paragraph [ref=e391]: "Вот почему тебе не стоит бояться «несоходимости»:"
                      - separator [ref=e392]
                      - heading "1. Сходимость — это свойство CFR, а не поиска" [level=3] [ref=e393]
                      - paragraph [ref=e394]:
                        - text: Сходимость (уменьшение регрета) происходит на этапе обучения. Когда ты крутишь свои 360 часов, алгоритм
                        - code [ref=e395]: cfr_traverse
                        - text: и нейросеть работают над тем, чтобы минимизировать ошибку.
                      - list [ref=e396]:
                        - listitem [ref=e397]:
                          - paragraph [ref=e398]: Поиск в реальном времени (Search) вообще не участвует в обучении. Это «присадка», которую используют уже после того, как веса сошлись.
                        - listitem [ref=e399]:
                          - paragraph [ref=e400]: Если твой Blueprint (веса) не сойдется, то никакой поиск его не спасет. А если сойдется — бот уже будет играть в плюс.
                      - heading "2. Что такое «сходимость» в твоем случае?" [level=3] [ref=e401]
                      - paragraph [ref=e402]: Для нейросети сходимость — это когда её предсказания стратегии перестают хаотично прыгать и начинают плавно уточняться.
                      - list [ref=e403]:
                        - listitem [ref=e404]:
                          - paragraph [ref=e405]: В Kuhn Poker ты видишь это через 5 минут.
                        - listitem [ref=e406]:
                          - paragraph [ref=e407]:
