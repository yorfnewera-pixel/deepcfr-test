                      - list [ref=e1303]:
                        - listitem [ref=e1304]:
                          - paragraph [ref=e1305]: "Увеличение Batch Size: Если видеопамять позволяет, попробуй увеличить батч (например, с 64 до 128 или 256), но при этом пропорционально увеличь Learning Rate. Это ускорит проход по данным."
                        - listitem [ref=e1306]:
