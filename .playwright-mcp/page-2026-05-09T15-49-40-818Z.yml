                      - 'heading "1. Оптимизация темпа: Learning Rate Scheduler" [level=2] [ref=e1287]'
                      - paragraph [ref=e1288]: Если твой Learning Rate (LR) статичен, ты либо долго «топчешься» на месте в начале, либо «пролетаешь» мимо узких минимумов в конце.
                      - list [ref=e1289]:
                        - listitem [ref=e1290]:
                          - paragraph [ref=e1291]: "Warmup (Разогрев): В первые 5–10% времени обучения начни с очень маленького LR и постепенно подними его до целевого. Это помогает нейросети стабилизироваться, когда буфер еще наполовину пуст."
                        - listitem [ref=e1292]:
                          - paragraph [ref=e1293]: "Cosine Annealing: Плавное снижение LR по кривой косинуса к концу обучения — это стандарт индустрии. Это позволяет сети на финальных стадиях обучения делать «ювелирные» правки в стратегии."
                      - 'heading "2. Сглаживание стратегии: SWA (Stochastic Weight Averaging)" [level=2] [ref=e1294]'
                      - paragraph [ref=e1295]: В покере GTO — это не точка, а скорее область. Нейросеть может слегка «дрожать» вокруг оптимума.
