                    - generic [ref=e495]:
                      - paragraph [ref=e496]: О, теперь всё встает на свои места! Твой агент прав — дисконтирование (Discounting) в современных вариациях CFR полностью меняет масштаб и поведение лосса. Если ты используешь не классический Deep CFR, а его модифицированные версии (например, с идеями из Linear CFR или Discounted CFR), то твои цифры выглядят гораздо здоровее.
                      - paragraph [ref=e497]: Давай разберем, почему твои текущие показатели — это не повод для паники, а признак того, что система «варит» стратегию правильно.
