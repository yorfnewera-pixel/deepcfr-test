                      - paragraph [ref=e527]: Твой алгоритм работает как «фильтр». Дисконтирование отсекает старый шум, поэтому нейросеть видит более «чистую» и актуальную картину того, что выгодно делать сейчас.
                      - list [ref=e528]:
                        - listitem [ref=e529]:
                          - paragraph [ref=e530]: Низкие значения лосса — это стабильность.
                        - listitem [ref=e531]:
                          - paragraph [ref=e532]: Высокие значения (140+) в классике часто приводили к тому, что сеть начинала «колебаться» (oscillation), и сходимость могла вообще не наступить.
