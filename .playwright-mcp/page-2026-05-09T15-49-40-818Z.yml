                        - listitem [ref=e505]:
                          - paragraph [ref=e506]: Это не дает значениям регрета (и, соответственно, таргетам для нейросети) раздуваться до гигантских масштабов.
                        - listitem [ref=e507]:
                          - paragraph [ref=e508]: Лосс в районе 1.15–1.35 с тенденцией к снижению — это отличный знак. Это значит, что нейросеть успешно «упаковывает» стратегию, и ей не нужно пытаться предсказать огромные, нестабильные числа.
