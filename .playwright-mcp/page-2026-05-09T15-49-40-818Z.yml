                          - paragraph [ref=e1181]: "Архитектура: Твоя сеть может быть глубже или шире, чем у авторов статей."
                        - listitem [ref=e1182]:
                          - paragraph [ref=e1183]: "Абстракции: Ты используешь изоморфизм мастей, что сильно сжимает пространство состояний. Значит, тебе может понадобиться меньше данных для обучения, чем тем, кто его не использует."
                        - listitem [ref=e1184]:
                          - paragraph [ref=e1185]: "PG Buffer: Сайзинг-голова (sizing head) вообще часто является кастомной надстройкой. Тут работает логика Policy Gradient: этот метод «on-policy» по своей природе, поэтому он требует свежих данных. Твоя логика про 10 000 — это не тык, это аргументированная инженерная догадка."
                      - heading "3. Как превратить «тык» в науку?" [level=3] [ref=e1186]
                      - paragraph [ref=e1187]: "Профессиональные команды (как в Meta) используют метод Ablation Studies (исследование абляцией):"
                      - list [ref=e1188]:
                        - listitem [ref=e1189]:
                          - paragraph [ref=e1190]: Берут базовый конфиг.
                        - listitem [ref=e1191]:
                          - paragraph [ref=e1192]: Меняют только один параметр (например, уменьшают PG-буфер в 10 раз).
                        - listitem [ref=e1193]:
                          - paragraph [ref=e1194]: Смотрят на график лосса и эксплойтности.
                        - listitem [ref=e1195]:
                          - paragraph [ref=e1196]: Если стало лучше — оставляют.
                      - heading "Твой текущий статус" [level=3] [ref=e1197]
                      - paragraph [ref=e1198]: Ты сейчас находишься на этапе «Инженерной интуиции».
                      - list [ref=e1199]:
                        - listitem [ref=e1200]:
                          - paragraph [ref=e1201]: Лосс падает? Да.
                        - listitem [ref=e1202]:
                          - paragraph [ref=e1203]: Цифры адекватные? Да.
                        - listitem [ref=e1204]:
                          - paragraph [ref=e1205]: Логика буфера свежая? Да.
                      - paragraph [ref=e1206]: Значит, ты уже не «тыкаешь» вслепую. Ты калибруешь систему под свои условия. В финальной версии обучения (те самые 360 часов) гиперпараметры должны быть «консервативными». Не пытайся выкрутить всё на максимум.
                      - blockquote [ref=e1207]:
                        - paragraph [ref=e1208]: "Совет: Если на 3000 итерациях всё стабильно, значит, твой текущий «набор ручек» работает. Главное — не менять их в середине 360-часового забега."
                      - separator [ref=e1209]
                      - paragraph [ref=e1210]: "Что в итоге: Прямого «рецепта» в интернете нет, потому что твой проект уникален. Но ты используешь верные ориентиры."
