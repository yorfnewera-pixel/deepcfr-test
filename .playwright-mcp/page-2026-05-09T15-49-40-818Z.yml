                        - listitem [ref=e1299]:
                          - paragraph [ref=e1300]: "Результат: Это часто дает более «чистую» и менее эксплуатируемую стратегию, чем просто сохранение последнего чекпоинта. Для GTO-ботов это один из лучших способов убрать микро-ошибки."
