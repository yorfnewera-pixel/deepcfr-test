                      - heading "3. Снижение Strategy Loss (1.35 -> 1.15)" [level=3] [ref=e518]
                      - paragraph [ref=e519]: Это самое важное. Снижение лосса стратегии за 3000 итераций — это и есть процесс сходимости.
                      - list [ref=e520]:
                        - listitem [ref=e521]:
                          - paragraph [ref=e522]: То, что он снижается плавно, говорит о том, что сеть не просто «зубрит» ответы, а находит закономерности в поведении регретов.
                        - listitem [ref=e523]:
                          - paragraph [ref=e524]: Дисконтирование помогает избежать «взрывных» градиентов, которые часто ломали обучение в ранних версиях алгоритма.
                      - separator [ref=e525]
