                  - heading [level=2] [ref=e1772]:
                    - generic [ref=e1773]: Ваш запрос
                    - paragraph [ref=e1774]: "#1 Вопрос по Stage-Specific Heads и Value Head в контексте ускорения сходимости."
                    - paragraph [ref=e1775]
                    - paragraph [ref=e1776]: Я — opencode, инженер-ассистент проекта. Разбираюсь в текущей архитектуре PokerNetwork и хочу обсудить твоё предложение про Stage-Specific Heads.
                    - paragraph [ref=e1777]
                    - paragraph [ref=e1778]: "Моя позиция:"
                    - paragraph [ref=e1779]
                    - paragraph [ref=e1780]: 1) Value Head — УЖЕ реализован. В PokerNetwork.__init__ уже есть self.value_head = nn.Linear(hidden_size, 1), и forward() его возвращает как часть output. Это не «предложение» — это свершившийся факт в текущем коде. Он работает как baseline для variance reduction, как ты и описывал в P9. Тут вопросов нет — это стандартная практика в Actor-Critic / VR-DeepCFR.
                    - paragraph [ref=e1781]
                    - paragraph [ref=e1782]: "2) Stage-Specific Heads — вот тут я скептичен. Ты предлагаешь разные головы для префлопа и постфлопа для борьбы с Catastrophic Interference. Но давай разберём:"
                    - paragraph [ref=e1783]
                    - paragraph [ref=e1784]: А) Catastrophic Interference — это реальная диагностированная проблема в нашем текущем обучении, или это теоретический риск «если после 6000 итераций увидите»? Мы ещё не запускали полный цикл после всех фиксов. Возможно, с исправленными C1, P8-2, P8-3 и корректным дисконтированием интерференция просто не возникнет.
                    - paragraph [ref=e1785]
                    - paragraph [ref=e1786]: "Б) Stage-Specific Heads — это не «лёгкая доработка». Это фундаментальное изменение архитектуры: нужно определять стадию (preflop/flop/turn/river), маршрутизировать через разные головы, обучать их раздельно или с разными loss-весами. Это добавляет:"
                    - paragraph [ref=e1787]: "- Новые гиперпараметры (сколько голов, как балансировать loss между ними)"
                    - paragraph [ref=e1788]: "- Риск переобучения на малых данных для late-street heads"
                    - paragraph [ref=e1789]: "- Сложность отладки — каждая голова будет учиться по-своему, и диагностировать проблему станет сложнее"
                    - paragraph [ref=e1790]: "- Параметрический overhead — даже при shared body, 3-4 дополнительных головы это +сотни тысяч параметров"
                    - paragraph [ref=e1791]
                    - paragraph [ref=e1792]: В) В классических реализациях Deep CFR (Brown et al., 2019) и даже в статье Xu et al. (2025 VR-DeepPDCFR+) — нет Stage-Specific Heads. Вместо этого сеть учится различать стадии через ENCODING входных фичей (у нас encode_state уже включает stage-информацию). Shared body + одна action_head — это стандарт.
                    - paragraph [ref=e1793]
                    - paragraph [ref=e1794]: "Г) Альтернатива: вместо Stage-Specific Heads можно усилить stage-encoding во входных фичах (one-hot для street), что позволяет shared сети выучить разные паттерны для разных стадий БЕЗ архитектурных изменений. Это проще, надежнее и не ломает текущую архитектуру."
                    - paragraph [ref=e1795]
                    - paragraph [ref=e1796]: "Вопрос к тебе: почему ты считаешь Stage-Specific Heads необходимыми ДО того как мы увидели реальную проблему с интерференцией? И чем это лучше чем усиление stage-encoding?"
