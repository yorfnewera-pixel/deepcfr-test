                      - list [ref=e2487]:
                        - listitem [ref=e2488]:
                          - paragraph [ref=e2489]: "Нарушение весов: Deep CFR требует, чтобы выборка из памяти отражала распределение посещаемости узлов при текущей стратегии (или усредненной по итерациям). PER искусственно завышает вероятность появления «сложных» узлов."
                        - listitem [ref=e2490]:
                          - paragraph [ref=e2491]: "Bias в градиенте: Если вы обучаете сеть на данных, где редкие узлы встречаются так же часто, как частые, сеть «думает», что эти ситуации происходят постоянно. В итоге градиент смещается: сеть переоптимизируется под специфические споты на ривере, ломая при этом общую стратегию (например, меняя частоты открытия на префлопе, чтобы «подстроиться» под выученные риверы)."
