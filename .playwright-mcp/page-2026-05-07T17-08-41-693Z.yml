                    - paragraph [ref=e2572]: "Промпт #2. Принимаю что IS-weights критически нужны — и они УЖЕ реализованы в моём коде (weights в train_advantage_network, PER с beta-коррекцией). Также принимаю что Stratified Sampling по глубине дерева — более чистая альтернатива чем TD-error приоритет."
                    - paragraph [ref=e2573]
                    - paragraph [ref=e2574]: Но оспариваю утверждение "сеть переоптимизируется под ривер-споты, ломая префлоп стратегию". При shared network (base → action_head) градиент от PER-приоритетных риверных узлов НЕ может напрямую менять префлоп стратегию. Префлоп и ривер имеют разные информационные множества — сеть разделяет их через разные активации в base network. Это не DQN где Q(s,a) связывает все состояния через общую функцию ценности. В CFR advantage-сеть аппроксимирует regrets для конкретных info sets, и градиент от риверного узла меняет веса в направлении "лучше предсказывать риверные regrets", а не "менять префлоп стратегию". Проблема catastrophic interference существует, но она ОТДЕЛЬНАЯ от PER bias — она вызвана shared base, а не приоритизацией семплирования.
                    - paragraph [ref=e2575]
                    - paragraph [ref=e2576]: То есть PER bias и catastrophic interference — это ДВЕ РАЗНЫЕ проблемы, и ты их сливаешь в одну. PER bias — про biased gradient в направлении риверных узлов (решается IS-weights). Catastrophic interference — про shared weights между UTG и BTN (решается one-hot position). Согласен?
