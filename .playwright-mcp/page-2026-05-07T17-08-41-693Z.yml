                              - paragraph [ref=e2705]: "Решение: IS-weights, которые вы уже внедрили. Они восстанавливают «честность» матожидания градиента, даже если мы смотрим на ривер в 100 раз чаще."
                        - listitem [ref=e2706]:
                          - paragraph [ref=e2707]: "Catastrophic Interference (Катастрофическая интерференция): Это архитектурная проблема. Это ситуация, когда обновление весов для минимизации ошибки на ривере (даже при наличии IS-weights) физически портит веса, отвечающие за префлоп, потому что они используют одни и те же нейроны в общих (shared) слоях."
                          - list [ref=e2708]:
                            - listitem [ref=e2709]:
                              - paragraph [ref=e2710]: "Решение: One-hot position, архитектурная избыточность (широкие слои) или Layer Normalization."
                      - 'heading "2. В чем подвох: Скрытая связь через общие слои (Base Network)" [level=3] [ref=e2711]'
                      - paragraph [ref=e2712]: "Ваш аргумент: \"Градиент от риверного узла меняет веса в направлении 'лучше предсказывать риверные regrets', а не 'менять префлоп стратегию'\"."
                      - paragraph [ref=e2713]: "В идеальном мире — да. Но в глубоком обучении есть эффект «вздутия» (feature representation shift):"
                      - list [ref=e2714]:
                        - listitem [ref=e2715]:
                          - paragraph [ref=e2716]: Чтобы лучше предсказывать сложные, высоко-регретные споты на ривере, общая часть сети (Base Network) вынуждена учить очень специфические, высокочастотные признаки (например, текстуру доски, специфику линий оппонента).
                        - listitem [ref=e2717]:
                          - paragraph [ref=e2718]: Эти признаки «захватывают» свободные параметры в Base Network.
                        - listitem [ref=e2719]:
                          - paragraph [ref=e2720]: Поскольку емкость сети конечна, функции, которые раньше эффективно кодировали «простой» префлоп (где достаточно знать только свои карты и позицию), могут начать дрейфовать, пытаясь помочь риверному «голове» (action head) предсказать его сложный таргет.
                      - paragraph [ref=e2721]: То есть PER усиливает катастрофическую интерференцию, потому что он заставляет общие слои сети «фокусироваться» на риверных признаках гораздо агрессивнее и дольше, чем при равномерном семплировании.
                      - heading "3. Почему One-hot Position не спасает от ривера" [level=3] [ref=e2722]
                      - paragraph [ref=e2723]: Вы упомянули, что One-hot position решает интерференцию между UTG и BTN. Это верно для позиционных различий. Но One-hot position не разделяет префлоп и ривер внутри одной позиции (например, для игрока на BTN).
                      - paragraph [ref=e2724]: Когда вы обучаете BTN на ривере с огромным приоритетом (PER), веса, общие для BTN-префлопа и BTN-ривера, все равно подвергаются давлению.
                      - heading "4. Итоговая оценка вашей позиции" [level=3] [ref=e2725]
                      - paragraph [ref=e2726]: "Ваша архитектура сейчас выглядит очень солидно, так как вы закрыли обе фронта:"
                      - list [ref=e2727]:
                        - listitem [ref=e2728]:
                          - paragraph [ref=e2729]: PER + IS-weights решают проблему редкости узлов без математического смещения.
                        - listitem [ref=e2730]:
                          - paragraph [ref=e2731]: Shared Network + Position One-hot решают проблему емкости для разных игроков.
                      - paragraph [ref=e2732]: "Мой финальный совет по этому пункту: Если вы заметите, что префлоп все-таки «плывет» (например, после 5000 итераций стратегия открытия становится хаотичной), значит, проблема не в PER bias (который вы подавили весами), а именно в Interference."
                      - paragraph [ref=e2733]: В этом случае вам поможет не изменение семплирования, а Multi-head архитектура не только для действий, но и для этапов игры (отдельный торс для префлопа, отдельный для постфлопа), либо простое увеличение ширины (hidden units) базовой сети, чтобы риверным признакам было где «разместиться», не вытесняя префлоп-фичи.
                      - paragraph [ref=e2734]: Согласен ли я? Да, вы абсолютно правы в разделении этих сущностей. PER — это инструмент управления вниманием градиента, а интерференция — это следствие совместного использования ресурсов сети. Вы их не «слили», вы их грамотно изолировали.
