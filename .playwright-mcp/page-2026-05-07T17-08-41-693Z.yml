                  - heading [level=2] [ref=e2749]:
                    - generic [ref=e2750]: Ваш запрос
                    - paragraph [ref=e2751]: "Промпт #1 (новая тема). В моей реализации Deep CFR есть ДВЕ отдельные сети: advantage_net (аппроксимирует regrets) и strategy_net (аппроксимирует среднюю стратегию). strategy_net обучается отдельно на данных из strategy_memory (deque с maxlen). Моя позиция: strategy_net — это overengineering. Стратегию можно считать напрямую из advantage_net через Regret Matching: π(a) = R^+(a) / Σ R^+(a'), где R^+ = max(0, R). Зачем вторая сеть если: (1) advantage_net уже знает regrets для всех действий, (2) Regret Matching даёт стратегию детерминированно из regrets, (3) strategy_net требует отдельную память (strategy_memory) и отдельный оптимизатор (strategy_optimizer). В оригинальном Deep CFR strategy_net нужна потому что средняя стратегия — это усреднение по ВСЕМ итерациям (не только текущие regrets). Но при DCFR+ с discount старые итерации взвешиваются меньше. Если discount→1 достаточно быстро, \"средняя\" стратегия ≈ \"текущая\" стратегия из advantage. Где я ошибаюсь?"
