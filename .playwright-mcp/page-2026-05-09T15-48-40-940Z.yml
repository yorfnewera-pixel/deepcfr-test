                      - paragraph [ref=e1742]: Ответ от Sonnet технически грамотен и нацелен на сохранение информационной плотности обучения. В условиях ограниченных ресурсов (одна GPU) и многопользовательской игры (6-max) — это наиболее рациональный компромисс.
                      - paragraph [ref=e1743]: Вот глубокий разбор того, почему эта схема «взлетит», и один нюанс, который нужно держать в уме.
                      - heading "Почему это решение — «золотая середина»" [level=3] [ref=e1744]
                      - list [ref=e1745]:
                        - listitem [ref=e1746]:
                          - paragraph [ref=e1747]: "Решение проблемы «забывания» (Catastrophic Forgetting): Если бы мы очищали все буферы каждую итерацию, нейросеть обучалась бы только на одной позиции за раз. В покере это фатально: веса сети «перетягивались» бы под специфику конкретной позиции (например, только игра на BB), разрушая стратегию на других. Сохранение 5 из 6 буферов дает сети контекст всей таблицы."
                        - listitem [ref=e1748]:
                          - paragraph [ref=e1749]:
                            - text: "Bootstrapping и стабильность: Заморозка"
                            - code [ref=e1750]: prev_net
                            - text: раз в цикл (6 итераций) гарантирует, что целевые значения (targets), к которым стремится сеть, не меняются хаотично каждые 5 минут. Это критично для сходимости.
