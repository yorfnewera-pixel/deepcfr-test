                  - heading [level=2] [ref=e1214]:
                    - generic [ref=e1215]: Ваш запрос
                    - paragraph [ref=e1216]: Вопросы от агента
                    - paragraph [ref=e1217]
                    - paragraph [ref=e1218]: 4 ключевых решения перед реализацией
                    - paragraph [ref=e1219]: "1. P3: Softmax-policy или Regret Matching?"
                    - paragraph [ref=e1220]: "Проблема: Текущий max(0, adv)/sum при all-negative advantages даёт argmax fallback → fold-lock. В 6-max NLH большинство действий -EV."
                    - paragraph [ref=e1221]: "Варианты:"
                    - paragraph [ref=e1222]: A) Softmax(adv/τ) — всегда валидное распределение. fold=-0.35 и raise=-1.47 различимы. τ-decay 5.0→0.5 за 3000 итераций. Теряет теоретическую гарантию Нэша, но Neural CFR/PSRO/SAC/PPO все используют softmax. Убирает 5 костылей (ε-greedy, argmax fallback, head reset, PG clamp, uniform fallback).
                    - paragraph [ref=e1223]: B) Uniform 1/N fallback — как в reference repo. При all-negative → 1/N. Сохраняет CFR-семантику, но fold и raise одинаково вероятны (информация теряется).
                    - paragraph [ref=e1224]: C) Гибрид — Regret Matching когда sum(max(0,adv))>0, иначе softmax. Лучшее из обоих миров, но сложнее.
                    - paragraph [ref=e1225]: "Моя рекомендация: A (Softmax). В нейросетевой аппроксимации теоретическая гарантия Нэша и так не выполняется (advantage_net неточен), а практическая стабильность критичнее."
                    - paragraph [ref=e1226]
                    - paragraph [ref=e1227]: "2. P8: DCFR+ Discounting + Bootstrapping из статьи?"
                    - paragraph [ref=e1228]: "Проблема: Vanilla CFR одинаково взвешивает итерации 1 и 5000. Ранние ошибки (когда бот ещё глупый) навсегда в advantage_memory."
                    - paragraph [ref=e1229]: "Варианты:"
                    - paragraph [ref=e1230]: A) DCFR+ bootstrapping — frozen prev_advantage_net на начало итерации, target = max(R_prev * discount, 0) + r_current, discount = (t-1)^2/((t-1)^2+1). Очистка advantage_memories каждую итерацию (как в статье). 80% выгоды PDCFR+ без extra instantaneous net.
                    - paragraph [ref=e1231]: B) Linear CFR — просто weight=t для семплов. Проще, но слабее забывание.
                    - paragraph [ref=e1232]: C) Оставить vanilla — накапливать все regret-семплы. Проще всего, но ранние ошибки persist.
                    - paragraph [ref=e1233]: "Моя рекомендация: A (DCFR+). Статья показывает значительное ускорение сходимости. На RTX 4060 одна frozen копия — не проблема."
                    - paragraph [ref=e1234]
                    - paragraph [ref=e1235]: "3. P9: Value Network как PG baseline?"
                    - paragraph [ref=e1236]: "Проблема: Текущий running_mean — константа, не зависит от состояния. Для AA и 72o одинаковый baseline."
                    - paragraph [ref=e1237]: "Варианты:"
                    - paragraph [ref=e1238]: A) Value Net в PokerNetwork — добавить value_head = nn.Linear(hidden, 1). advantage = regret_raise - V(state).detach(). Обучать MSE. Стандарт actor-critic, низкий overhead (1 линейный слой).
                    - paragraph [ref=e1239]: B) Отдельная Value Net — свой backbone. Безопаснее (нет shared gradient), но ~3x больше параметров.
                    - paragraph [ref=e1240]: C) Оставить running_mean — простота. P4 (log1p для PG reward) уже частично решает проблему масштаба.
                    - paragraph [ref=e1241]: "Моя рекомендация: A (shared value_head). Для PG sizing_head baseline нужен именно state-dependent, а не global mean. 1 линейный слой — минимален риск."
                    - paragraph [ref=e1242]
                    - paragraph [ref=e1243]: "4. P4: log1p для PG reward?"
                    - paragraph [ref=e1244]: "Проблема: Сырой regret_raise = action_values[2] - ev может быть ±200. Попадает в pg_memory как есть."
                    - paragraph [ref=e1245]: "Варианты:"
                    - paragraph [ref=e1246]: "*A) sign(x)log1p(|x|) при записи в pg_memory. Согласовано с P2 (HuberLoss delta=5.0) и P1 (log1p для advantage). Диапазон сжимается до ±5.3."
                    - paragraph [ref=e1247]: B) Оставить сырые значения — если P9 (Value Net) добавляем, то V(state) может сам выучить масштаб. Двойное log1p может пере-сжать.
                    - paragraph [ref=e1248]: C) Только clamp [-5,5] — без логарифмирования, но с ограничением диапазона.
                    - paragraph [ref=e1249]: "Моя рекомендация: A (log1p). Value Net учит разность, а не абсолютные значения — двойное сжатие не проблема. log1p на входе Value Net улучшает обучение."
                    - paragraph [ref=e1250]
                    - paragraph [ref=e1251]: "Жду твои ответы (например: \"1A, 2A, 3A, 4A\" или подробно если хочешь обсудить)."
