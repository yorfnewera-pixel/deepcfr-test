                    - paragraph [ref=e1754]: "#17 Suit Isomorphism: overhead 2x на traversal — как оптимизировать?"
                    - paragraph [ref=e1755]
                    - paragraph [ref=e1756]: "Контекст: Deep CFR poker AI на CPU. Внедрили Suit Isomorphism (First Appearance маппинг) — функция _build_suit_canonical_map(hand_cards, public_cards) вызывается внутри encode_state() на КАЖДОМ узле DFS traversal."
                    - paragraph [ref=e1757]
                    - paragraph [ref=e1758]: "Результат: traversal замедлился 2x (7ms/узел → 15ms/узел). Причина: _build_suit_canonical_map — чистый Python (dict creation, итерация по картам, lookup) на каждом узле дерева. DFS обход ~400-1000 traversals × ~10-30 узлов каждый = тысячи вызовов."
                    - paragraph [ref=e1759]
                    - paragraph [ref=e1760]: "Почему вызывается на каждом узле: encode_state(state, player_id) вызывается для каждого состояния в DFS. Для traversing player — 2 раза (forward + memory). Для opponent — 1 раз (strategy forward). Внутри encode_state мы строим suit_map каждый раз заново."
                    - paragraph [ref=e1761]
                    - paragraph [ref=e1762]: "Ключевое наблюдение: suit_map зависит только от (hand_cards, public_cards) игрока. В DFS один и тот же игрок видит одни и те же карты на протяжении всей руки (карты не меняются). Но encode_state вызывается для разных улиц (preflop, flop, turn, river) — public_cards меняются!"
                    - paragraph [ref=e1763]
                    - paragraph [ref=e1764]: "Мои варианты оптимизации:"
                    - paragraph [ref=e1765]
                    - paragraph [ref=e1766]: A) Кэшировать suit_map по (player_id, hand_cards_id) — но hand_cards неизменны, а public_cards растут. First Appearance означает что маппинг НЕ меняется при добавлении новых public_cards (новые масти просто получают следующий canonical index). Можно кэшировать partial map и расширять.
                    - paragraph [ref=e1767]
                    - paragraph [ref=e1768]: B) Предвычислить suit_map один раз в начале traversal для traversing player (когда hand известны) и передавать в encode_state как аргумент. Для opponent — вычислять при первом обращении и кэшировать.
                    - paragraph [ref=e1769]
                    - paragraph [ref=e1770]: C) Переписать _build_suit_canonical_map на C/Cython — убрать Python overhead.
                    - paragraph [ref=e1771]
                    - paragraph [ref=e1772]: D) Убрать dict и использовать простой array[int] — suit_map[4] вместо dict lookup. Maстей всего 4, можно использовать list из 4 элементов.
                    - paragraph [ref=e1773]
                    - paragraph [ref=e1774]: E) Inline suit_map в encode_state — без вызова функции, прямая логика внутри.
                    - paragraph [ref=e1775]
                    - paragraph [ref=e1776]: "Моя позиция: D — самый простой и эффективный. dict overhead (hash, lookup, creation) на 4 элемента — это overkill. list[4] с -1 как \"не назначена\" даст тот же результат без dict creation на каждый вызов. B тоже хорошее долгосрочное решение но требует переписывания сигнатуры encode_state."
                    - paragraph [ref=e1777]
                    - paragraph [ref=e1778]: "Вопросы:"
                    - paragraph [ref=e1779]: 1. Какой вариант даст наибольший буст с минимальным риском?
                    - paragraph [ref=e1780]: 2. Стоит ли комбинировать D + B?
                    - paragraph [ref=e1781]: 3. Есть ли другие подходы которые я упускаю?
