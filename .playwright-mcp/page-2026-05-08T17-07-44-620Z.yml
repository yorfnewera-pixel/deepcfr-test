                    - heading "Ответ Gemini" [level=2] [ref=e273]
                    - generic [ref=e277]:
                      - paragraph [ref=e278]: "Это отличный вопрос, который бьет прямо в центр архитектуры Deep PDCFR+. Ты стоишь перед выбором: использовать Predictive часть (предсказание будущих регретов) или ограничиться только Discounting (взвешиванием прошлых данных)."
                      - paragraph [ref=e279]: "Короткий ответ: Для 6-max No-Limit Hold'em на RTX 4060 — дискаунтинг (PDCFR) гораздо важнее, чем предиктив (DeepCFR)."
                      - paragraph [ref=e280]: Давай разберем, почему «пропустить» предсказание может быть не просто проще, а даже эффективнее.
                      - separator [ref=e281]
                      - heading "1. В чем разница?" [level=3] [ref=e282]
                      - list [ref=e283]:
                        - listitem [ref=e284]:
                          - paragraph [ref=e285]: "Predictive (DeepCFR): Пытается предсказать, какие регреты будут в будущем, используя текущую нейросеть. Это добавляет «стабильности», но требует bootstrapping (постоянных двойных прогонов через сеть)."
                        - listitem [ref=e286]:
                          - paragraph [ref=e287]: "Discounting (PDCFR): Просто говорит: «Старые ошибки (регреты) менее важны, чем новые». Мы умножаем накопленные регреты на коэффициент (дискаунтер) на каждой итерации."
                      - heading "2. Почему в твоем случае дискаунтер — это S-tier решение?" [level=3] [ref=e288]
                      - heading "А. Вычислительная нагрузка (Твои спайки)" [level=4] [ref=e289]
                      - paragraph [ref=e290]:
                        - text: Предсказание (Predictive) требует, чтобы при обучении новой
                        - code [ref=e291]: advantage_net
                        - text: ты постоянно обращался к
                        - code [ref=e292]: prev_advantage_net
                        - text: (для вычисления таргета).
                      - list [ref=e293]:
                        - listitem [ref=e294]:
                          - paragraph [ref=e295]: Это удваивает количество GPU-вычислений во время фазы обучения.
                        - listitem [ref=e296]:
                          - paragraph [ref=e297]: Это создает лишние зависимости в памяти, которые в Windows могут провоцировать те самые спайки, с которыми мы боролись.
                      - heading "Б. Сходимость в покере" [level=4] [ref=e298]
                      - paragraph [ref=e299]: Исследования (например, оригинальная статья по PDCFR) показывают, что дискаунтирование регретов — это самый мощный фактор ускорения сходимости к Нэшу.
                      - list [ref=e300]:
                        - listitem [ref=e301]:
                          - paragraph [ref=e302]:
                            - text: Линейный дискаунтинг (
                            - generic [ref=e306]: LCFR
                            - text: ) или полиномиальный (
                            - generic [ref=e310]: PDCFR
                            - text: ) заставляют агента быстрее «забывать» глупые ошибки префлопа первой итерации.
                        - listitem [ref=e311]:
                          - paragraph [ref=e312]: Предсказание (Predictive) часто дает лишь незначительный прирост точности ценой огромных ресурсов.
                      - heading "В. Проблема \"шума\"" [level=4] [ref=e313]
                      - paragraph [ref=e314]: Если твоя нейросеть еще не обучена (ранние итерации), её «предсказания» — это просто шум. Если ты используешь плохие предсказания для обучения, ты можешь увести агента в сторону от равновесия (divergence). Дискаунтер же математически надежен — он просто снижает вес старых данных.
                      - separator [ref=e315]
