                        - listitem [ref=e1359]:
                          - paragraph [ref=e1360]: "Локальность кэша: Буфер на 10k элементов (156 float на каждый) занимает всего около 6 MB. Это полностью влезает в L3-кэш большинства современных процессоров. Обработка данных, которые не покидают пределы процессора, в десятки раз быстрее, чем постоянное чтение из основной оперативной памяти."
