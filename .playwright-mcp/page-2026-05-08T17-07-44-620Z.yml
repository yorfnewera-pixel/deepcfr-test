                        - listitem [ref=e1352]:
                          - paragraph [ref=e1353]: "Эффективность: В Deep CFR профитнее сделать 100 коротких итераций (сбор данных + быстрое обучение), чем 10 длинных. Маленький буфер позволяет держать этот темп."
