                      - paragraph [ref=e457]: "Вот почему 2.5.1 — это «золотая середина» для твоего стека:"
                      - heading "1. Стабильность CUDA 12.4 / 12.1" [level=3] [ref=e458]
                      - paragraph [ref=e459]: PyTorch 2.5.1 отлично протестирован с версиями CUDA, которые лучше всего работают на RTX 4060. Самые новые версии Torch часто выходят с поддержкой CUDA 12.6/12.8, что иногда требует обновления драйверов до экспериментальных версий, что в Windows может добавить еще больше проблем с WDDM, о которых мы говорили.
