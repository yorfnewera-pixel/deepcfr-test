                      - paragraph [ref=e902]: То есть, с позиции кода — обход для тебя полный. Но с позиции математики — полученные значения твоих действий (Фолд, Колл, Рейз) являются случайной оценкой (Монте-Карло эстиматором), а не истинным значением, как в чистом CFR.
