                      - heading "Почему это гениально работает?" [level=3] [ref=e920]
                      - paragraph [ref=e921]: Именно поэтому метод и называется External Sampling (Внешнее сэмплирование).
                      - list [ref=e922]:
                        - listitem [ref=e923]:
                          - paragraph [ref=e924]: Слово External (Внешнее) означает, что всё, что находится снаружи твоего игрока (карты дилера и действия других игроков), превращается в случайную среду (сэмплируется).
                        - listitem [ref=e925]:
                          - paragraph [ref=e926]: А внутри этой случайной среды твой игрок устраивает «чистый CFR» — тотальный перебор своих альтернатив.
                      - paragraph [ref=e927]: За счет того, что ты прогонишь тысячи таких итераций, твой игрок на BB посидит и против рейза UTG, и против его лимпа, и против его фолда. В среднем по больнице эти случайные «кусочки» сложатся в идеальную, математически точную стратегию.
