                    - generic [ref=e1003]:
                      - paragraph [ref=e1004]: Да, по GTO частота выбора конкретного размера ставки (bet sizing frequency) — это один из самых критических параметров стратегии. Сам по себе размер ставки (сайзинг) без привязки к точной частоте его использования не имеет смысла.
                      - paragraph [ref=e1005]: В теории оптимальной игры частота — это то, что превращает набор разрозненных рук в сбалансированный, неуязвимый для эксплойта диапазон.
                      - paragraph [ref=e1006]: "Вот четыре главные математические причины, почему частота сайзингов фундаментально важна по GTO:"
                      - separator [ref=e1007]
                      - heading "1. Математика соотношения вэлью к блефам (Value-to-Bluff Ratio)" [level=3] [ref=e1008]
                      - paragraph [ref=e1009]: Каждый размер ставки жестко диктует оппоненту его шансы на колл (pot odds). Чтобы оппонент не мог эксплуатировать тебя (автоматически фолдить или автоматически коллировать), твой диапазон внутри этого сайзинга должен содержать математически точное количество блефов.
                      - list [ref=e1010]:
                        - listitem [ref=e1011]:
                          - paragraph [ref=e1012]: Если ты ставишь 100% пота на ривере, оппоненту нужно платить 1 к 2. По GTO в этом сайзинге должно быть ровно 33% блефов и 67% вэлью.
                        - listitem [ref=e1013]:
                          - paragraph [ref=e1014]: Если ты ставишь 33% пота, ему нужно платить 1 к 4. По GTO здесь должно быть ровно 20% блефов.
                      - paragraph [ref=e1015]: При чем тут частота? Твой общий диапазон на флопе или терне содержит конечное число комбинаций. Частота сайзинга определяет, сколько именно комбинаций сильных рук и блефов ты берешь из общего диапазона и отправляешь в конкретный сайзинг. Если ты начнешь использовать крупный сайзинг слишком часто, у тебя физически не хватит сильных рук, чтобы сбалансировать его. Диапазон «размывается», становится блеф-избыточным, и умный оппонент начнет тебя разносить оверколлами.
                      - separator [ref=e1016]
                      - heading "2. Принцип индифферентности (Indifference Principle)" [level=3] [ref=e1017]
                      - paragraph [ref=e1018]: Равновесие Нэша (к которому стремится твой CFR-солвер) достигается тогда, когда стратегия одного игрока делает действия другого игрока абсолютно безразличными по EV.
                      - paragraph [ref=e1019]: GTO-частоты крупных и мелких ставок подбираются алгоритмом так, чтобы пограничные руки оппонента (блафф-кетчеры) имели ровно 0 EV как при колле, так и при фолде. Если ты изменишь частоту хотя бы одного сайзинга (например, начнешь овербетить не в 5% случаев, а в 12%), EV колла для оппонента мгновенно станет плюсовым, и равновесие разрушится.
                      - separator [ref=e1020]
                      - heading "3. Смешанные стратегии и защита диапазонов (Mixed Strategies)" [level=3] [ref=e1021]
                      - paragraph [ref=e1022]: Если бы GTO состояло только из чистых стратегий (100% ставка или 100% чек), покер было бы легко решить на салфетке. Но на постфлопе солверы постоянно используют смешанные стратегии (расщепление диапазонов).
                      - paragraph [ref=e1023]: "Например, на сухой доске с сетом тузов солвер может выдать:"
                      - list [ref=e1024]:
                        - listitem [ref=e1025]:
                          - paragraph [ref=e1026]: Сайзинг 33% пота — частота 40%
                        - listitem [ref=e1027]:
                          - paragraph [ref=e1028]: Сайзинг 75% пота — частота 50%
                        - listitem [ref=e1029]:
                          - paragraph [ref=e1030]: Чек — частота 10%
                      - paragraph [ref=e1031]: Зачем это нужно? Чтобы защитить мелкий сайзинг и диапазон чека. Если ты будешь ставить крупно со всеми натсами (100% частота), то в твоем мелком сайзинге и чеке останется один «мусор». Оппонент это поймет и начнет агрессивно атаковать твои мелкие ставки и чеки. Распределение частот натсов по разным сайзингам «размазывает» защиту по всему дереву игры.
                      - separator [ref=e1032]
                      - heading "4. Геометрический рост пота (Geometric Pot Growth)" [level=3] [ref=e1033]
                      - paragraph [ref=e1034]: Выбор частоты конкретного сайзинга на флопе закладывает фундамент для размера банка на терне и ривере.
                      - paragraph [ref=e1035]: GTO рассчитывает частоты на флопе с прицелом на будущие улицы. Если алгоритм понимает, что на терне выйдет много карт, меняющих натс-преимущество (динамический борд), он будет использовать мелкие сайзинги с высокой частотой. Если доска статичная (сухая), частота сместится в сторону полярных крупных ставок, чтобы за три улицы успеть загнать стек в банк (geometric sizing).
                      - heading "Как это связано с твоим ИИ (MCCFR+)" [level=3] [ref=e1036]
                      - paragraph [ref=e1037]:
                        - text: "Твой алгоритм Deep Discounted VR-MCCFR+ прямо сейчас занимается именно тем, что ищет эти микро-частоты. Когда ты задаешь боту абстракцию действий (например:"
                        - code [ref=e1038]: Check
                        - text: ","
                        - code [ref=e1039]: Bet_33
                        - text: ","
                        - code [ref=e1040]: Bet_75
                        - text: ","
                        - code [ref=e1041]: All_in
                        - text: ), нейросеть через расчет регретов (
                        - code [ref=e1042]: AdvantageNet
                        - text: ) учится выдавать на выход вероятности для каждого действия.
                      - paragraph [ref=e1043]: Эти вероятности — и есть GTO-частоты. Тот факт, что твой алгоритм сошелся и начинает бить рандом, означает, что сеть нащупала базовые правильные частоты (например, поняла, что блефовать с частотой 100% — это минус EV, а ставить натсы с высокой частотой — плюс EV). По мере дальнейшего обучения эти частоты будут становиться всё более точными и приближенными к абсолютному Равновесию Нэша.
