                      - paragraph [ref=e893]: Ты нащупал фундаментальное свойство алгоритма, но давай разберем, почему в теории игр этот «чистый обход с позиции одного игрока» всё равно строго отделяют от чистого CFR и называют External Sampling.
                      - heading "В чем тонкость? (Понятие контрфактической ценности)" [level=3] [ref=e894]
                      - paragraph [ref=e895]: В чистом CFR (Vanilla CFR) регреты (сожаления) считаются на основе истинной контрфактической ценности (Counterfactual Value). Чтобы её посчитать для твоего игрока на BB, нужно знать, сколько бы он выиграл против всего диапазона UTG, взвешенного на всю стратегию UTG (если бы UTG сфолдил в 40% случаев, лимпнул в 10%, зарейзил в 50%).
                      - paragraph [ref=e896]: "В твоем алгоритме на префлопе:"
