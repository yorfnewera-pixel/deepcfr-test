                      - 'heading "А теперь холодный душ: когда этот алгоритм НЕ сойдется?" [level=3] [ref=e329]'
                      - paragraph [ref=e330]: "Ты можешь скормить ему любой бред, но этот бред должен соответствовать строгим математическим критериям. Твой крутой стек сломается, если нарушить следующие правила:"
                      - heading "1. Игра должна быть в «Экстенсивной форме» (Extensive-Form Game)" [level=4] [ref=e331]
                      - paragraph [ref=e332]: "В игре должны быть четкие, дискретные шаги: ход игрока А, ход игрока Б, случайное событие (Chance node). Если ты попытаешься засунуть туда непрерывную среду реального времени (например, симулятор вождения автомобиля или Counter-Strike, где действия происходят одновременно каждую миллисекунду), классический CFR захлебнется. Дерево игры станет бесконечным."
                      - heading "2. Математическая структура вознаграждений (Zero-Sum vs General-Sum)" [level=4] [ref=e333]
                      - paragraph [ref=e334]: Твой алгоритм идеально «сходится» (минимизирует эксплойтность), потому что покер в своей основе — это игра с нулевой суммой (что один выиграл, то другие проиграли в сумме).
                      - list [ref=e335]:
                        - listitem [ref=e336]:
                          - paragraph [ref=e337]: Если ты подсунешь ему «бред», где игроки могут кооперироваться, создавать союзы или где выигрыш зависит от экологии (General-Sum Game), то мультиплеерный CFR может застрять в бесконечном цикле или сойтись к ужасной стратегии, где все друг друга уничтожают. В мультиплеере (как в твоем 6-max) CFR и так гарантирует сходимость только к Coarse Correlated Equilibrium, а не к чистому Нэшу.
                      - heading "3. Ограничение приставки \"Deep\" (Гладкие закономерности)" [level=4] [ref=e338]
                      - paragraph [ref=e339]: Поскольку у тебя Deep CFR (с нейросетями), ты критически зависишь от способности нейронки находить паттерны (закономерности) в данных.
