                    - generic [ref=e846]:
                      - paragraph [ref=e847]: "Это отличный вопрос, который бьет прямо в центр архитектуры Deep PDCFR+. Ты стоишь перед выбором: использовать Predictive часть (предсказание будущих регретов) или ограничиться только Discounting (взвешиванием прошлых данных)."
                      - paragraph [ref=e848]: "Короткий ответ: Для 6-max No-Limit Hold'em на RTX 4060 — дискаунтинг (PDCFR) гораздо важнее, чем предиктив (DeepCFR)."
                      - paragraph [ref=e849]: Давай разберем, почему «пропустить» предсказание может быть не просто проще, а даже эффективнее.
                      - separator [ref=e850]
                      - heading "1. В чем разница?" [level=3] [ref=e851]
                      - list [ref=e852]:
                        - listitem [ref=e853]:
                          - paragraph [ref=e854]: "Predictive (DeepCFR): Пытается предсказать, какие регреты будут в будущем, используя текущую нейросеть. Это добавляет «стабильности», но требует bootstrapping (постоянных двойных прогонов через сеть)."
                        - listitem [ref=e855]:
                          - paragraph [ref=e856]: "Discounting (PDCFR): Просто говорит: «Старые ошибки (регреты) менее важны, чем новые». Мы умножаем накопленные регреты на коэффициент (дискаунтер) на каждой итерации."
                      - heading "2. Почему в твоем случае дискаунтер — это S-tier решение?" [level=3] [ref=e857]
                      - heading "А. Вычислительная нагрузка (Твои спайки)" [level=4] [ref=e858]
                      - paragraph [ref=e859]:
                        - text: Предсказание (Predictive) требует, чтобы при обучении новой
                        - code [ref=e860]: advantage_net
                        - text: ты постоянно обращался к
                        - code [ref=e861]: prev_advantage_net
                        - text: (для вычисления таргета).
                      - list [ref=e862]:
                        - listitem [ref=e863]:
                          - paragraph [ref=e864]: Это удваивает количество GPU-вычислений во время фазы обучения.
                        - listitem [ref=e865]:
                          - paragraph [ref=e866]: Это создает лишние зависимости в памяти, которые в Windows могут провоцировать те самые спайки, с которыми мы боролись.
                      - heading "Б. Сходимость в покере" [level=4] [ref=e867]
                      - paragraph [ref=e868]: Исследования (например, оригинальная статья по PDCFR) показывают, что дискаунтирование регретов — это самый мощный фактор ускорения сходимости к Нэшу.
                      - list [ref=e869]:
                        - listitem [ref=e870]:
                          - paragraph [ref=e871]:
                            - text: Линейный дискаунтинг (
                            - generic [ref=e875]: LCFR
                            - text: ) или полиномиальный (
                            - generic [ref=e879]: PDCFR
                            - text: ) заставляют агента быстрее «забывать» глупые ошибки префлопа первой итерации.
                        - listitem [ref=e880]:
                          - paragraph [ref=e881]: Предсказание (Predictive) часто дает лишь незначительный прирост точности ценой огромных ресурсов.
                      - heading "В. Проблема \"шума\"" [level=4] [ref=e882]
                      - paragraph [ref=e883]: Если твоя нейросеть еще не обучена (ранние итерации), её «предсказания» — это просто шум. Если ты используешь плохие предсказания для обучения, ты можешь увести агента в сторону от равновесия (divergence). Дискаунтер же математически надежен — он просто снижает вес старых данных.
