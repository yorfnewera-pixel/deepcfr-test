                        - listitem [ref=e1804]:
                          - paragraph [ref=e1805]: В версиях 2.6+ этот overhead иногда выше, чем в «классической» 2.5.1. На больших моделях это незаметно, но на твоем MLP, где сам расчет идет 0.5ms, лишние 0.1ms на диспетчеризацию — это 20% потери скорости.
