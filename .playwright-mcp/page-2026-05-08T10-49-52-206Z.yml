                            - code [ref=e351]: np.frombuffer
                            - text: и запишите в новые массивы один раз. После первой же итерации сохраните новый формат. Не тащите старый код в основной цикл.
                      - heading "3. Ring Buffer и логика CFR" [level=3] [ref=e352]
                      - paragraph [ref=e353]: В CFR (особенно Deep CFR) затирание старых данных через Ring Buffer — это не просто «ок», это необходимо.
                      - list [ref=e354]:
                        - listitem [ref=e355]:
                          - paragraph [ref=e356]: "Почему: CFR — это итеративный процесс. Данные с итерации №1 (где вы играли почти рандомно) через 5000 итераций становятся «шумом». Они тянут стратегию к неверным регретам."
                        - listitem [ref=e357]:
                          - paragraph [ref=e358]: "Практика: Ограничение памяти (например, последние 100k-500k записей) работает как естественное «забывание» плохих стратегий. Это помогает сходимости."
