                      - heading "1. Реальные CPU-оптимизации (2.5.1 vs Новее)" [level=3] [ref=e1790]
                      - paragraph [ref=e1791]: "Для твоего стека (Linear + ReLU) в новых версиях произошли два важных изменения:"
                      - list [ref=e1792]:
