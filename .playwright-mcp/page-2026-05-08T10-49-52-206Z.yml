                            - code [ref=e344]: action
                            - text: . Если
                            - code [ref=e345]: opp_feats
                            - text: — это метаданные (например, статы оппонента для вашей аналитики), пишите их в отдельный лог-файл раз в 1000 итераций, но не держите в "горячем" буфере обучения. Это освободит еще ~5-10% VRAM-CPU трафика.
                      - heading "2. Обратная совместимость (Checkpoint Load)" [level=3] [ref=e346]
                      - paragraph [ref=e347]: Это «подводный камень», который может сломать вам всё при загрузке старых моделей.
                      - list [ref=e348]:
                        - listitem [ref=e349]:
