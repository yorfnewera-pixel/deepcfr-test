                    - generic [ref=e750]:
                      - paragraph [ref=e751]: В этом и кроется фундаментальное различие между философией Windows и Linux в управлении ресурсами.
                      - paragraph [ref=e752]: "Короткий ответ: Нет, Linux не станет «душить» твои вычисления ради плавности браузера."
                      - paragraph [ref=e753]: "Вот как это работает на техническом уровне:"
                      - heading "1. Отсутствие «священной коровы» в виде GUI" [level=3] [ref=e754]
                      - paragraph [ref=e755]: В Windows графический интерфейс (Desktop Window Manager) — это часть ядра. Если GPU занят вычислениями и окно браузера «лагает», Windows считает это критической ошибкой и пытается отобрать ресурсы у вычислений (через механизм TDR или Preemption).
                      - paragraph [ref=e756]: В Linux графическая оболочка (X11 или Wayland) — это просто обычный процесс.
                      - list [ref=e757]:
                        - listitem [ref=e758]:
                          - paragraph [ref=e759]: Если ты запустишь тяжелый расчет на GPU, у тебя может начать тормозить интерфейс, дергаться курсор или лагать видео в браузере, но система не прервет вычисления.
                        - listitem [ref=e760]:
                          - paragraph [ref=e761]: Для Linux приоритетней то, что запустил пользователь (твой скрипт), а не то, чтобы анимация сворачивания окна была плавной.
                      - heading "2. Режим Headless (Серверный подход)" [level=3] [ref=e762]
                      - paragraph [ref=e763]: На Linux ты можешь вообще не запускать графическую оболочку. Ты загружаешься в консоль (TTY).
                      - list [ref=e764]:
                        - listitem [ref=e765]:
                          - paragraph [ref=e766]: В этом случае 100% ресурсов видеокарты и видеопамяти принадлежат твоему коду.
                        - listitem [ref=e767]:
                          - paragraph [ref=e768]: Нет никакого «браузера», «поиска Windows» или «обновлений», которые могли бы вклиниться в твой forward pass.
                      - heading "3. Планировщик задач (Nice & Ionice)" [level=3] [ref=e769]
                      - paragraph [ref=e770]: "В Linux есть очень мощные инструменты управления приоритетами:"
                      - list [ref=e771]:
                        - listitem [ref=e772]:
                          - paragraph [ref=e773]: "Ты можешь запустить свой скрипт с приоритетом, который скажет ядру: «Игнорируй всё остальное, отдай все циклы CPU/GPU этой задаче»."
                        - listitem [ref=e774]:
                          - paragraph [ref=e775]: В Windows даже режим «Realtime» не дает такой гарантии, так как системные прерывания всё равно имеют высший приоритет.
                      - heading "4. Прямой доступ к драйверу (Direct Rendering Infrastructure)" [level=3] [ref=e776]
                      - paragraph [ref=e777]:
                        - text: На Linux драйвер NVIDIA работает более «прозрачно». Когда PyTorch вызывает синхронизацию
                        - code [ref=e778]: .cpu()
                        - text: ", он не проходит через семь кругов ада планировщика WDDM, который проверяет, не нужно ли сейчас отрисовать уведомление от мессенджера."
                      - separator [ref=e779]
                      - heading "Простая аналогия:" [level=3] [ref=e780]
                      - list [ref=e781]:
                        - listitem [ref=e782]:
                          - paragraph [ref=e783]: Windows — это заботливая няня. Она постоянно присматривает за тем, чтобы тебе было «комфортно» пользоваться компьютером. Если она видит, что твой код мешает тебе смотреть YouTube, она бьет твой код по рукам.
                        - listitem [ref=e784]:
                          - paragraph [ref=e785]: Linux — это суровый профессиональный рабочий стол. Если ты сказал «жги на все деньги», он будет жечь, даже если от этого весь интерфейс застынет в одну картинку.
                      - paragraph [ref=e786]: "Именно поэтому: На Linux ты не увидишь спайков в 50 секунд. Если расчет занимает 1.3 мс, он будет занимать 1.3 мс и на первой, и на миллионной итерации. Браузер при этом может просто не открыться или работать со скоростью 1 кадр в секунду, но твой CFR-агент будет лететь с максимальной скоростью."
                      - paragraph [ref=e787]: Для твоего проекта (360 часов обучения) это критично. На Linux ты закончишь через 15 дней. На Windows со спайками ты можешь мучиться месяц, и в итоге получить ошибку драйвера на середине пути.
