                            - text: для CPU. Для маленьких сетей (3 слоя) он теперь реально умеет делать Kernel Fusion (объединять Linear и ReLU в один проход по памяти). Это может дать ~5-10% прироста, так как уменьшает количество обращений к RAM.
                        - listitem [ref=e1796]:
                          - paragraph [ref=e1797]: "Intel OneDNN (бывший MKL-DNN): В версиях 2.6+ обновлены библиотеки векторизации. Если у тебя современный процессор с поддержкой AVX-512 или AMX, новые версии лучше используют эти инструкции для умножения матриц."
                      - heading "2. Регрессии производительности" [level=3] [ref=e1798]
                      - paragraph [ref=e1799]: Главный враг маленьких сетей в новых версиях PyTorch — это Dispatch Overhead.
