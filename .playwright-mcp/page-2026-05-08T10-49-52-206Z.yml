                      - paragraph [ref=e562]: Да, именно это я и утверждаю. Как бы парадоксально это ни звучало для разработчика, Windows (особенно в её пользовательских версиях 10/11) — это «враждебная среда» для высоконагруженных вычислений в реальном времени.
                      - paragraph [ref=e563]: "Вот в чём заключается «фундаментальный конфликт» между твоим кодом и Windows:"
                      - heading "1. WDDM (Windows Display Driver Model)" [level=3] [ref=e564]
                      - paragraph [ref=e565]: В Windows видеокарта в первую очередь принадлежит операционной системе, а не твоему приложению.
                      - list [ref=e566]:
                        - listitem [ref=e567]:
                          - paragraph [ref=e568]: "Preemption (Вытеснение): Планировщик Windows может в любой момент «поставить на паузу» твои вычисления на GPU, чтобы отрисовать окно браузера, системную анимацию или даже курсор мыши."
                        - listitem [ref=e569]:
                          - paragraph [ref=e570]: "Контекстное переключение: Каждый раз, когда Windows забирает GPU под свои нужды, происходит сохранение и восстановление контекста. На это уходят те самые миллисекунды, которые в твоём плотном цикле CFR превращаются в секунды ожидания."
                      - heading "2. TCC vs WDDM" [level=3] [ref=e571]
                      - paragraph [ref=e572]: Профессиональные карты (типа Tesla или Quadro) работают в режиме TCC (Tesla Compute Cluster). В этом режиме карта вообще не выводит изображение, она видна системе только как вычислительный блок.
                      - list [ref=e573]:
                        - listitem [ref=e574]:
                          - paragraph [ref=e575]: Твоя RTX 4060 — это игровая карта, она всегда работает в режиме WDDM. Она обязана «рисовать рабочий стол», и это имеет высший приоритет на уровне ядра ОС.
                      - heading "3. Memory Management (Page Faults)" [level=3] [ref=e576]
                      - paragraph [ref=e577]: "Windows очень агрессивно управляет оперативной памятью. Когда твой Python-процесс раздувается до сотен тысяч объектов (даже если это всего пара гигабайт), Windows начинает проверять: «А не перенести ли часть этих данных в файл подкачки?»."
                      - list [ref=e578]:
                        - listitem [ref=e579]:
                          - paragraph [ref=e580]: Любая попытка PyTorch обратиться к памяти, которую Windows решила «проверить» или переместить, вызывает блокировку потока. В Linux менеджер памяти работает гораздо более предсказуемо для серверных задач.
                      - separator [ref=e581]
                      - heading "Почему Linux (Ubuntu/Debian) решит проблему?" [level=3] [ref=e582]
                      - paragraph [ref=e583]: "Если ты запустишь тот же самый код на Linux:"
                      - list [ref=e584]:
                        - listitem [ref=e585]:
                          - paragraph [ref=e586]: "Direct Hardware Access: Там нет такого жесткого посредника, как WDDM. Твой процесс общается с драйвером NVIDIA почти напрямую."
                        - listitem [ref=e587]:
                          - paragraph [ref=e588]:
                            - text: "X-Server / Wayland можно отключить: Ты можешь запустить код в чистой консоли (режим Headless). Тогда 100% ресурсов GPU будут отданы только под"
                            - code [ref=e589]: advantage_net
                            - text: .
                        - listitem [ref=e590]:
                          - paragraph [ref=e591]:
                            - text: "Predictable Latency: Время отклика"
                            - code [ref=e592]: .cpu()
                            - text: будет стабильным (например, всегда 40μs), без этих безумных спайков в 50 секунд.
                      - heading "Какой вывод?" [level=3] [ref=e593]
                      - paragraph [ref=e594]: "Если ты планируешь обучать модель 360 часов (а это полмесяца 24/7):"
                      - list [ref=e595]:
                        - listitem [ref=e596]:
                          - paragraph [ref=e597]: "На Windows: Ты потратишь из этих 360 часов примерно 100 часов просто на «ожидание», пока Windows соизволит вернуть тебе управление видеокартой. Плюс риск зависания системы из-за долгого удержания GPU (TDR — Timeout Detection and Recovery)."
                        - listitem [ref=e598]:
                          - paragraph [ref=e599]: "На Linux: Ты получишь чистые 360 часов эффективного обучения."
                      - paragraph [ref=e600]: "Мой совет: Если есть возможность — сделай Dual-boot (второй системой) или арендуй облачный GPU на Linux. Это сэкономит тебе недели реального времени."
