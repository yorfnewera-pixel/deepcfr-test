                        - listitem [ref=e480]:
                          - paragraph [ref=e481]: "Вердикт по ОС: Windows — отличная песочница для разработки, но «стеклянный потолок» для высокопроизводительного Deep CFR. Спайки — это «налог на комфорт» графического интерфейса."
                      - separator [ref=e482]
                      - 'heading "План: Двигаемся дальше" [level=3] [ref=e483]'
                      - paragraph [ref=e484]: "Предлагаю закрыть технический блок и переключиться на математику и стратегию, так как именно здесь сейчас лежит наибольший потенциал для профита. У нас есть три ключевых направления:"
                      - paragraph [ref=e485]: 1. Анализ сходимости (The Convergence Gap) Поскольку мы используем VR-DeepPDCFR+, нам нужно понять, насколько эффективно агент учится.
                      - list [ref=e486]:
                        - listitem [ref=e487]:
                          - paragraph [ref=e488]: Как ведет себя Exploitability?
                        - listitem [ref=e489]:
                          - paragraph [ref=e490]: Нет ли «дрейфа» весов на длинных дистанциях (после 5000+ итераций)?
                        - listitem [ref=e491]:
                          - paragraph [ref=e492]: Можем ли мы внедрить Linear Counterfactual Regret Minimization (LCFR), чтобы дать больший вес поздним итерациям и ускорить сходимость?
                      - paragraph [ref=e493]: 2. Уточнение Bet Sizing (The Action Space) Теперь, когда инференс быстр, можем ли мы расширить дерево?
                      - list [ref=e494]:
                        - listitem [ref=e495]:
                          - paragraph [ref=e496]: Добавить 3-й вариант сайзинга на ривере (например, Geometric sizing для пуша).
                        - listitem [ref=e497]:
