                    - paragraph [ref=e900]: "- C (фаворит): Adaptive discount tanh(t/50) + экспоненциальный τ 5.0*exp(-t/300)"
                    - paragraph [ref=e901]
                    - paragraph [ref=e902]: "**МОЙ ВОПРОС**: Вариант C меняет discount с DCFR+ формулы на tanh — это ломает теоретическое обоснование DCFR+ (α=2.0 даёт оптимальный discount rate). Вариант A (ускорить τ) — проще и сохраняет DCFR+. Но нужен ли вообще фикс? Может шумные regrets на итерациях 1-100 не критичны — сеть всё равно учится, и DCFR+ discount правильно взвешивает?"
                    - paragraph [ref=e903]
                    - paragraph [ref=e904]: "### Спор 2: Клиппить ли финальный bootstrapping target?"
                    - paragraph [ref=e905]
                    - paragraph [ref=e906]: "**Оба AI согласны**: НЕ клиппить — правильно. Softmax обрабатывает отрицательные advantages корректно."
                    - paragraph [ref=e907]
                    - paragraph [ref=e908]: "**МОЙ ВОПРОС**: Но стандартный DCFR+ клиппит max(R,0) ПОСЛЕ суммирования. Мы делаем max(R_prev*discount, 0) ДО добавления r_current. Это не просто \"не клиппим финальный target\" — это ДРУГОЙ порядок операций. Правильно ли что при softmax-policy этот порядок операций корректен? Или нужно max(R_prev*discount + r_current, 0) — клиппить после суммы?"
                    - paragraph [ref=e909]
                    - paragraph [ref=e910]: "### Спор 3: Catastrophic interference в shared weights"
                    - paragraph [ref=e911]
                    - paragraph [ref=e912]: "**Haiku**: cos(grad_UTG, grad_BTN) ≈ -0.3 (антагонистично!) → сеть почти не обучает первые слои. Вероятность 60%."
                    - paragraph [ref=e913]
                    - paragraph [ref=e914]: "**Claude**: Один value_head недостаточен для 6-player variance."
                    - paragraph [ref=e915]
                    - paragraph [ref=e916]: "**МОЙ ВОПРОС**: Haiku предполагает что батч — random mix из 6 позиций. Но наш батч — ОБЪЕДИНЁННЫЙ из advantage_memories всех 6 игроков. Ключевой момент: при rotation traversing_player = iteration%6, данные за P0 собираются на итерации 0,6,12..., а за P5 на итерациях 5,11,17... Это значит данные НЕ смешиваются одновременно — каждый игрок доминирует в своём буфере. Это меняет ли оценку catastrophic interference?"
                    - paragraph [ref=e917]
                    - paragraph [ref=e918]: "### Спор 4: Один V(s) vs per-action V(s,a)?"
                    - paragraph [ref=e919]
                    - paragraph [ref=e920]: "**Оба AI**: Один V(s) достаточен. Haiku: per-action overfit на rare info sets."
                    - paragraph [ref=e921]
                    - paragraph [ref=e922]: "**МОЙ ВОПРОС**: Но у нас advantage = regret_raise - V(state).detach(). Это НЕ стандартный actor-critic advantage. Это CFR advantage (counterfactual regret) минус baseline. Fold advantage ≈ -0.35 (мало variance), raise advantage ≈ -1.47 (огромная variance от opponent-dependent outcomes). Разве один V(s) не будет \"переподгоняться\" под high-variance raise, игнорируя fold? Это не классический A2C где advantage = Q-V одинаковой природы для всех действий."
                    - paragraph [ref=e923]
                    - paragraph [ref=e924]: "### Спор 5: Сколько итераций?"
                    - paragraph [ref=e925]
                    - paragraph [ref=e926]: "**Haiku**: 6000 → -6bb/100h (приемлемо для tournament), для GTO нужно 30000-50000."
                    - paragraph [ref=e927]
                    - paragraph [ref=e928]: "**МОЙ ВОПРОС**: Это оценка для vanilla Deep CFR или для нашего softmax+DCFR+ варианта? DCFR+ с α=2.0 сходится быстрее vanilla CFR (доказано в Brown et al. 2019). С softmax вместо RM сходимость может быть ещё быстрее (больше информации из negative regrets). Реалистичен ли прогноз -6bb/100h за 6000 итераций, или overly pessimistic?"
