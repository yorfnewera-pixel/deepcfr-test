                    - paragraph [ref=e545]
                    - paragraph [ref=e546]: "## Наша архитектура (9 изменений, уже реализованы)"
                    - paragraph [ref=e547]
                    - paragraph [ref=e548]: "**P1. Убран clip[-2,2]** — log1p уже ограничивает regret. Clip убивал сигнал."
                    - paragraph [ref=e549]
                    - paragraph [ref=e550]: "**P2. HuberLoss delta=5.0** — вместо delta=1.0. Масштаб advantages после log1p ≈ ±5."
                    - paragraph [ref=e551]
                    - paragraph [ref=e552]: "**P3. Softmax-policy вместо Regret Matching** — КЛЮЧЕВОЕ. π(a) = softmax(advantages(a)/τ). τ: 5.0→0.5 за 3000 итераций (из 6000). Решает RM fold-collapse: при all-negative regrets RM даёт uniform, softmax различает fold=-0.35 vs raise=-1.47."
                    - paragraph [ref=e553]
                    - paragraph [ref=e554]: "**P4. sign(x)*log1p(|x|) scaling для PG reward** — ±200bb → ±5.3."
                    - paragraph [ref=e555]
                    - paragraph [ref=e556]: "**P5-6. log_prob clamp [-5,5], log_std_min=-2** — градиентный контроль."
                    - paragraph [ref=e557]
                    - paragraph [ref=e558]: "**P7. LR warmup 100 итераций**."
                    - paragraph [ref=e559]
                    - paragraph [ref=e560]: "**P8. DCFR+ Discounting + Bootstrapping** — frozen prev_advantage_net (hard copy каждые 6 итераций). Target: max(R_prev*discount, 0) + r_current. discount=(t-1)²/((t-1)²+1), α=2.0. r_current МОЖЕТ быть отрицательным — итоговый target МОЖЕТ быть отрицательным."
                    - paragraph [ref=e561]
                    - paragraph [ref=e562]: "**P9. Value Head** — value_head = nn.Linear(hidden, 1) в advantage_net. advantage = regret_raise - V(state).detach()."
                    - paragraph [ref=e563]
                    - paragraph [ref=e564]: "Контекст: 1 advantage_net с position one-hot для 6 позиций, 6 advantage_memories, rotation iteration%6, 200bb стеки, ~95% UTG -EV."
                    - paragraph [ref=e565]
                    - paragraph [ref=e566]: "## Аргументы двух AI и мои вопросы к тебе"
