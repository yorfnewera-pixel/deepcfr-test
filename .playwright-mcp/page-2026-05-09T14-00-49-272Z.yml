                    - heading "Ответ Gemini" [level=2] [ref=e384]
                    - generic [ref=e388]:
                      - paragraph [ref=e389]: Это отличный вопрос, который вскрывает разницу между научным экспериментом и коммерческим продуктом.
                      - paragraph [ref=e390]: "На самом деле, Blueprint после Pluribus тестировали вдоль и поперек, но не так, как ты себе это представляешь (не в виде новых матчей с профи). Вот основные причины, почему «исправленный» Blueprint не стал заголовком всех газет:"
                      - heading "1. Blueprint — это «черновик», а не «финал»" [level=3] [ref=e391]
                      - paragraph [ref=e392]: В архитектуре Pluribus Blueprint играл роль грубого навигатора. Ученые понимали, что создать идеальный Blueprint для 6-max на всю глубину дерева (до ривера) невозможно — он будет слишком «шумным».
                      - list [ref=e393]:
                        - listitem [ref=e394]:
                          - paragraph [ref=e395]: "Как это работало: Бот использовал Blueprint только на префлопе и в начале флопа. Как только игра становилась сложной, он включал Real-time Search (поиск в реальном времени)."
                        - listitem [ref=e396]:
                          - paragraph [ref=e397]: "Почему не исправляли: Исправлять Blueprint — это как пытаться нарисовать карту мира с точностью до каждого камня. Проще нарисовать общую карту (Blueprint), а когда дойдешь до нужного места, просто посмотреть под ноги (Search)."
                      - heading "2. Научная цель была достигнута" [level=3] [ref=e398]
                      - paragraph [ref=e399]: Для Ноа Брауна и Туомаса Сандхольма (создателей) целью было не создать «идеального покерного бота на продажу», а доказать, что алгоритм Deep CFR в принципе работает в сверхбольших пространствах.
                      - list [ref=e400]:
                        - listitem [ref=e401]:
                          - paragraph [ref=e402]: "Как только Pluribus разгромил профи со счетом +5 BB/100 (что в покере считается гигантским преимуществом), научное сообщество сказало: «Ок, метод доказан». Дальнейшая полировка Blueprint для ученых была уже «технической рутиной», а не научным прорывом."
                      - heading "3. Blueprint «тестили» другие (и ты в их числе!)" [level=3] [ref=e403]
                      - paragraph [ref=e404]: "Хотя Meta (Facebook) не выпустила обновленную версию, саму идею подхватили все разработчики покерного софта:"
                      - list [ref=e405]:
                        - listitem [ref=e406]:
                          - paragraph [ref=e407]: Современные солверы (вроде GTO Wizard или Simple Postflop) — это, по сути, эволюция идей Blueprint и Search.
                        - listitem [ref=e408]:
                          - paragraph [ref=e409]: Ты сейчас в своем проекте фактически занимаешься «тестированием и улучшением» идей Blueprint. Твоя попытка обучить сеть 360 часов — это и есть попытка сделать Blueprint чище, чем он был у Pluribus.
                      - heading "4. Ошибка Blueprint — это не «проигрыш»" [level=3] [ref=e410]
                      - paragraph [ref=e411]: "Важно понимать: ошибки, которые нашли в Blueprint, не означали, что он играет в минус. Это значило, что он играет, например, на 99.5% от идеала вместо 100%. Для победы над людьми этого было более чем достаточно. Дальнейшее улучшение требовало бы экспоненциального роста мощностей (вместо 8 дней обучения — 80 или 800), что не имело смысла для эксперимента."
                      - separator [ref=e412]
                      - heading "Почему Blueprint не «выложили в интернет»?" [level=3] [ref=e413]
                      - paragraph [ref=e414]: "Многие спрашивали: «Если вы его протестили и он такой крутой, дайте нам файл весов!»."
                      - list [ref=e415]:
                        - listitem [ref=e416]:
                          - paragraph [ref=e417]: "Этика: Это бы мгновенно убило онлайн-покер. Meta не хотела нести ответственность за крах индустрии."
                        - listitem [ref=e418]:
                          - paragraph [ref=e419]:
                            - text: "Вес: Blueprint весил сотни гигабайт (в отличие от твоего"
                            - code [ref=e420]: _light.pt
                            - text: ). Его было сложно использовать без серверных мощностей.
                      - heading "Итог для твоего обучения:" [level=3] [ref=e421]
                      - paragraph [ref=e422]: Ученые доказали, что даже «несовершенный» Blueprint в связке с поиском (Search) непобедим. Твоя задача сейчас — сделать максимально качественный Blueprint. Если ты научишь свою сеть достаточно хорошо, тебе даже не понадобится сложный Search на лету, чтобы бить большинство лимитов, потому что люди ошибаются гораздо сильнее, чем нейросеть после 360 часов обучения.
                      - paragraph [ref=e423]: Ты чувствуешь, что твой Blueprint уже начинает «нащупывать» логику (например, в плане сайзингов), или пока результаты кажутся случайными?
