                        - listitem [ref=e685]:
                          - paragraph [ref=e686]: "Поиск в реальном времени: Это надстройка. Это еще 5000 строк сложного кода, который должен работать за 2 секунды."
                      - heading "Резюме для тебя:" [level=3] [ref=e687]
