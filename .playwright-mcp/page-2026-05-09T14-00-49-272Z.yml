                      - paragraph [ref=e650]: "Да, это именно тот момент, где многие путаются в архитектуре Pluribus. Ответ: это было и то, и другое одновременно."
                      - paragraph [ref=e651]: Pluribus работал как «кентавр». Он не мог играть только на поиске и не хотел играть только на весах (Blueprint).
                      - separator [ref=e652]
                      - heading "1. Blueprint (Твои веса) — это «Фундамент»" [level=3] [ref=e653]
                      - paragraph [ref=e654]: Pluribus обязательно имел Blueprint (веса), обученный заранее (аналог того, что ты делаешь сейчас).
                      - list [ref=e655]:
                        - listitem [ref=e656]:
                          - paragraph [ref=e657]: Зачем он был нужен? Без Blueprint поиск в реальном времени невозможен. Когда бот «смотрит в будущее» во время поиска, он не может досчитать дерево до самого конца (до последней карты ривера). Ему нужно на чем-то остановиться.
                        - listitem [ref=e658]:
                          - paragraph [ref=e659]: "Роль весов: Когда поиск доходит до определенной глубины, он спрашивает у Blueprint: «Слушай, я тут прикинул варианты, а как ты думаешь, сколько стоит эта ситуация в среднем?». Blueprint дает оценку."
                      - heading "2. Real-time Search — это «Микроскоп»" [level=3] [ref=e660]
                      - paragraph [ref=e661]: Поиск включался во время хода. Он не заменял Blueprint, а уточнял его.
                      - list [ref=e662]:
                        - listitem [ref=e663]:
                          - paragraph [ref=e664]: Blueprint знает, как играть в среднем.
                        - listitem [ref=e665]:
                          - paragraph [ref=e666]: Search берет этот средний план и пересчитывает его под конкретные ставки, которые сделал оппонент прямо сейчас (особенно если оппонент поставил «странный» сайзинг, которого не было в Blueprint).
                      - blockquote [ref=e667]:
                        - paragraph [ref=e668]: "Важное отличие: Pluribus использовал поиск только для текущего узла и одного шага вперед, а для оценки «будущего» всё равно дергал Blueprint."
                      - separator [ref=e669]
                      - heading "3. Почему ты запутался?" [level=3] [ref=e670]
                      - paragraph [ref=e671]: В научной статье про Pluribus основной акцент сделан на Search, потому что это была их главная инновация — они научились делать поиск в игре на 6 человек так, чтобы он не ломался (метод MCCFR с вложенным поиском).
                      - paragraph [ref=e672]: "Но вот в чем секрет:"
                      - list [ref=e673]:
                        - listitem [ref=e674]:
                          - paragraph [ref=e675]: Если ты уберешь Search — бот всё равно будет играть очень сильно (на уровне крепкого профи), просто на одних весах Blueprint.
                        - listitem [ref=e676]:
                          - paragraph [ref=e677]: Если ты уберешь Blueprint — Search не сможет работать, потому что он не будет знать, чем заканчиваются раздачи.
                      - separator [ref=e678]
                      - heading "4. Стоит ли тебе искать «это»?" [level=3] [ref=e679]
                      - paragraph [ref=e680]: Когда я сказал «не стоит пытаться искать это», я имел в виду алгоритм поиска в реальном времени, а не сами веса.
