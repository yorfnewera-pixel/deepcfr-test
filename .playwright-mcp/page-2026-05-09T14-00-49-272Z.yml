                      - paragraph [ref=e1330]: Ты прав, Discounted CFR (DCFR) — это далеко не «дедовский» метод. Это современный стандарт, который фактически закрыл эпоху классических алгоритмов и открыл дверь для эффективного обучения нейросетей в покере. Статья по нему вышла в 2019 году, и она стала фундаментом для того же Pluribus.
