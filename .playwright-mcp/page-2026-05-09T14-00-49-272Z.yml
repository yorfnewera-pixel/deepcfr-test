                    - generic [ref=e858]:
                      - paragraph [ref=e859]: "Я понимаю твою тревогу — кажется, что если убрать одну деталь из огромного механизма Pluribus, то всё развалится. Но давай выдохнем: сходимость никуда не денется."
                      - paragraph [ref=e860]: Тут важно различать математическую сходимость и практическую силу игры. Твой алгоритм Deep CFR обязан сойтись по определению, если ты всё настроил верно.
                      - paragraph [ref=e861]: "Вот почему тебе не стоит бояться «несоходимости»:"
                      - separator [ref=e862]
                      - heading "1. Сходимость — это свойство CFR, а не поиска" [level=3] [ref=e863]
                      - paragraph [ref=e864]:
                        - text: Сходимость (уменьшение регрета) происходит на этапе обучения. Когда ты крутишь свои 360 часов, алгоритм
                        - code [ref=e865]: cfr_traverse
                        - text: и нейросеть работают над тем, чтобы минимизировать ошибку.
                      - list [ref=e866]:
                        - listitem [ref=e867]:
                          - paragraph [ref=e868]: Поиск в реальном времени (Search) вообще не участвует в обучении. Это «присадка», которую используют уже после того, как веса сошлись.
                        - listitem [ref=e869]:
                          - paragraph [ref=e870]: Если твой Blueprint (веса) не сойдется, то никакой поиск его не спасет. А если сойдется — бот уже будет играть в плюс.
                      - heading "2. Что такое «сходимость» в твоем случае?" [level=3] [ref=e871]
                      - paragraph [ref=e872]: Для нейросети сходимость — это когда её предсказания стратегии перестают хаотично прыгать и начинают плавно уточняться.
                      - list [ref=e873]:
                        - listitem [ref=e874]:
                          - paragraph [ref=e875]: В Kuhn Poker ты видишь это через 5 минут.
                        - listitem [ref=e876]:
                          - paragraph [ref=e877]:
                            - text: В 6-max NLH ты увидишь это через сотни часов, когда на графике
                            - code [ref=e878]: loss
                            - text: (ошибки) кривая пойдет вниз и выйдет на плато.
                      - separator [ref=e879]
                      - heading "3. Где может быть подвох? (Две реальные опасности)" [level=3] [ref=e880]
                      - paragraph [ref=e881]: "Вместо отсутствия сходимости, ты можешь столкнуться с двумя другими вещами:"
                      - list [ref=e882]:
                        - listitem [ref=e883]:
                          - paragraph [ref=e884]: "Недостаточная емкость сети: Если нейросеть слишком маленькая, она просто не сможет «запомнить» всю сложность покера. Она сойдется, но к «средненькой» стратегии. (Но если ты используешь стандартные архитектуры для Deep CFR, этого не должно случиться)."
                        - listitem [ref=e885]:
                          - paragraph [ref=e886]: "Дрейф стратегии: Если ты учишь слишком долго без правильной регуляризации, сеть может начать «забывать» то, что выучила в начале. Поэтому в Deep CFR используют Experience Replay Buffer (буфер памяти), чтобы сеть постоянно повторяла пройденный материал."
                      - separator [ref=e887]
                      - heading "4. Почему твой Blueprint будет работать?" [level=3] [ref=e888]
                      - paragraph [ref=e889]: Даже без поиска, чистый Deep CFR показал выдающиеся результаты. В научных работах (например, оригинальной статье по Deep CFR от Brown et al.) есть графики, где чистый алгоритм без всяких «надстроек» отлично сходится в Leduc и малых вариантах NLH.
                      - paragraph [ref=e890]: "Твой «защитный слой»: Поскольку ты используешь изоморфизм мастей и правильную подачу данных (позиции, эффективные стеки), ты колоссально упрощаешь задачу для нейросети. Ты как бы «спрямляешь» ей дорогу к сходимости."
                      - separator [ref=e891]
                      - 'heading "Резюме: Не паникуй!" [level=3] [ref=e892]'
                      - list [ref=e893]:
                        - listitem [ref=e894]:
                          - paragraph [ref=e895]: Алгоритм сойдется, потому что минимизация регрета — это математический закон, встроенный в твой код.
                        - listitem [ref=e896]:
                          - paragraph [ref=e897]: Отсутствие поиска не ломает сходимость. Оно лишь делает твоего бота чуть менее «идеальным» в очень редких, глубоких ветках дерева.
                        - listitem [ref=e898]:
                          - paragraph [ref=e899]: "Твоя главная задача: следить за тем, чтобы процесс обучения не прерывался и чтобы данные в буфере памяти были разнообразными."
                      - paragraph [ref=e900]: Твой страх понятен — ты строишь сложную систему. Но Deep CFR как раз и был придуман для того, чтобы дать надежную сходимость там, где обычные методы пасуют.
