                      - paragraph [ref=e779]: Если бы Pluribus играл только по Blueprint, его, скорее всего, смогли бы «эксплуатировать» топовые профи за 10 000 рук. Они бы нашли ситуации, где нейросеть «глючит» из-за слишком сильного обобщения.
                      - paragraph [ref=e780]: "Поиск в реальном времени был защитным слоем для аппроксимации. Он доказывал, что:"
                      - list [ref=e781]:
                        - listitem [ref=e782]:
                          - paragraph [ref=e783]: Алгоритм может справляться с «неожиданными» действиями людей (которых нет в обучающей выборке).
                        - listitem [ref=e784]:
                          - paragraph [ref=e785]: Ошибки аппроксимации на ривере можно свести к нулю вычислительным путем.
                      - heading "4. Аппроксимация — это «Душа», Поиск — это «Броня»" [level=3] [ref=e786]
                      - paragraph [ref=e787]: Ты прав в том, что Blueprint — это сердце алгоритма. Если бы аппроксимация не работала, поиск бы не помог (ему просто не на что было бы опираться в конце своих расчетов).
                      - paragraph [ref=e788]: "Главный научный вывод Pluribus:"
                      - blockquote [ref=e789]:
                        - paragraph [ref=e790]: «Нам не нужно решать всю игру целиком. Нам нужно решить её достаточно хорошо (Blueprint), а потом использовать это решение как фундамент для точных локальных вычислений (Search)».
                      - separator [ref=e791]
                      - heading "Что это значит для твоего обучения?" [level=3] [ref=e792]
                      - paragraph [ref=e793]: Твой Deep CFR — это и есть та самая фундаментальная аппроксимация.
                      - list [ref=e794]:
