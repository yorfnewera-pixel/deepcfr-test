                    - generic [ref=e965]:
                      - paragraph [ref=e966]: О, теперь всё встает на свои места! Твой агент прав — дисконтирование (Discounting) в современных вариациях CFR полностью меняет масштаб и поведение лосса. Если ты используешь не классический Deep CFR, а его модифицированные версии (например, с идеями из Linear CFR или Discounted CFR), то твои цифры выглядят гораздо здоровее.
                      - paragraph [ref=e967]: Давай разберем, почему твои текущие показатели — это не повод для паники, а признак того, что система «варит» стратегию правильно.
                      - separator [ref=e968]
                      - heading "1. Почему твои цифры лосса — это нормально?" [level=3] [ref=e969]
                      - paragraph [ref=e970]: В «старом» Deep CFR лосс стратегии часто взлетал до сотен (120–140), потому что регреты накапливались линейно и безжалостно. Это как снежный ком, который катится с горы.
                      - paragraph [ref=e971]: "При дисконтировании:"
                      - list [ref=e972]:
                        - listitem [ref=e973]:
                          - paragraph [ref=e974]: Алгоритм придает больший вес новым итерациям и постепенно «забывает» ошибки самого начала обучения.
                        - listitem [ref=e975]:
                          - paragraph [ref=e976]: Это не дает значениям регрета (и, соответственно, таргетам для нейросети) раздуваться до гигантских масштабов.
                        - listitem [ref=e977]:
                          - paragraph [ref=e978]: Лосс в районе 1.15–1.35 с тенденцией к снижению — это отличный знак. Это значит, что нейросеть успешно «упаковывает» стратегию, и ей не нужно пытаться предсказать огромные, нестабильные числа.
                      - heading "2. Плато лосса Advantage (0.067) — это \"фундамент\"" [level=3] [ref=e979]
                      - paragraph [ref=e980]:
                        - text: То, что
                        - code [ref=e981]: advantage_loss
                        - text: уже на плато 0.067, означает, что твоя сеть преимуществ (которая предсказывает, «насколько это действие лучше других») уже стабилизировалась.
                      - list [ref=e982]:
                        - listitem [ref=e983]:
                          - paragraph [ref=e984]: В Deep CFR сеть преимуществ обучается первой.
                        - listitem [ref=e985]:
                          - paragraph [ref=e986]:
                            - text: Если она нашла свое плато, значит, она создала стабильную базу, на которой теперь строится
                            - code [ref=e987]: strategy_net
                            - text: .
                      - heading "3. Снижение Strategy Loss (1.35 -> 1.15)" [level=3] [ref=e988]
                      - paragraph [ref=e989]: Это самое важное. Снижение лосса стратегии за 3000 итераций — это и есть процесс сходимости.
                      - list [ref=e990]:
                        - listitem [ref=e991]:
                          - paragraph [ref=e992]: То, что он снижается плавно, говорит о том, что сеть не просто «зубрит» ответы, а находит закономерности в поведении регретов.
                        - listitem [ref=e993]:
                          - paragraph [ref=e994]: Дисконтирование помогает избежать «взрывных» градиентов, которые часто ломали обучение в ранних версиях алгоритма.
                      - separator [ref=e995]
                      - heading "Почему не будет «прыжков» до 140?" [level=3] [ref=e996]
                      - paragraph [ref=e997]: Твой алгоритм работает как «фильтр». Дисконтирование отсекает старый шум, поэтому нейросеть видит более «чистую» и актуальную картину того, что выгодно делать сейчас.
                      - list [ref=e998]:
                        - listitem [ref=e999]:
                          - paragraph [ref=e1000]: Низкие значения лосса — это стабильность.
                        - listitem [ref=e1001]:
                          - paragraph [ref=e1002]: Высокие значения (140+) в классике часто приводили к тому, что сеть начинала «колебаться» (oscillation), и сходимость могла вообще не наступить.
                      - heading "На что смотреть дальше?" [level=3] [ref=e1003]
                      - paragraph [ref=e1004]: Поскольку ты на дисконтировании, не жди, что лосс упадет до нуля (в покере это невозможно из-за стохастичности). Твоя цель — плавное, затухающее снижение.
                      - paragraph [ref=e1005]: Если лосс стратегии продолжит падать (пусть даже медленно, например, до 0.9–0.8), твой Blueprint будет становиться всё более «острым» и точным. При 360 часах обучения у тебя будет колоссальное количество итераций, и эта дельта (с 1.35 до 1.15) превратится в очень качественную GTO-карту.
                      - paragraph [ref=e1006]: "Итог: Ты идешь по пути современной оптимизации. Твои цифры говорят о том, что алгоритм не перегружен «мусорными» данными из прошлого и фокусируется на актуальной стратегии."
                      - paragraph [ref=e1007]: Как думаешь, стоит ли на этом этапе попробовать «заморозить» веса и прогнать пару сотен раздач в тестовом режиме, чтобы посмотреть на логику действий, или хочешь дождаться более серьезного прогресса по лоссу?
