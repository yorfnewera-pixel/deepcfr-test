                    - heading "Ответ Gemini" [level=2] [ref=e280]
                    - generic [ref=e284]:
                      - paragraph [ref=e285]: Тут важно не путать Blueprint (общий план) и Real-time Search (уточнение на месте). Давай разложим по полочкам, как именно ученые из Facebook (Meta) и университета Карнеги-Меллона проверяли своего "монстра".
                      - paragraph [ref=e286]: Они использовали метод, который в науке называется "Aivat". Это очень продвинутая форма статистического анализа, которая позволяет оценить качество игры, не полагаясь на чистое везение.
                      - separator [ref=e287]
                      - heading "1. Как Blueprint определил GTO?" [level=3] [ref=e288]
                      - paragraph [ref=e289]: Сам по себе Blueprint — это и есть результат работы твоего любимого Deep CFR.
                      - list [ref=e290]:
                        - listitem [ref=e291]:
                          - paragraph [ref=e292]: Его обучали на суперкомпьютере в течение 8 дней (это эквивалент твоих 360 часов, но на тысячи ядер).
                        - listitem [ref=e293]:
                          - paragraph [ref=e294]: За это время алгоритм прогнал через себя такое количество раздач, что накопленный регрет стал минимальным.
                        - listitem [ref=e295]:
                          - paragraph [ref=e296]: "Математический факт: Если суммарный регрет стремится к нулю, то стратегия игрока по определению стремится к Равновесию Нэша."
                      - paragraph [ref=e297]: То есть Blueprint определил GTO не потому, что "знал ответ", а потому что он миллиарды раз ошибся и исправил свои ошибки, пока не осталось действий, о которых стоило бы "сожалеть".
                      - heading "2. Как проверили 10 000 раздач против профи?" [level=3] [ref=e298]
                      - paragraph [ref=e299]: Ученым не нужно было "пробивать" Blueprint через более глубокие деревья в процессе самой игры. Они сделали это после.
                      - paragraph [ref=e300]: Когда эксперимент закончился, они взяли все логи раздач и применили Depth-Limited Search (поиск на большую глубину) к каждой критической точке, где бот принимал решение.
                      - list [ref=e301]:
                        - listitem [ref=e302]:
                          - paragraph [ref=e303]: Если Blueprint говорил "Рейз", они запускали сверхмощный солвер из этой точки, который считал ситуацию гораздо детальнее.
                        - listitem [ref=e304]:
                          - paragraph [ref=e305]: Если солвер подтверждал, что "Рейз" — это лучшее решение, значит, Blueprint был точен.
                        - listitem [ref=e306]:
                          - paragraph [ref=e307]: "Результат: Оказалось, что Blueprint был невероятно точен в \"базовых\" ситуациях, а в сложных моментах (терн/ривер) бот использовал поиск в реальном времени, который был еще точнее."
                      - heading "3. Оценка \"эксплуатируемости\" (Exploitability)" [level=3] [ref=e308]
                      - paragraph [ref=e309]: Самый главный способ понять, насколько бот близок к GTO — это вычислить, сколько денег у него мог бы забрать "Совершенный Оппонент" (Local Best Responder).
                      - list [ref=e310]:
                        - listitem [ref=e311]:
                          - paragraph [ref=e312]: Ученые создали "виртуального гения", который знал стратегию Pluribus насквозь.
                        - listitem [ref=e313]:
                          - paragraph [ref=e314]: Этот гений пытался найти в стратегии бота хотя бы одну "дыру" (например, бот слишком часто фолдит на 3-бет).
                        - listitem [ref=e315]:
                          - paragraph [ref=e316]: "Итог: Даже такой \"всезнающий\" противник выигрывал у Pluribus настолько мало, что в условиях реальной игры (с комиссией рума и дисперсией) этот бот считался бы практически неуязвимым."
                      - separator [ref=e317]
                      - heading "Почему все ахнули еще раз?" [level=3] [ref=e318]
                      - paragraph [ref=e319]: "Потому что до Pluribus считалось, что для 6-max нельзя создать Blueprint, который бы не \"дымился\" от ошибок. А Pluribus показал, что:"
                      - list [ref=e320]:
                        - listitem [ref=e321]:
                          - paragraph [ref=e322]: "Абстракции работают: Можно объединять похожие руки в группы (обобщение), и стратегия не развалится."
                        - listitem [ref=e323]:
                          - paragraph [ref=e324]: "Сэмплирование работает: Не нужно смотреть каждую ветку, чтобы понять дерево."
                      - paragraph [ref=e325]: "Blueprint определил GTO методом \"от противного\": он попробовал всё плохое, пока не осталось только хорошее."
                      - heading "Как это касается твоих 360 часов?" [level=3] [ref=e326]
                      - paragraph [ref=e327]: Ты сейчас создаешь свой собственный Blueprint. Твоя нейросеть — это и есть тот "хранитель GTO", который выкристаллизовывается из хаоса. Чем дольше ты учишь, тем меньше у твоего Blueprint будет "дыр", которые мог бы найти профи или другой бот.
                      - paragraph [ref=e328]: Ты фактически повторяешь путь создания Pluribus на своем "железе". И когда ты закончишь, твой Blueprint будет определять GTO ровно так же — через миллионы исправленных ошибок регрета.
                      - paragraph [ref=e329]: Понятно теперь, что Blueprint — это не "список правил", а результат бесконечной работы над ошибками?
