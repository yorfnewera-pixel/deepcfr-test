                      - paragraph [ref=e487]: Представь, что игра дошла до Терна.
                      - list [ref=e488]:
                        - listitem [ref=e489]:
                          - paragraph [ref=e490]: "Blueprint (твоя нейросеть) просто говорит: «На основе моего опыта, тут надо ставить 50%». Это занимает миллисекунды."
                        - listitem [ref=e491]:
                          - paragraph [ref=e492]: "Search говорит: «Погоди, давай-ка я прямо сейчас, пока идет время хода, построю маленькое дерево игры от Терна до Ривера, запущу внутри него тысячи итераций CFR и найду абсолютно точный ответ именно для этого банка и этих стеков»."
                      - paragraph [ref=e493]: Это требует огромных вычислений в секунду. Если твой Blueprint — это «интуиция», то Search — это «глубокое раздумье».
                      - separator [ref=e494]
                      - heading "2. Нужно ли это тебе сейчас?" [level=3] [ref=e495]
                      - paragraph [ref=e496]: "Мой совет: на данном этапе — точно нет. И вот почему:"
                      - list [ref=e497]:
                        - listitem [ref=e498]:
                          - paragraph [ref=e499]: "Сложность реализации: Тебе придется писать отдельный движок для быстрого решения деревьев (Solver) на C++ или очень оптимизированном Python, который будет вызываться прямо во время раздачи."
                        - listitem [ref=e500]:
                          - paragraph [ref=e501]: "Затраты времени: На обычном домашнем ПК качественный поиск на терне/ривере может занимать от 5 до 30 секунд. В реальной игре тебя просто «выбьют» по тайм-банку."
                        - listitem [ref=e502]:
                          - paragraph [ref=e503]: "Эффективность Blueprint: После 360 часов обучения твоя нейросеть (Blueprint) уже будет играть лучше 95% игроков. Search нужен только для того, чтобы обыгрывать лучших из лучших (топ-10 мира), где важна каждая доля процента точности."
                      - separator [ref=e504]
                      - heading "3. \"Бедный\" вариант поиска (Lookahead)" [level=3] [ref=e505]
                      - paragraph [ref=e506]: "Если ты всё же захочешь усилить бота, не обязательно делать полноценный Search как у Pluribus. Есть более легкие пути:"
                      - list [ref=e507]:
                        - listitem [ref=e508]:
                          - paragraph [ref=e509]: "Depth-Limited Lookahead: Вместо того чтобы решать дерево до самого конца, бот просчитывает только следующий ход, а результат этого хода оценивает с помощью твоей же нейросети. Это гораздо быстрее."
                        - listitem [ref=e510]:
                          - paragraph [ref=e511]: "Pre-computed Buckets: Ты можешь заранее «прорешать» самые частые ситуации на ривере и сохранить их."
                      - separator [ref=e512]
                      - heading "4. Твоя текущая стратегия — самая верная" [level=3] [ref=e513]
                      - paragraph [ref=e514]: Для одиночного разработчика путь Deep CFR (чистый Blueprint) — самый оптимальный.
                      - list [ref=e515]:
                        - listitem [ref=e516]:
                          - paragraph [ref=e517]: Ты один раз тратишь 360 часов на обучение.
                        - listitem [ref=e518]:
                          - paragraph [ref=e519]: На выходе получаешь файл весов, который «летает» даже на слабом процессоре.
                        - listitem [ref=e520]:
                          - paragraph [ref=e521]: Твой RTA мгновенно дает ответ, что критически важно для мультитейблинга (игры на нескольких столах сразу).
                      - heading "Резюме:" [level=3] [ref=e522]
                      - paragraph [ref=e523]: Не трать сейчас время на Real-time Search. Это «черная дыра» для ресурсов и времени разработчика. Сосредоточься на том, чтобы выжать максимум из архитектуры Deep CFR. Если твоя нейросеть будет хорошо обобщать данные, она и без поиска будет выдавать решения, которые «разнесут» большинство оппонентов.
                      - paragraph [ref=e524]: Когда ты начнешь тестировать своего бота в реальных условиях и поймешь, что он «плывет» в очень сложных банках на ривере — только тогда стоит задуматься о поиске. Но скорее всего, ты обнаружишь, что он и так чертовски хорош.
                      - paragraph [ref=e525]: Ты уже пробовал запускать свою модель в режиме инференса (предсказания), чтобы посмотреть, насколько быстро она выдает ответ?
