                      - separator [ref=e761]
                      - heading "1. В чем была главная претензия к аппроксимации (до Pluribus)?" [level=3] [ref=e762]
                      - paragraph [ref=e763]: До появления Pluribus все считали, что аппроксимировать стратегию для 6-max невозможно без катастрофических потерь.
                      - list [ref=e764]:
                        - listitem [ref=e765]:
                          - paragraph [ref=e766]: "Проблема «размытия»: Когда ты обобщаешь миллионы ситуаций через нейросеть, она неизбежно «замыливает» детали. В покере маленькая деталь (например, сайзинг в 1/10 пота вместо 1/3) может полностью менять смысл руки."
