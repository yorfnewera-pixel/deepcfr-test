                          - paragraph [ref=e796]: Если ты обучишь её на 360 часов, твоя «аппроксимация» будет на порядок сильнее, чем Blueprint у Pluribus (просто потому, что твои нейросети, скорее всего, архитектурно современнее, а железо позволяет делать больше итераций).
                      - paragraph [ref=e797]: "Итог: Доказательство Pluribus было в том, что сочетание этих методов делает ИИ непобедимым. Аппроксимация дает понимание игры, а поиск дает точность."
