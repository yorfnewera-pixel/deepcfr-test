                      - heading "2. Доказательство через «Вложенный поиск» (Nested Search)" [level=3] [ref=e769]
                      - paragraph [ref=e770]: "Научная ценность Pluribus была именно в том, чтобы доказать: мы можем использовать грубую аппроксимацию (Blueprint), если у нас есть механизм, который «чинит» её ошибки в реальном времени."
                      - list [ref=e771]:
                        - listitem [ref=e772]:
                          - paragraph [ref=e773]: "Blueprint (Аппроксимация): Доказала, что можно сжать знания о триллионах состояний в один файл весов и при этом не потерять «общую канву» GTO."
                        - listitem [ref=e774]:
