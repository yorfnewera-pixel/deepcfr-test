                      - paragraph [ref=e1570]:
                        - text: Когда мы обсуждали ограничение буфера (в частности,
                        - code [ref=e1571]: strategy_memory
                        - text: ") до 10,000–40,000 элементов, мы опирались на три критических аргумента: технический, алгоритмический и системный."
                      - paragraph [ref=e1572]: "Вот почему «больше» в Deep CFR не всегда значит «лучше»:"
                      - 'heading "1. Алгоритмический: Предотвращение «застоя» (Stale Data)" [level=3] [ref=e1573]'
                      - paragraph [ref=e1574]: CFR — это итеративный процесс. На первой итерации твои данные — это чистый шум (агент играет случайно). На 1000-й итерации стратегия уже осмысленна.
                      - list [ref=e1575]:
                        - listitem [ref=e1576]:
                          - paragraph [ref=e1577]: "Проблема: Если буфер будет огромным (например, 1 млн записей), то при обучении на 2000-й итерации сеть будет постоянно видеть «мусорные» данные из самого начала пути."
                        - listitem [ref=e1578]:
                          - paragraph [ref=e1579]: "Решение: Маленький буфер (10k) работает как окно скользящего среднего. Он заставляет нейросеть обучаться только на самых свежих и актуальных «уроках» (дискаунтинг через забывание). Это критически важно для сходимости к Нэшу в динамических играх."
                      - 'heading "2. Технический: Скорость обучения (Training Throughput)" [level=3] [ref=e1580]'
                      - paragraph [ref=e1581]: Ты используешь CPU для инференса и, вероятно, для обучения.
                      - list [ref=e1582]:
                        - listitem [ref=e1583]:
                          - paragraph [ref=e1584]: "Затраты времени: Обучение маленького MLP на 10,000 примеров происходит почти мгновенно. Если раздуть буфер до 100,000+, фаза обучения начнет занимать значительное время, увеличивая общий цикл итерации."
                        - listitem [ref=e1585]:
                          - paragraph [ref=e1586]: "Эффективность: В Deep CFR профитнее сделать 100 коротких итераций (сбор данных + быстрое обучение), чем 10 длинных. Маленький буфер позволяет держать этот темп."
                      - 'heading "3. Системный: Борьба с Page Faults в Windows" [level=3] [ref=e1587]'
                      - paragraph [ref=e1588]: Как мы выяснили, Windows (WDDM/Memory Manager) начинает «лагать» и вызывать спайки, когда в памяти висит слишком много объектов.
                      - list [ref=e1589]:
                        - listitem [ref=e1590]:
                          - paragraph [ref=e1591]: "Фрагментация: Даже если это NumPy-массив, огромные аллокации в Python могут провоцировать ОС на сброс страниц в файл подкачки или дефрагментацию RAM «на лету»."
                        - listitem [ref=e1592]:
                          - paragraph [ref=e1593]: "Локальность кэша: Буфер на 10k элементов (156 float на каждый) занимает всего около 6 MB. Это полностью влезает в L3-кэш большинства современных процессоров. Обработка данных, которые не покидают пределы процессора, в десятки раз быстрее, чем постоянное чтение из основной оперативной памяти."
                      - separator [ref=e1594]
                      - heading "Итоговый аргумент:" [level=3] [ref=e1595]
                      - paragraph [ref=e1596]: "Мы выбрали 10k как безопасную точку старта, чтобы:"
                      - list [ref=e1597]:
                        - listitem [ref=e1598]:
                          - paragraph [ref=e1599]: Гарантировать, что обучение не станет «бутылочным горлышком» на CPU.
                        - listitem [ref=e1600]:
                          - paragraph [ref=e1601]: Минимизировать риск системных фризов Windows.
                        - listitem [ref=e1602]:
                          - paragraph [ref=e1603]: Обеспечить агрессивное обновление стратегии (чтобы агент быстрее забывал свои «детские ошибки»).
                      - blockquote [ref=e1604]:
                        - paragraph [ref=e1605]: "Важно: Если ты заметишь, что лосс (loss) при обучении слишком сильно скачет («шумное» обучение), это сигнал, что 10k маловато и стоит поднять до 20k–40k. Но прыгать сразу на сотни тысяч — верный способ поймать те самые 50-секундные спайки снова."
                      - paragraph [ref=e1606]:
                        - text: Помнишь, мы еще обсуждали, что
