                    - paragraph [ref=e1633]: 4. .to(device) — НЕТ, device='cpu'
                    - paragraph [ref=e1634]: "5. Memory writes: deque.append() с .tobytes() + np.frombuffer() при training"
                    - paragraph [ref=e1635]
                    - paragraph [ref=e1636]: "Три CPU-релевантные оптимизации:"
                    - paragraph [ref=e1637]
                    - paragraph [ref=e1638]: A) torch.distributions.Normal → torch.normal в cfr_traverse_multi
                    - paragraph [ref=e1639]: "Сейчас: dist = torch.distributions.Normal(z_mean, std); z_raw = dist.sample()"
                    - paragraph [ref=e1640]: "Проблема: Normal.__init__ создаёт обёртку-объект каждый вызов — overhead даже на CPU"
                    - paragraph [ref=e1641]: "Фикс: z_raw = torch.normal(z_mean, std)"
                    - paragraph [ref=e1642]: В model.py оставляем Distribution (нужен rsample() + log_prob() для training)
                    - paragraph [ref=e1643]
                    - paragraph [ref=e1644]: B) encode_state dedup
                    - paragraph [ref=e1645]: "Сейчас: encoded = encode_state(state, player_id) для forward, потом encode_state(state, player_id) ещё раз для memory write"
                    - paragraph [ref=e1646]: "Фикс: сохранить encoded от первого вызова, переиспользовать для memory"
                    - paragraph [ref=e1647]
                    - paragraph [ref=e1648]: C) Numpy ring buffers вместо deque + .tobytes()
                    - paragraph [ref=e1649]: "Сейчас: PrioritizedMemory хранит list of tuples с bytes (_state_bytes = np.array(...).tobytes())"
                    - paragraph [ref=e1650]: "При training: np.frombuffer(s, dtype=np.float32) для восстановления"
