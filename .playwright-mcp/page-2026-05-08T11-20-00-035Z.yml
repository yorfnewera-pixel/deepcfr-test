                    - paragraph [ref=e1627]: "Контекст: Мы перешли с GPU на CPU (WDDM спайки делали GPU медленнее). Версия кода откатана до чистой. Сейчас нужно определить какие оптимизации из баг-репорта #21 (Zero-Item Policy, изначально для GPU) релевантны для CPU-only inference."
                    - paragraph [ref=e1628]
                    - paragraph [ref=e1629]: "Текущий горячий путь (cfr_traverse_multi):"
                    - paragraph [ref=e1630]: 1. encode_state() — numpy concatenation, вызывается 2 раза на traversing-узел (1 для forward, 1 для memory)
