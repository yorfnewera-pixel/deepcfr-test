                    - generic [ref=e380]:
                      - paragraph [ref=e381]: "Это отличный вопрос, который бьет прямо в центр архитектуры Deep PDCFR+. Ты стоишь перед выбором: использовать Predictive часть (предсказание будущих регретов) или ограничиться только Discounting (взвешиванием прошлых данных)."
                      - paragraph [ref=e382]: "Короткий ответ: Для 6-max No-Limit Hold'em на RTX 4060 — дискаунтинг (PDCFR) гораздо важнее, чем предиктив (DeepCFR)."
                      - paragraph [ref=e383]: Давай разберем, почему «пропустить» предсказание может быть не просто проще, а даже эффективнее.
                      - separator [ref=e384]
                      - heading "1. В чем разница?" [level=3] [ref=e385]
                      - list [ref=e386]:
                        - listitem [ref=e387]:
                          - paragraph [ref=e388]: "Predictive (DeepCFR): Пытается предсказать, какие регреты будут в будущем, используя текущую нейросеть. Это добавляет «стабильности», но требует bootstrapping (постоянных двойных прогонов через сеть)."
                        - listitem [ref=e389]:
                          - paragraph [ref=e390]: "Discounting (PDCFR): Просто говорит: «Старые ошибки (регреты) менее важны, чем новые». Мы умножаем накопленные регреты на коэффициент (дискаунтер) на каждой итерации."
                      - heading "2. Почему в твоем случае дискаунтер — это S-tier решение?" [level=3] [ref=e391]
                      - heading "А. Вычислительная нагрузка (Твои спайки)" [level=4] [ref=e392]
                      - paragraph [ref=e393]:
                        - text: Предсказание (Predictive) требует, чтобы при обучении новой
                        - code [ref=e394]: advantage_net
                        - text: ты постоянно обращался к
                        - code [ref=e395]: prev_advantage_net
                        - text: (для вычисления таргета).
                      - list [ref=e396]:
                        - listitem [ref=e397]:
                          - paragraph [ref=e398]: Это удваивает количество GPU-вычислений во время фазы обучения.
                        - listitem [ref=e399]:
                          - paragraph [ref=e400]: Это создает лишние зависимости в памяти, которые в Windows могут провоцировать те самые спайки, с которыми мы боролись.
                      - heading "Б. Сходимость в покере" [level=4] [ref=e401]
                      - paragraph [ref=e402]: Исследования (например, оригинальная статья по PDCFR) показывают, что дискаунтирование регретов — это самый мощный фактор ускорения сходимости к Нэшу.
                      - list [ref=e403]:
                        - listitem [ref=e404]:
                          - paragraph [ref=e405]:
                            - text: Линейный дискаунтинг (
                            - generic [ref=e409]: LCFR
                            - text: ) или полиномиальный (
                            - generic [ref=e413]: PDCFR
                            - text: ) заставляют агента быстрее «забывать» глупые ошибки префлопа первой итерации.
                        - listitem [ref=e414]:
                          - paragraph [ref=e415]: Предсказание (Predictive) часто дает лишь незначительный прирост точности ценой огромных ресурсов.
                      - heading "В. Проблема \"шума\"" [level=4] [ref=e416]
                      - paragraph [ref=e417]: Если твоя нейросеть еще не обучена (ранние итерации), её «предсказания» — это просто шум. Если ты используешь плохие предсказания для обучения, ты можешь увести агента в сторону от равновесия (divergence). Дискаунтер же математически надежен — он просто снижает вес старых данных.
                      - separator [ref=e418]
                      - heading "3. Как это реализовать \"просто\"? (Твой план)" [level=3] [ref=e419]
