                      - 'heading "3. Технический нюанс: Пул памяти" [level=3] [ref=e1343]'
                      - paragraph [ref=e1344]: В Deep CFR мы постоянно записываем данные в буфер. NumPy 2.x лучше управляет аллокацией страниц памяти. Поскольку мы уже выяснили, что Page Faults в Windows — твой главный враг, более современный менеджер памяти в NumPy 2.4.4 может помочь сгладить микро-задержки.
