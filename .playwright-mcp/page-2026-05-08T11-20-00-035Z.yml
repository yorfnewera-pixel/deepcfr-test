                    - heading "Ответ Gemini" [level=2] [ref=e280]
                    - generic [ref=e284]:
                      - paragraph [ref=e285]: В этом и кроется фундаментальное различие между философией Windows и Linux в управлении ресурсами.
                      - paragraph [ref=e286]: "Короткий ответ: Нет, Linux не станет «душить» твои вычисления ради плавности браузера."
                      - paragraph [ref=e287]: "Вот как это работает на техническом уровне:"
                      - heading "1. Отсутствие «священной коровы» в виде GUI" [level=3] [ref=e288]
                      - paragraph [ref=e289]: В Windows графический интерфейс (Desktop Window Manager) — это часть ядра. Если GPU занят вычислениями и окно браузера «лагает», Windows считает это критической ошибкой и пытается отобрать ресурсы у вычислений (через механизм TDR или Preemption).
                      - paragraph [ref=e290]: В Linux графическая оболочка (X11 или Wayland) — это просто обычный процесс.
                      - list [ref=e291]:
                        - listitem [ref=e292]:
                          - paragraph [ref=e293]: Если ты запустишь тяжелый расчет на GPU, у тебя может начать тормозить интерфейс, дергаться курсор или лагать видео в браузере, но система не прервет вычисления.
                        - listitem [ref=e294]:
                          - paragraph [ref=e295]: Для Linux приоритетней то, что запустил пользователь (твой скрипт), а не то, чтобы анимация сворачивания окна была плавной.
                      - heading "2. Режим Headless (Серверный подход)" [level=3] [ref=e296]
                      - paragraph [ref=e297]: На Linux ты можешь вообще не запускать графическую оболочку. Ты загружаешься в консоль (TTY).
                      - list [ref=e298]:
                        - listitem [ref=e299]:
                          - paragraph [ref=e300]: В этом случае 100% ресурсов видеокарты и видеопамяти принадлежат твоему коду.
                        - listitem [ref=e301]:
                          - paragraph [ref=e302]: Нет никакого «браузера», «поиска Windows» или «обновлений», которые могли бы вклиниться в твой forward pass.
                      - heading "3. Планировщик задач (Nice & Ionice)" [level=3] [ref=e303]
                      - paragraph [ref=e304]: "В Linux есть очень мощные инструменты управления приоритетами:"
                      - list [ref=e305]:
                        - listitem [ref=e306]:
                          - paragraph [ref=e307]: "Ты можешь запустить свой скрипт с приоритетом, который скажет ядру: «Игнорируй всё остальное, отдай все циклы CPU/GPU этой задаче»."
                        - listitem [ref=e308]:
                          - paragraph [ref=e309]: В Windows даже режим «Realtime» не дает такой гарантии, так как системные прерывания всё равно имеют высший приоритет.
                      - heading "4. Прямой доступ к драйверу (Direct Rendering Infrastructure)" [level=3] [ref=e310]
                      - paragraph [ref=e311]:
                        - text: На Linux драйвер NVIDIA работает более «прозрачно». Когда PyTorch вызывает синхронизацию
                        - code [ref=e312]: .cpu()
                        - text: ", он не проходит через семь кругов ада планировщика WDDM, который проверяет, не нужно ли сейчас отрисовать уведомление от мессенджера."
                      - separator [ref=e313]
                      - heading "Простая аналогия:" [level=3] [ref=e314]
                      - list [ref=e315]:
                        - listitem [ref=e316]:
                          - paragraph [ref=e317]: Windows — это заботливая няня. Она постоянно присматривает за тем, чтобы тебе было «комфортно» пользоваться компьютером. Если она видит, что твой код мешает тебе смотреть YouTube, она бьет твой код по рукам.
                        - listitem [ref=e318]:
                          - paragraph [ref=e319]: Linux — это суровый профессиональный рабочий стол. Если ты сказал «жги на все деньги», он будет жечь, даже если от этого весь интерфейс застынет в одну картинку.
                      - paragraph [ref=e320]: "Именно поэтому: На Linux ты не увидишь спайков в 50 секунд. Если расчет занимает 1.3 мс, он будет занимать 1.3 мс и на первой, и на миллионной итерации. Браузер при этом может просто не открыться или работать со скоростью 1 кадр в секунду, но твой CFR-агент будет лететь с максимальной скоростью."
                      - paragraph [ref=e321]: Для твоего проекта (360 часов обучения) это критично. На Linux ты закончишь через 15 дней. На Windows со спайками ты можешь мучиться месяц, и в итоге получить ошибку драйвера на середине пути.
