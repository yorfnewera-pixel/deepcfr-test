                    - paragraph [ref=e306]:
                      - generic [ref=e530]: "## Наша красивая архитектура (9 изменений)"
                    - paragraph [ref=e307]:
                      - generic [ref=e531]: "### A. Softmax-policy (заменяет Regret Matching) Вместо π(a) = max(0,R(a))/Σmax(0,R(a)): - π(a) = softmax(advantages(a)/τ), τ падает от 5,0 до 0,5 за 3000 итераций - Всегда валидное соотношение, даже при всех отрицательных преимуществах - Использует отрицательные преимущества:fold=-0,35 vs поднять=-1.47 различимые - Спад температуры заменяет ε-жадный"
                    - paragraph [ref=e308]:
                      - generic [ref=e532]: "### B. DCFR+ Дисконтирование + Начальная загрузка Вместо ванильного CFR (все итерации равновесны): - замороженная prev_advantage_net (твердая копия раз в 6 итераций — полный цикл ротации) - Цель начальной загрузки: max(R_prev * Discount, 0) + r_current - Discount = (t-1)²/((t-1)²+1), α=2.0 - Очистка Advantage_memories[traversing_player] только для текущего игрока"
                    - paragraph [ref=e309]:
                      - generic [ref=e533]: "### C. Value Head (заменяет базовую линию running_mean) - value_head = nn.Linear(hidden, 1) в advantage_net - advantage = regret_raise - V(state).detach() - MSE loss для value_head"
                    - paragraph [ref=e310]:
                      - generic [ref=e534]: "### D. Числовая стабильность - Убран клип[-2,2] (log1p уже ограничен: log1p(10^18)≈41.5) - HuberLoss delta=5.0 (согласован с масштабом log1p ±5) - log1p для PG вознаграждение: ±200 → ±5.3 - log_prob clip [-5,5], log_std_min=-2"
                    - paragraph [ref=e311]:
