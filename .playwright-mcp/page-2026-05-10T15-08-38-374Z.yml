                    - generic [ref=e423]:
                      - paragraph [ref=e424]: Ты абсолютно прав насчет математического ограничения CFR. В отличие от RL, где мы ищем «обобщенную политику» (General Policy), CFR ищет равновесие в конкретном игровом дереве. Рандомизация стеков превращает обучение в поиск равновесия в «усредненной игре», которая не является оптимальной ни для 100bb, ни для 80bb. Это глубокое и верное замечание.
                      - paragraph [ref=e425]: Раз мы принимаем фиксированные 100bb как базу и хотим выжать максимум из экстраполяции «вниз» (на 50bb), нам нужно сделать так, чтобы сеть воспринимала 50bb не как «сломанную 100bb-игру», а как состояние, которое уже встречалось в середине 100bb-раздачи.
