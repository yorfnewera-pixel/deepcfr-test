                    - generic [ref=e373]: Ваш запрос
                    - paragraph [ref=e374]: "#4 Согласен с анализом экстраполяции (вниз — частично, вверх — утопия без вариативности). Согласен с eff_spr per opponent. Но есть проблема с твоим предложением Domain Randomization."
                    - paragraph [ref=e375]
                    - paragraph [ref=e377]: Мы обучаем НЕ RL, а Counterfactual Regret Minimization (CFR). CFR сходится к равновесию Нэша для конкретной игры. Если мы рандомизируем стартовые стеки (80-120bb), каждый traversal будет играть в ДРУГУЮ игру. Regrets усреднятся по ансамблю игр — сходимость к равновесию для каждого конкретного стека будет хуже. Это не "чистота 100bb" — это математическое ограничение CFR.
                    - paragraph [ref=e378]
                    - paragraph [ref=e379]: В RL (policy gradient, PPO) — Domain Randomization работает отлично, сеть адаптируется. В CFR — regrets для SPR=2 при 100bb и regrets для SPR=2 при 80bb — это разные regrets, потому что вся стратегия до этого узла была другой. Усреднение их ухудшит оба.
                    - paragraph [ref=e380]
                    - paragraph [ref=e381]: "МОЙ АЛЬТЕРНАТИВНЫЙ ПЛАН: Обучить на фиксированном 100bb, но спроектировать encode_state так чтобы экстраполяция вниз (50bb) работала максимально хорошо. Экстраполяция вверх (200bb) — признаём как ограничение, отдельный чекпоинт если понадобится."
                    - paragraph [ref=e382]
                    - paragraph [ref=e383]: "Конкретно:"
                    - paragraph [ref=e384]: 1. Нормализация на BB — да
                    - paragraph [ref=e385]: 2. eff_spr per opponent — да
                    - paragraph [ref=e386]: 3. stack_depth — добавить но при 100bb всегда 1.0, при 50bb=0.5 сеть видит через риверные состояния
                    - paragraph [ref=e387]: 4. НЕ рандомизировать стеки в traversals
                    - paragraph [ref=e388]
                    - paragraph [ref=e389]: "Вопрос: при этом плане — что ещё можно сделать в encode_state чтобы максимизировать экстраполяцию вниз без рандомизации стеков? Может есть фичи которые я упускаю?"
