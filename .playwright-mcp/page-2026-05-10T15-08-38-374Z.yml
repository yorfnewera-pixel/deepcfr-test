                          - paragraph [ref=e1043]: "Проблема «Спящего» кулера: В глубоких стеках (100bb) некоторые очень сильные линии (например, чек-рейз на сухом борде с сетом) могут иметь частоту как раз около 2-4%. Если ты жестко отсечешь их по порогу 3%, бот может стать «эксплуатируемым»: оппонент поймет, что в этой линии у тебя никогда нет сильных рук."
                        - listitem [ref=e1044]:
                          - paragraph [ref=e1045]: "Накопление ошибки: В CFR стратегия должна постепенно сходиться к равновесию. Если ты принудительно обнуляешь 3%, ты вносишь искусственное смещение (bias). Математически это уже не будет «чистым» Нэшем."
                      - separator [ref=e1046]
                      - heading "3. Как это лучше реализовать?" [level=3] [ref=e1047]
                      - paragraph [ref=e1048]:
                        - text: Если ты просто сделаешь
                        - code [ref=e1049]: "if p < 0.03: p = 0"
                        - text: ", ты нарушишь сумму вероятностей. Тебе нужно перераспределить этот остаток."
                      - paragraph [ref=e1050]: "Рекомендуемый алгоритм:"
                      - list [ref=e1051]:
                        - listitem [ref=e1052]:
                          - paragraph [ref=e1053]:
                            - text: Обнули все веса, которые ниже
                            - generic [ref=e1057]: "0.03"
                            - text: .
                        - listitem [ref=e1058]:
                          - paragraph [ref=e1059]:
                            - text: Нормализуй оставшиеся веса так, чтобы их сумма снова была равна
                            - generic [ref=e1063]: "1.0"
                            - text: .
                      - separator [ref=e1064]
                      - 'heading "4. Альтернатива: Динамический порог" [level=3] [ref=e1065]'
                      - paragraph [ref=e1066]: "Вместо жесткого «3% всегда», профи часто используют прогрессивную очистку:"
                      - list [ref=e1067]:
                        - listitem [ref=e1068]:
                          - paragraph [ref=e1069]: "В начале обучения (первые 50 часов): Порог 5% или даже выше. Пусть сеть сначала выучит «скелет» игры (основные рейзы и фолды)."
                        - listitem [ref=e1070]:
                          - paragraph [ref=e1071]: "В середине: Порог 2-3%."
                        - listitem [ref=e1072]:
                          - paragraph [ref=e1073]: "В финале (последние 100 часов): Порог 1% или полное отсутствие порога. Это позволит сети «дорисовать» тонкие блефы и ловушки, которые физически не могут занимать 5% диапазона."
                      - heading "Вердикт" [level=3] [ref=e1074]
                      - paragraph [ref=e1075]: 3% — это отличный, рабочий порог. Он делает стратегию «солидной».
                      - paragraph [ref=e1076]:
                        - text: Но учитывай специфику твоего
                        - code [ref=e1077]: sizing_head
                        - text: ": если у тебя много вариантов сайзинга (0.5x, 0.75x, 1.0x...), то каждый из них может по отдельности иметь 2%, а суммарно «Бет» — 30%. Важно: отсекай 3% не от конкретного сайзинга, а от типа действия, или делай это очень аккуратно, чтобы не превратить бота в предсказуемую машину, которая умеет ставить только один размер."
                      - blockquote [ref=e1078]:
                        - paragraph [ref=e1079]: "Совет: Попробуй начать с 2%. Это безопаснее для сохранения «защищенности» диапазонов (чтобы не выкинуть редкие натсы), но всё еще достаточно, чтобы убрать основной мусор."
                      - paragraph [ref=e1080]: Как думаешь, не станет ли твой бот слишком «прямолинейным» (ABC-покер), если мы уберем все действия с частотой ниже 3%?
