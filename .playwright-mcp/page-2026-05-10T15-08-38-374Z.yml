                    - paragraph [ref=e598]: "#1 Вопрос про нормализацию фичей в Deep CFR для покера."
                    - paragraph [ref=e599]
                    - paragraph [ref=e600]: "Контекст: Мы делаем Deep CFR для 6-max NLHE. Сейчас наш encode_state нормализует все монетарные фичи (pot, stake, bet_chips, min_bet) на initial_stake (= buy_in = 200 фишек). Это работает корректно благодаря инварианту stake+bet_chips+pot_chips = buy_in."
                    - paragraph [ref=e601]
                    - paragraph [ref=e602]: "Параметры игры: sb=1, bb=2, stake=200. То есть стек = 100bb."
                    - paragraph [ref=e603]
                    - paragraph [ref=e604]: "Вопрос: стоит ли заменить нормализацию с buy_in (200) на 100*bb (тоже 200 при текущих параметрах)?"
                    - paragraph [ref=e605]
                    - paragraph [ref=e606]: "Аргументы ЗА замену:"
                    - paragraph [ref=e607]: 1. При 100bb игре 100*bb = buy_in — математически то же самое, нулевая разница
                    - paragraph [ref=e608]: 2. Если потом играть с другим стеком (например stake=300 при bb=2, т.е. 150bb), нормализация на 100*bb даёт stack_depth = 300/200 = 1.5 — сеть видит что стек глубже стандартного
                    - paragraph [ref=e609]: "3. Универсальность: encode_state не привязан к конкретному buy_in"
                    - paragraph [ref=e610]
                    - paragraph [ref=e611]: "Аргументы ПРОТИВ замены:"
                    - paragraph [ref=e612]: 1. При текущем обучении (100bb) — нулевой эффект, трата времени
                    - paragraph [ref=e613]: 2. Инвариант stake+bet+pot = buy_in гарантирует что делитель = константа в течение всей раздачи — это свойство держится и при 100*bb (пока 100*bb = buy_in)
                    - paragraph [ref=e614]: 3. Но если buy_in ≠ 100*bb (например разные стартовые стеки у игроков), инвариант ломается — у каждого свой buy_in, а 100*bb всё ещё константа для стола
