                    - paragraph [ref=e1702]
                    - paragraph [ref=e1703]: 2) Signal-to-noise при t→∞ — это самый сильный аргумент. Действительно, при d≈1 свежий regret — капля в море накопленного предсказания. Принимаю как реальную проблему.
