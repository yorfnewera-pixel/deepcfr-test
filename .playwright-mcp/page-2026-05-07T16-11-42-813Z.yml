                    - paragraph [ref=e1707]: а) "Обучение замедлится до остановки при t→∞" — в оригинальном DCFR кумулятивные регреты тоже растут неограниченно. Сходимость DCFR доказана не потому что значения ограничены, а потому что РОСТ регретов сублинейный (регреты становятся всё более согласованными). Если сеть аппроксимирует сублинейный рост — зачем ей "догонять" бесконечность? Она должна аппроксимировать РАЗНИЦУ между стратегиями, а не абсолютные значения.
