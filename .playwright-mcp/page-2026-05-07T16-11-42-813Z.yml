                    - paragraph [ref=e1136]: "Промпт #2. С пунктом 3 про clamp(min=0) до сложения — согласен, это реальный баг. В DCFR max(0,...) применяется к финальной сумме, не на каждом шаге. Принимаю."
                    - paragraph [ref=e1137]
                    - paragraph [ref=e1139]: "Но оспариваю два пункта:"
                    - paragraph [ref=e1140]
                    - paragraph [ref=e1141]: "1) Deadly Triad: вы относите Deep CFR к off-policy обучению, но это неверно. На каждой итерации t сеть обучается на данных из traversal с текущими стратегиями всех игроков. Параметры prev_advantage_net заморожены — это target network в терминологии DQN, а не off-policy буфер. Deep CFR использует Prioritized Experience Replay, но данные в буфере — это (state, action, regret) пары из текущего traversal, не из старых политик. Триада требует именно off-policy: обучение на данных из другой политики. Здесь политика обновляется, но данные для таргета — свежие. Deadly Triad не применима."
                    - paragraph [ref=e1142]
                    - paragraph [ref=e1143]: "2) Накопление ошибки: вы пишете что ϵ^{t-1} входит в таргет рекурсивно и накапливается. Но раскроем рекурсию: R^T_approx = r^T + d_T * r^{T-1} + d_T * d_{T-1} * r^{T-2} + ... + (произведение d) * R^1 + (сумма ошибок с весами d). При discount→1 (d_t ≈ 1 для больших t) веса старых ошибок ϵ^{k} доминируются весом свежих r^t. Накопление — проблема при фиксированном γ<<1 как в TD(0), но при discount стремящемся к 1 это не \"разбегание\", а \"плавное приближение\". Где я ошибаюсь?"
