# Единственный игровой контракт: fold, check, call, raise 0.5 pot, raise pot, all-in.
num_actions: 6
num_players: 2
num_trainable_players: 2
# Отдельный HU self-play включается только с num_players == num_trainable_players == 2.
hu_current_policy_self_play: true
# Public history summary, несовместим с legacy_v2 чекпоинтами.
encoding_version: history_summary_v3
# Активный HU запуск использует нелинейное слияние карточного и контекстного embeddings.
network_architecture: card_context_v2

hidden_size: 256
advantage_lr: 1.0e-4
advantage_weight_decay: 1.0e-5
strategy_lr: 5.0e-5
strategy_weight_decay: 1.0e-5
advantage_batch_size: 2048
strategy_batch_size: 2048
advantage_epochs: 1
strategy_epochs: 1
advantage_train_steps: 75
# Average strategy обучается раз в 10 CFR-итераций и дополнительно перед final checkpoint.
strategy_train_steps: 500
strategy_train_every: 10
strategy_final_train_steps: 10000
teacher_strategy_checkpoint: null
# Stage A: переносит только card_encoder из версионированного полного HU checkpoint.
teacher_transfer_enabled: false
teacher_transfer_mode: card_encoder_warmstart
teacher_transfer_checkpoint: null
teacher_transfer_freeze_card_encoder: false
# Stage B ещё не реализован и намеренно отвергается при включении.
teacher_hu_aux_distillation_enabled: false
teacher_hu_aux_distillation_weight: 0.0
strategy_distillation_lambda: 0.0
strategy_distillation_temperature: 1.0
strategy_distillation_anneal_iterations: 0

advantage_memory_size: 100000
strategy_memory_size: 200000
# D2CFR хранит исторический reservoir в каждой HU advantage-ноге.
advantage_buffer_reservoir: true
strategy_buffer_reservoir: true
clear_strategy_buffer_each_iteration: false
save_replay_buffers_in_checkpoint: true

advantage_regret_norm: none
advantage_regret_clip: null
advantage_reward_scale: 200
advantage_loss: mse
advantage_huber_delta: 1.0
# Практический D2CFR-anchored для HU; MC correction заблокирован до belief.
algorithm_variant: d2cfr_anchored
d2cfr_enabled: true
d2cfr_loss_mode: anchored
d2cfr_loss_function: mse
d2cfr_state_value_loss_weight: 0.5
d2cfr_huber_delta: 1.0
d2cfr_reinitialize_each_iteration: true
d2cfr_iteration_weight_mode: batch_mean_1
d2cfr_mc_correction_enabled: false
traversal_baseline_enabled: false

policy_runtime_min_action_prob: 0.05
big_blind: 2.0
checkpoint_save_every: 1000
# HU full и light checkpoint сохраняются отдельно от six-max каждые 5000 итераций.
hu_checkpoint_save_every: 5000
# Milestone-интервал для HU full checkpoint; retention full/light изолирован по namespace.
checkpoint_keep_every: 50000
hu_checkpoint_keep_recent: 2
hu_checkpoint_keep_milestones: 2
traversal_single_thread: true
training_torch_threads: 12
training_preload_to_device: true
# Режим обработки ожидаемых ошибок при обходе дерева.
training_error_mode: strict
# Проверять инварианты игрового состояния во время обучения.
training_validate_state_invariants: false
# Допустимое число пропущенных обходов за итерацию.
training_max_failed_traversals_per_iteration: 3
process_priority: above_normal
