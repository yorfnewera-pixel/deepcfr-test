# Только быстрый технический smoke: не конфигурация для оценки силы.
num_actions: 6
num_players: 2
num_trainable_players: 2
hu_current_policy_self_play: true
encoding_version: history_summary_v3
network_architecture: monolithic_v1
hidden_size: 16

advantage_lr: 1.0e-4
advantage_weight_decay: 1.0e-5
strategy_lr: 5.0e-5
strategy_weight_decay: 1.0e-5
advantage_memory_size: 32
strategy_memory_size: 32
advantage_batch_size: 4
strategy_batch_size: 4
advantage_epochs: 1
strategy_epochs: 1
advantage_train_steps: null
strategy_train_steps: null
advantage_buffer_reservoir: true
strategy_buffer_reservoir: true
clear_strategy_buffer_each_iteration: false
save_replay_buffers_in_checkpoint: true

advantage_reward_scale: 200
advantage_regret_clip: null
d2cfr_enabled: true
d2cfr_regret_loss_weight: 1.0
d2cfr_state_value_loss_weight: 1.0
d2cfr_action_value_loss_weight: 1.0
d2cfr_reinitialize_each_iteration: true
d2cfr_iteration_weight_power: 1.0
d2cfr_mc_correction_enabled: false

hu_checkpoint_save_every: 1
checkpoint_save_every: 1
checkpoint_keep_every: 50000
traversal_single_thread: true
training_torch_threads: 1
training_preload_to_device: false
training_error_mode: strict
training_max_failed_traversals_per_iteration: 0
